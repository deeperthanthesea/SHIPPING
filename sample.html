<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Ulsan Port Charge Sample</title>

  <style>
    :root {
      --bg: #f4f5f6;
      --card: #ffffff;
      --text: #20262e;
      --muted: #858d96;
      --line: #dfe3e6;
      --dark: #202730;
      --soft: #eef0f2;

      --blue-bg: #edf5ff;
      --blue: #356fa8;

      --green-bg: #edf8f0;
      --green: #287742;

      --yellow-bg: #fff6dc;
      --yellow: #9a6a00;

      --remark-bg: #fff7e2;
      --remark-border: #e5ae35;
      --remark-text: #684d08;

      --red: #b54747;

      --radius: 15px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 22px 18px 50px;
    }

    /* =========================
       HEADER
       ========================= */

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 18px;
    }

    .page-title {
      margin: 0;
      font-size: 30px;
      font-weight: 950;
      letter-spacing: -0.7px;
    }

    .page-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .add-btn {
      flex: 0 0 auto;
      border: 0;
      border-radius: 11px;
      padding: 12px 15px;

      background: var(--dark);
      color: #fff;

      font-size: 11px;
      font-weight: 950;
    }

    /* =========================
       SEARCH
       ========================= */

    .search-box {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;

      padding: 14px;
      margin-bottom: 18px;
    }

    .search-title {
      margin-bottom: 10px;

      color: #777f87;
      font-size: 10px;
      font-weight: 950;
      letter-spacing: 0.7px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .search-input {
      width: 100%;

      padding: 13px 12px;

      border: 1px solid #ccd2d7;
      border-radius: 9px;

      outline: none;
      background: #fff;

      font-size: 13px;
    }

    .search-input:focus {
      border-color: #77818b;
    }

    /* =========================
       SAMPLE LIST
       ========================= */

    #sampleList {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sample-card {
      overflow: hidden;

      background: var(--card);

      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .sample-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 12px;

      padding: 16px 17px 14px;
    }

    .sample-main {
      min-width: 0;
    }

    .pier-label {
      margin-bottom: 5px;

      color: #90979f;

      font-size: 10px;
      font-weight: 950;
      letter-spacing: 0.7px;
    }

    .grt {
      margin: 0;

      color: var(--text);

      font-size: 20px;
      font-weight: 950;
      line-height: 1.25;
    }

    .grt small {
      color: #818991;
      font-size: 11px;
      font-weight: 850;
    }

    .sample-actions {
      display: flex;
      gap: 5px;
      flex: 0 0 auto;
    }

    .small-btn {
      border: 0;
      border-radius: 7px;

      padding: 7px 9px;

      background: #edf0f2;
      color: #59616a;

      font-size: 9px;
      font-weight: 950;
    }

    .small-btn.delete {
      background: #fff0f0;
      color: var(--red);
    }

    /* =========================
       CHARGES
       ========================= */

    .charges {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 8px;

      padding: 13px 14px 14px;

      border-top: 1px solid var(--line);
    }

    .charge {
      min-width: 0;

      padding: 13px 8px;

      border-radius: 10px;

      text-align: center;
    }

    .charge.tug {
      background: var(--blue-bg);
      color: var(--blue);
    }

    .charge.line {
      background: var(--green-bg);
      color: var(--green);
    }

    .charge.pilot {
      background: var(--yellow-bg);
      color: var(--yellow);
    }

    .charge-label {
      display: block;

      margin-bottom: 7px;

      font-size: 9px;
      font-weight: 950;
      letter-spacing: 0.6px;
    }

    .charge-value {
      display: block;

      color: #20262e;

      font-size: 15px;
      font-weight: 950;

      overflow-wrap: anywhere;
    }

    /* =========================
       TOTAL
       ========================= */

    .total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding: 12px 16px;

      background: #fafafa;

      border-top: 1px solid var(--line);
    }

    .total-label {
      color: #818991;

      font-size: 10px;
      font-weight: 950;
    }

    .total-value {
      color: #20262e;

      font-size: 15px;
      font-weight: 950;
    }

    /* =========================
       REMARK
       ========================= */

    .remark {
      margin: 0 14px 14px;
      padding: 12px 13px;

      background: var(--remark-bg);

      border: 1px solid #efd58c;
      border-left: 5px solid var(--remark-border);
      border-radius: 9px;

      color: var(--remark-text);
    }

    .remark-label {
      display: block;

      margin-bottom: 5px;

      color: #a66f00;

      font-size: 9px;
      font-weight: 950;
    }

    .remark-text {
      font-size: 11px;
      font-weight: 750;
      line-height: 1.5;

      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    /* =========================
       EMPTY
       ========================= */

    .empty {
      padding: 40px 15px;

      background: #fff;

      border: 1px solid var(--line);
      border-radius: var(--radius);

      color: var(--muted);

      text-align: center;

      font-size: 13px;
    }

    /* =========================
       MODAL
       ========================= */

    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 18px;

      background: rgba(19, 24, 29, 0.58);
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 560px;
      max-height: 92vh;

      overflow-y: auto;

      padding: 20px;

      background: #fff;

      border-radius: 17px;
    }

    .modal-title {
      margin: 0 0 18px;

      font-size: 21px;
      font-weight: 950;
    }

    .field {
      display: block;
      margin-bottom: 13px;
    }

    .field-label {
      display: block;

      margin-bottom: 6px;

      color: #747c84;

      font-size: 10px;
      font-weight: 950;
    }

    .field input,
    .field textarea {
      display: block;

      width: 100%;

      padding: 12px;

      border: 1px solid #d8dde1;
      border-radius: 9px;

      outline: none;

      background: #fff;
      color: var(--text);
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #77818b;
    }

    .money-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 7px;
    }

    .modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-top: 20px;
    }

    .modal-buttons button {
      border: 0;
      border-radius: 10px;

      padding: 13px;

      font-size: 11px;
      font-weight: 950;
    }

    .cancel-btn {
      background: #eceff1;
      color: #596169;
    }

    .save-btn {
      background: var(--dark);
      color: #fff;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .app {
        padding: 17px 11px 40px;
      }

      .page-head {
        align-items: center;
      }

      .page-title {
        font-size: 25px;
      }

      .page-subtitle {
        font-size: 11px;
      }

      .add-btn {
        padding: 11px 12px;
        font-size: 9px;
      }

      .search-box {
        padding: 11px;
      }

      .search-row {
        grid-template-columns: 1fr 1fr;
      }

      .search-input {
        padding: 11px 9px;
        font-size: 11px;
      }

      .sample-head {
        padding: 14px 13px 12px;
      }

      .grt {
        font-size: 18px;
      }

      .small-btn {
        padding: 6px 7px;
        font-size: 8px;
      }

      .charges {
        gap: 5px;
        padding: 10px;
      }

      .charge {
        padding: 11px 4px;
      }

      .charge-label {
        font-size: 8px;
      }

      .charge-value {
        font-size: 12px;
      }

      .total-row {
        padding: 11px 13px;
      }

      .total-value {
        font-size: 13px;
      }

      .remark {
        margin: 0 10px 10px;
      }

      .modal {
        padding: 17px 14px;
      }

      .money-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="page-head">

    <div>
      <h1 class="page-title">Sample</h1>

      <p class="page-subtitle">
        Ulsan port charge reference
      </p>
    </div>

    <button
      id="addBtn"
      class="add-btn"
      type="button"
    >
      + ADD SAMPLE
    </button>

  </header>


  <div class="search-box">

    <div class="search-title">
      FIND BY GRT / PIER
    </div>

    <div class="search-row">

      <input
        id="grtSearch"
        class="search-input"
        type="search"
        placeholder="GRT..."
      >

      <input
        id="pierSearch"
        class="search-input"
        type="search"
        placeholder="PIER..."
      >

    </div>

  </div>


  <main id="sampleList"></main>

</div>


<!-- EDITOR -->

<div
  id="modalBg"
  class="modal-bg"
>

  <div class="modal">

    <h2
      id="modalTitle"
      class="modal-title"
    >
      ADD SAMPLE
    </h2>


    <label class="field">

      <span class="field-label">
        GRT
      </span>

      <input
        id="grtInput"
        type="text"
        placeholder="e.g. 20,000"
      >

    </label>


    <label class="field">

      <span class="field-label">
        PIER
      </span>

      <input
        id="pierInput"
        type="text"
        placeholder="e.g. 6 PIER"
      >

    </label>


    <div class="money-grid">

      <label class="field">

        <span class="field-label">
          TUG
        </span>

        <input
          id="tugInput"
          type="text"
          inputmode="numeric"
          placeholder="0"
        >

      </label>


      <label class="field">

        <span class="field-label">
          LINE
        </span>

        <input
          id="lineInput"
          type="text"
          inputmode="numeric"
          placeholder="0"
        >

      </label>


      <label class="field">

        <span class="field-label">
          PILOT
        </span>

        <input
          id="pilotInput"
          type="text"
          inputmode="numeric"
          placeholder="0"
        >

      </label>

    </div>


    <label class="field">

      <span class="field-label">
        REMARK
      </span>

      <textarea
        id="remarkInput"
        placeholder="Remark / additional information..."
      ></textarea>

    </label>


    <div class="modal-buttons">

      <button
        id="cancelBtn"
        class="cancel-btn"
        type="button"
      >
        CANCEL
      </button>

      <button
        id="saveBtn"
        class="save-btn"
        type="button"
      >
        SAVE
      </button>

    </div>

  </div>

</div>


<script>
  /*
    ==========================================================
    IMPORTANT
    ==========================================================

    지금은 화면 테스트용.

    다음 단계에서 이 sampleData를
    GitHub의 sample-data.json에서 불러오도록 변경한다.

    저장 역시 Cargo와 동일하게
    sample-api Worker를 통해 GitHub에 저장한다.
  */


  let sampleData = [];

  let editingId = null;


  const sampleList =
    document.getElementById("sampleList");

  const grtSearch =
    document.getElementById("grtSearch");

  const pierSearch =
    document.getElementById("pierSearch");

  const modalBg =
    document.getElementById("modalBg");

  const modalTitle =
    document.getElementById("modalTitle");

  const grtInput =
    document.getElementById("grtInput");

  const pierInput =
    document.getElementById("pierInput");

  const tugInput =
    document.getElementById("tugInput");

  const lineInput =
    document.getElementById("lineInput");

  const pilotInput =
    document.getElementById("pilotInput");

  const remarkInput =
    document.getElementById("remarkInput");


  function escapeHTML(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function nextId() {

    if (!sampleData.length) {
      return 1;
    }

    return (
      Math.max(
        ...sampleData.map(function(item) {
          return Number(item.id) || 0;
        })
      ) + 1
    );
  }


  function moneyNumber(value) {

    const number =
      Number(
        String(value || "")
          .replace(/[^\d.-]/g, "")
      );

    return Number.isFinite(number)
      ? number
      : 0;
  }


  function moneyDisplay(value) {

    if (
      value === "" ||
      value === null ||
      value === undefined
    ) {
      return "—";
    }


    const number =
      moneyNumber(value);


    if (!number) {

      return escapeHTML(value);
    }


    return (
      "₩" +
      number.toLocaleString("ko-KR")
    );
  }


  function renderSamples() {

    const grtKeyword =
      grtSearch.value
        .trim()
        .toLowerCase();

    const pierKeyword =
      pierSearch.value
        .trim()
        .toLowerCase();


    const filtered =
      sampleData.filter(
        function(item) {

          const grt =
            String(item.grt || "")
              .toLowerCase();

          const pier =
            String(item.pier || "")
              .toLowerCase();


          const grtMatch =
            !grtKeyword ||
            grt.includes(grtKeyword);

          const pierMatch =
            !pierKeyword ||
            pier.includes(pierKeyword);


          return grtMatch && pierMatch;
        }
      );


    if (!filtered.length) {

      sampleList.innerHTML = `
        <div class="empty">
          ${
            sampleData.length
              ? "No matching sample found."
              : "No sample yet. Press + ADD SAMPLE."
          }
        </div>
      `;

      return;
    }


    sampleList.innerHTML =
      filtered.map(
        function(item) {

          const total =
            moneyNumber(item.tug) +
            moneyNumber(item.line) +
            moneyNumber(item.pilot);


          return `
            <article class="sample-card">

              <div class="sample-head">

                <div class="sample-main">

                  <div class="pier-label">
                    PIER · ${escapeHTML(
                      item.pier || "—"
                    )}
                  </div>

                  <h2 class="grt">

                    ${escapeHTML(
                      item.grt || "—"
                    )}

                    <small>
                      GRT
                    </small>

                  </h2>

                </div>


                <div class="sample-actions">

                  <button
                    class="small-btn"
                    type="button"
                    onclick="editSample(${Number(item.id)})"
                  >
                    EDIT
                  </button>

                  <button
                    class="small-btn delete"
                    type="button"
                    onclick="deleteSample(${Number(item.id)})"
                  >
                    DELETE
                  </button>

                </div>

              </div>


              <div class="charges">

                <div class="charge tug">

                  <span class="charge-label">
                    TUG
                  </span>

                  <strong class="charge-value">
                    ${moneyDisplay(item.tug)}
                  </strong>

                </div>


                <div class="charge line">

                  <span class="charge-label">
                    LINE
                  </span>

                  <strong class="charge-value">
                    ${moneyDisplay(item.line)}
                  </strong>

                </div>


                <div class="charge pilot">

                  <span class="charge-label">
                    PILOT
                  </span>

                  <strong class="charge-value">
                    ${moneyDisplay(item.pilot)}
                  </strong>

                </div>

              </div>


              <div class="total-row">

                <span class="total-label">
                  TOTAL
                </span>

                <strong class="total-value">
                  ₩${total.toLocaleString("ko-KR")}
                </strong>

              </div>


              ${
                item.remark
                  ? `
                    <div class="remark">

                      <span class="remark-label">
                        REMARK
                      </span>

                      <div class="remark-text">${escapeHTML(
                        item.remark
                      )}</div>

                    </div>
                  `
                  : ""
              }

            </article>
          `;

        }
      ).join("");
  }


  function openModal(item) {

    if (item) {

      editingId =
        Number(item.id);

      modalTitle.textContent =
        "EDIT SAMPLE";

      grtInput.value =
        item.grt || "";

      pierInput.value =
        item.pier || "";

      tugInput.value =
        item.tug || "";

      lineInput.value =
        item.line || "";

      pilotInput.value =
        item.pilot || "";

      remarkInput.value =
        item.remark || "";


    } else {

      editingId = null;

      modalTitle.textContent =
        "ADD SAMPLE";

      grtInput.value = "";
      pierInput.value = "";
      tugInput.value = "";
      lineInput.value = "";
      pilotInput.value = "";
      remarkInput.value = "";
    }


    modalBg.classList.add("show");


    setTimeout(
      function() {
        grtInput.focus();
      },
      50
    );
  }


  function closeModal() {

    modalBg.classList.remove("show");
  }


  document
    .getElementById("addBtn")
    .addEventListener(
      "click",
      function() {
        openModal(null);
      }
    );


  document
    .getElementById("cancelBtn")
    .addEventListener(
      "click",
      closeModal
    );


  document
    .getElementById("saveBtn")
    .addEventListener(
      "click",
      function() {

        const grt =
          grtInput.value.trim();

        const pier =
          pierInput.value.trim();


        if (!grt) {

          alert("Please enter GRT.");

          grtInput.focus();

          return;
        }


        if (!pier) {

          alert("Please enter PIER.");

          pierInput.focus();

          return;
        }


        const newItem = {

          id:
            editingId !== null
              ? editingId
              : nextId(),

          grt: grt,

          pier: pier,

          tug:
            tugInput.value.trim(),

          line:
            lineInput.value.trim(),

          pilot:
            pilotInput.value.trim(),

          remark:
            remarkInput.value.trim()
        };


        if (editingId !== null) {

          sampleData =
            sampleData.map(
              function(item) {

                return (
                  Number(item.id) ===
                  Number(editingId)
                )
                  ? newItem
                  : item;
              }
            );

        } else {

          sampleData.push(newItem);
        }


        renderSamples();

        closeModal();
      }
    );


  window.editSample =
    function(id) {

      const item =
        sampleData.find(
          function(sample) {

            return (
              Number(sample.id) ===
              Number(id)
            );
          }
        );


      if (item) {
        openModal(item);
      }
    };


  window.deleteSample =
    function(id) {

      const item =
        sampleData.find(
          function(sample) {

            return (
              Number(sample.id) ===
              Number(id)
            );
          }
        );


      if (!item) {
        return;
      }


      if (
        !confirm(
          "Delete this sample?"
        )
      ) {
        return;
      }


      sampleData =
        sampleData.filter(
          function(sample) {

            return (
              Number(sample.id) !==
              Number(id)
            );
          }
        );


      renderSamples();
    };


  grtSearch.addEventListener(
    "input",
    renderSamples
  );


  pierSearch.addEventListener(
    "input",
    renderSamples
  );


  modalBg.addEventListener(
    "click",
    function(event) {

      if (event.target === modalBg) {
        closeModal();
      }
    }
  );


  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Escape" &&
        modalBg.classList.contains("show")
      ) {
        closeModal();
      }
    }
  );


  renderSamples();
</script>

</body>
</html>
