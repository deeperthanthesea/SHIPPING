<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Ulsan Port Cost Sample</title>

  <style>
    :root {
      --bg: #f4f5f6;
      --card: #ffffff;
      --text: #20262e;
      --muted: #858d96;
      --line: #dfe3e6;
      --soft: #eef0f2;
      --dark: #202730;

      --main: #2f6fed;
      --main-soft: #edf3ff;

      --onsan: #218739;
      --onsan-soft: #edf8ef;

      --other: #8b5a2b;
      --other-soft: #fff5e9;

      --red: #b54747;

      --radius: 15px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 900px;

      margin: 0 auto;
      padding: 22px 18px 50px;
    }

    /* =========================================
       HEADER
       ========================================= */

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 18px;
    }

    .page-title {
      margin: 0;

      font-size: 30px;
      font-weight: 950;
      letter-spacing: -0.7px;
    }

    .page-subtitle {
      margin: 5px 0 0;

      color: var(--muted);

      font-size: 12px;
      font-weight: 600;
    }

    .add-btn {
      flex: 0 0 auto;

      border: 0;
      border-radius: 11px;

      padding: 12px 15px;

      background: var(--dark);
      color: #fff;

      font-size: 11px;
      font-weight: 950;
    }

    /* =========================================
       STATUS
       ========================================= */

    .status {
      display: none;

      margin-bottom: 12px;
      padding: 11px 13px;

      border-radius: 9px;

      font-size: 12px;
      font-weight: 800;
      line-height: 1.4;
    }

    .status.show {
      display: block;
    }

    .status.loading {
      background: #eef3f7;
      color: #53606b;
    }

    .status.success {
      background: #e9f6ec;
      color: #28723a;
    }

    .status.error {
      background: #fff0f0;
      color: #a13f3f;
    }

    /* =========================================
       FILTER
       ========================================= */

    .toolbar {
      display: grid;

      grid-template-columns: 1fr auto;

      gap: 10px;

      margin-bottom: 18px;
    }

    .search {
      width: 100%;

      padding: 14px 15px;

      border: 1px solid #ccd2d7;
      border-radius: 11px;

      outline: none;

      background: #fff;
      color: var(--text);

      font-size: 14px;
    }

    .search:focus {
      border-color: #7f8993;
    }

    .filter {
      padding: 0 13px;

      border: 1px solid #ccd2d7;
      border-radius: 11px;

      outline: none;

      background: #fff;
      color: var(--text);

      font-size: 12px;
      font-weight: 800;
    }

    /* =========================================
       PIER GROUP
       ========================================= */

    #sampleList {
      display: flex;
      flex-direction: column;

      gap: 22px;
    }

    .pier-group {
      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    .pier-title {
      display: flex;
      align-items: center;

      gap: 9px;

      padding: 0 2px;
    }

    .pier-title-text {
      font-size: 14px;
      font-weight: 950;
      letter-spacing: 0.4px;
    }

    .pier-count {
      padding: 3px 7px;

      background: #e5e8eb;

      border-radius: 999px;

      color: #737b83;

      font-size: 9px;
      font-weight: 950;
    }

    .pier-group.main .pier-title-text {
      color: var(--main);
    }

    .pier-group.onsan .pier-title-text {
      color: var(--onsan);
    }

    .pier-group.other .pier-title-text {
      color: var(--other);
    }

    /* =========================================
       SAMPLE CARD
       ========================================= */

    .sample-card {
      overflow: hidden;

      background: var(--card);

      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .sample-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      padding: 15px 17px;
    }

    .grt-area {
      min-width: 0;
    }

    .grt-label {
      margin-bottom: 3px;

      color: #949ba2;

      font-size: 9px;
      font-weight: 950;
      letter-spacing: 0.7px;
    }

    .grt {
      margin: 0;

      font-size: 21px;
      font-weight: 950;
      letter-spacing: -0.4px;
    }

    .grt-unit {
      margin-left: 4px;

      color: #8d949b;

      font-size: 10px;
      font-weight: 800;
    }

    .sample-actions {
      display: flex;
      flex: 0 0 auto;

      gap: 5px;
    }

    .small-btn {
      border: 0;
      border-radius: 7px;

      padding: 7px 9px;

      background: #edf0f2;
      color: #59616a;

      font-size: 9px;
      font-weight: 950;
    }

    .small-btn.delete {
      background: #fff0f0;
      color: var(--red);
    }

    /* =========================================
       COST
       ========================================= */

    .cost-grid {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      border-top: 1px solid var(--line);
    }

    .cost-item {
      min-width: 0;

      padding: 14px 13px;

      border-right: 1px solid var(--line);
    }

    .cost-item:last-child {
      border-right: 0;
    }

    .cost-label {
      margin-bottom: 6px;

      color: #8d949b;

      font-size: 9px;
      font-weight: 950;
      letter-spacing: 0.6px;
    }

    .cost-value {
      color: #20262e;

      font-size: 14px;
      font-weight: 950;

      overflow-wrap: anywhere;
    }

    .won {
      margin-left: 2px;

      color: #969da4;

      font-size: 9px;
      font-weight: 800;
    }

    .tug-count {
      display: inline-block;

      margin-top: 6px;
      padding: 4px 7px;

      background: #fff0f0;

      border-radius: 6px;

      color: #d13c3c;

      font-size: 9px;
      font-weight: 950;
    }

    /* =========================================
       REMARK
       ========================================= */

    .remark {
      padding: 12px 15px;

      border-top: 1px solid var(--line);

      background: #fafafa;
    }

    .remark-label {
      display: block;

      margin-bottom: 5px;

      color: #969da4;

      font-size: 9px;
      font-weight: 950;
      letter-spacing: 0.6px;
    }

    .remark-text {
      color: #626a72;

      font-size: 11px;
      font-weight: 650;
      line-height: 1.5;

      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    /* =========================================
       EMPTY
       ========================================= */

    .empty {
      padding: 40px 15px;

      background: #fff;

      border: 1px solid var(--line);
      border-radius: var(--radius);

      color: var(--muted);

      text-align: center;

      font-size: 13px;
    }

    /* =========================================
       MODAL
       ========================================= */

    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 18px;

      background: rgba(19, 24, 29, 0.58);
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 560px;
      max-height: 92vh;

      overflow-y: auto;

      padding: 20px;

      background: #fff;

      border-radius: 17px;
    }

    .modal-title {
      margin: 0 0 18px;

      font-size: 21px;
      font-weight: 950;
    }

    .field {
      display: block;

      margin-bottom: 13px;
    }

    .field-label {
      display: block;

      margin-bottom: 6px;

      color: #747c84;

      font-size: 10px;
      font-weight: 950;
    }

    .field input,
    .field select,
    .field textarea {
      display: block;

      width: 100%;

      padding: 12px;

      border: 1px solid #d8dde1;
      border-radius: 9px;

      outline: none;

      background: #fff;
      color: var(--text);
    }

    .field textarea {
      min-height: 95px;

      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #77818b;
    }

    .money-wrap {
      position: relative;
    }

    .money-wrap input {
      padding-right: 48px;
    }

    .money-unit {
      position: absolute;

      top: 50%;
      right: 13px;

      transform: translateY(-50%);

      color: #999fa5;

      font-size: 10px;
      font-weight: 900;

      pointer-events: none;
    }

    /* =========================================
       TUG
       ========================================= */

    .tug-box {
      display: grid;

      grid-template-columns: 1fr 110px;

      gap: 8px;
    }

    /* =========================================
       MODAL BUTTON
       ========================================= */

    .modal-buttons {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-top: 20px;
    }

    .modal-buttons button {
      border: 0;
      border-radius: 10px;

      padding: 13px;

      font-size: 11px;
      font-weight: 950;
    }

    .cancel-btn {
      background: #eceff1;
      color: #596169;
    }

    .save-btn {
      background: var(--dark);
      color: #fff;
    }

    .save-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 600px) {
      .app {
        padding: 17px 11px 40px;
      }

      .page-head {
        align-items: center;
      }

      .page-title {
        font-size: 25px;
      }

      .page-subtitle {
        font-size: 11px;
      }

      .add-btn {
        padding: 11px 12px;

        font-size: 9px;
      }

      .toolbar {
        grid-template-columns: 1fr 105px;

        gap: 7px;
      }

      .search {
        padding: 12px;

        font-size: 12px;
      }

      .filter {
        padding: 0 8px;

        font-size: 10px;
      }

      .sample-head {
        padding: 13px 12px;
      }

      .grt {
        font-size: 19px;
      }

      .small-btn {
        padding: 6px 7px;

        font-size: 8px;
      }

      .cost-item {
        padding: 12px 8px;
      }

      .cost-label {
        font-size: 8px;
      }

      .cost-value {
        font-size: 11px;
      }

      .won {
        font-size: 8px;
      }

      .tug-count {
        font-size: 8px;
      }

      .modal {
        padding: 17px 14px;
      }

      .tug-box {
        grid-template-columns: 1fr 100px;
      }
    }

    @media (max-width: 370px) {
      .cost-value {
        font-size: 10px;
      }

      .toolbar {
        grid-template-columns: 1fr 95px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="page-head">

    <div>

      <h1 class="page-title">
        Sample
      </h1>

      <p class="page-subtitle">
        Ulsan port cost reference
      </p>

    </div>

    <button
      id="addSampleBtn"
      class="add-btn"
      type="button"
    >
      + ADD SAMPLE
    </button>

  </header>


  <div
    id="status"
    class="status"
  ></div>


  <div class="toolbar">

    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="Search GRT..."
      inputmode="numeric"
      autocomplete="off"
    >

    <select
      id="pierFilter"
      class="filter"
    >
      <option value="ALL">
        ALL PIER
      </option>

      <option value="MAIN">
        MAIN
      </option>

      <option value="ONSAN">
        ONSAN
      </option>

      <option value="OTHER">
        OTHER
      </option>
    </select>

  </div>


  <main id="sampleList">

    <div class="empty">
      Loading sample data...
    </div>

  </main>

</div>


<!-- =========================================
     SAMPLE MODAL
     ========================================= -->

<div
  id="sampleModal"
  class="modal-bg"
>

  <div class="modal">

    <h2
      id="modalTitle"
      class="modal-title"
    >
      ADD SAMPLE
    </h2>


    <label class="field">

      <span class="field-label">
        PIER
      </span>

      <select id="pierInput">

        <option value="MAIN">
          MAIN
        </option>

        <option value="ONSAN">
          ONSAN
        </option>

        <option value="OTHER">
          OTHER
        </option>

      </select>

    </label>


    <label class="field">

      <span class="field-label">
        GRT
      </span>

      <input
        id="grtInput"
        type="text"
        inputmode="numeric"
        placeholder="e.g. 20,000"
        autocomplete="off"
      >

    </label>


    <label class="field">

      <span class="field-label">
        PILOT
      </span>

      <div class="money-wrap">

        <input
          id="pilotInput"
          type="text"
          inputmode="numeric"
          placeholder="0"
          autocomplete="off"
        >

        <span class="money-unit">
          WON
        </span>

      </div>

    </label>


    <label class="field">

      <span class="field-label">
        LINE
      </span>

      <div class="money-wrap">

        <input
          id="lineInput"
          type="text"
          inputmode="numeric"
          placeholder="0"
          autocomplete="off"
        >

        <span class="money-unit">
          WON
        </span>

      </div>

    </label>


    <label class="field">

      <span class="field-label">
        TUG
      </span>

      <div class="tug-box">

        <div class="money-wrap">

          <input
            id="tugInput"
            type="text"
            inputmode="numeric"
            placeholder="0"
            autocomplete="off"
          >

          <span class="money-unit">
            WON
          </span>

        </div>


        <select id="tugCountInput">

          <option value="1">
            1 TUG
          </option>

          <option value="2">
            2 TUGS
          </option>

        </select>

      </div>

    </label>


    <label class="field">

      <span class="field-label">
        REMARK
      </span>

      <textarea
        id="remarkInput"
        placeholder="Remark / additional information..."
      ></textarea>

    </label>


    <div class="modal-buttons">

      <button
        id="cancelBtn"
        class="cancel-btn"
        type="button"
      >
        CANCEL
      </button>

      <button
        id="saveBtn"
        class="save-btn"
        type="button"
      >
        SAVE
      </button>

    </div>

  </div>

</div>


<script>
  /* =========================================
     API

     다음 단계에서 만들 Worker 주소.
     Worker를 만든 뒤 주소가 다르면
     이 한 줄만 바꾸면 됨.
     ========================================= */

  const API_URL =
    "https://sample-api.makepdaquickly.workers.dev/api/sample";


  /* =========================================
     STATE
     ========================================= */

  let sampleData = [];

  let editingSampleId = null;


  /* =========================================
     ELEMENTS
     ========================================= */

  const sampleList =
    document.getElementById("sampleList");

  const searchInput =
    document.getElementById("searchInput");

  const pierFilter =
    document.getElementById("pierFilter");

  const statusElement =
    document.getElementById("status");

  const sampleModal =
    document.getElementById("sampleModal");

  const modalTitle =
    document.getElementById("modalTitle");

  const pierInput =
    document.getElementById("pierInput");

  const grtInput =
    document.getElementById("grtInput");

  const pilotInput =
    document.getElementById("pilotInput");

  const lineInput =
    document.getElementById("lineInput");

  const tugInput =
    document.getElementById("tugInput");

  const tugCountInput =
    document.getElementById("tugCountInput");

  const remarkInput =
    document.getElementById("remarkInput");

  const saveBtn =
    document.getElementById("saveBtn");


  /* =========================================
     HELPERS
     ========================================= */

  function escapeHTML(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function cloneData(value) {
    return JSON.parse(
      JSON.stringify(value)
    );
  }


  function onlyNumbers(value) {
    return String(value ?? "")
      .replace(/[^\d]/g, "");
  }


  function numberValue(value) {
    const cleaned =
      onlyNumbers(value);

    if (!cleaned) {
      return 0;
    }

    return Number(cleaned);
  }


  function formatNumber(value) {
    const number =
      numberValue(value);

    return number.toLocaleString("en-US");
  }


  function formatInputValue(value) {
    const cleaned =
      onlyNumbers(value);

    if (!cleaned) {
      return "";
    }

    return Number(cleaned)
      .toLocaleString("en-US");
  }


  function formatMoney(value) {
    return Number(value || 0)
      .toLocaleString("en-US");
  }


  function showStatus(
    message,
    type = "loading"
  ) {
    statusElement.textContent =
      message;

    statusElement.className =
      "status show " + type;
  }


  function hideStatus() {
    statusElement.className =
      "status";

    statusElement.textContent =
      "";
  }


  function nextId() {
    if (!sampleData.length) {
      return 1;
    }

    return (
      Math.max(
        ...sampleData.map(
          function(item) {
            return Number(item.id) || 0;
          }
        )
      ) + 1
    );
  }


  function pierOrder(pier) {
    if (pier === "MAIN") {
      return 1;
    }

    if (pier === "ONSAN") {
      return 2;
    }

    return 3;
  }


  /* =========================================
     AUTO COMMA INPUT
     ========================================= */

  function attachNumberFormatter(input) {
    input.addEventListener(
      "input",
      function() {
        const cursorAtEnd =
          input.selectionStart ===
          input.value.length;

        input.value =
          formatInputValue(
            input.value
          );

        if (cursorAtEnd) {
          input.setSelectionRange(
            input.value.length,
            input.value.length
          );
        }
      }
    );
  }


  attachNumberFormatter(grtInput);
  attachNumberFormatter(pilotInput);
  attachNumberFormatter(lineInput);
  attachNumberFormatter(tugInput);


  /* =========================================
     LOAD
     ========================================= */

  async function loadSamples() {

    showStatus(
      "Loading sample data...",
      "loading"
    );

    try {

      const response =
        await fetch(
          API_URL + "?t=" + Date.now(),
          {
            method: "GET",
            cache: "no-store"
          }
        );


      const result =
        await response.json();


      if (
        !response.ok ||
        !result.ok ||
        !Array.isArray(result.data)
      ) {
        throw new Error(
          result.error ||
          "Sample data could not be loaded."
        );
      }


      sampleData =
        result.data;


      sortSampleData();

      renderSamples();

      hideStatus();


    } catch (error) {

      console.error(error);


      showStatus(
        "Failed to load sample data. " +
        error.message,
        "error"
      );


      sampleList.innerHTML = `
        <div class="empty">
          Sample data could not be loaded.
        </div>
      `;
    }
  }


  /* =========================================
     SAVE ALL
     ========================================= */

  async function saveAllSamples() {

    sortSampleData();


    showStatus(
      "Saving to GitHub...",
      "loading"
    );


    const response =
      await fetch(
        API_URL,
        {
          method: "PUT",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              data: sampleData
            })
        }
      );


    let result;


    try {

      result =
        await response.json();

    } catch {

      throw new Error(
        "Invalid response from server."
      );
    }


    if (
      !response.ok ||
      !result.ok
    ) {

      throw new Error(
        result.error ||
        "GitHub save failed."
      );
    }


    showStatus(
      "Saved to GitHub.",
      "success"
    );


    setTimeout(
      function() {

        if (
          statusElement.classList
            .contains("success")
        ) {
          hideStatus();
        }

      },
      2200
    );


    return result;
  }


  /* =========================================
     SORT
     ========================================= */

  function sortSampleData() {

    sampleData.sort(
      function(a, b) {

        const pierDifference =
          pierOrder(a.pier) -
          pierOrder(b.pier);


        if (pierDifference !== 0) {
          return pierDifference;
        }


        return (
          Number(a.grt || 0) -
          Number(b.grt || 0)
        );
      }
    );
  }


  /* =========================================
     RENDER
     ========================================= */

  function renderSamples() {

    sortSampleData();


    const keyword =
      onlyNumbers(
        searchInput.value
      );


    const selectedPier =
      pierFilter.value;


    const filtered =
      sampleData.filter(
        function(item) {

          if (
            selectedPier !== "ALL" &&
            item.pier !== selectedPier
          ) {
            return false;
          }


          if (keyword) {

            const grtText =
              String(
                Number(item.grt || 0)
              );

            if (
              !grtText.includes(keyword)
            ) {
              return false;
            }
          }


          return true;
        }
      );


    if (!filtered.length) {

      sampleList.innerHTML = `
        <div class="empty">
          No sample found.
        </div>
      `;

      return;
    }


    const groups = {
      MAIN: [],
      ONSAN: [],
      OTHER: []
    };


    filtered.forEach(
      function(item) {

        const pier =
          groups[item.pier]
            ? item.pier
            : "OTHER";


        groups[pier].push(item);
      }
    );


    const order = [
      "MAIN",
      "ONSAN",
      "OTHER"
    ];


    sampleList.innerHTML =
      order
        .filter(
          function(pier) {
            return groups[pier].length;
          }
        )
        .map(
          function(pier) {

            return renderPierGroup(
              pier,
              groups[pier]
            );
          }
        )
        .join("");
  }


  function renderPierGroup(
    pier,
    items
  ) {

    return `
      <section class="pier-group ${pier.toLowerCase()}">

        <div class="pier-title">

          <div class="pier-title-text">
            ${escapeHTML(pier)}
          </div>

          <div class="pier-count">
            ${items.length}
          </div>

        </div>

        ${
          items.map(
            function(item) {
              return renderSampleCard(item);
            }
          ).join("")
        }

      </section>
    `;
  }


  function renderSampleCard(item) {

    const tugCount =
      Number(item.tugCount) === 2
        ? 2
        : 1;


    return `
      <article class="sample-card">

        <div class="sample-head">

          <div class="grt-area">

            <div class="grt-label">
              GRT
            </div>

            <h2 class="grt">
              ${formatNumber(item.grt)}

              <span class="grt-unit">
                GRT
              </span>
            </h2>

          </div>


          <div class="sample-actions">

            <button
              class="small-btn"
              type="button"
              onclick="editSample(${Number(item.id)})"
            >
              EDIT
            </button>

            <button
              class="small-btn delete"
              type="button"
              onclick="deleteSample(${Number(item.id)})"
            >
              DELETE
            </button>

          </div>

        </div>


        <div class="cost-grid">

          <div class="cost-item">

            <div class="cost-label">
              PILOT
            </div>

            <div class="cost-value">
              ${formatMoney(item.pilot)}

              <span class="won">
                WON
              </span>
            </div>

          </div>


          <div class="cost-item">

            <div class="cost-label">
              LINE
            </div>

            <div class="cost-value">
              ${formatMoney(item.line)}

              <span class="won">
                WON
              </span>
            </div>

          </div>


          <div class="cost-item">

            <div class="cost-label">
              TUG
            </div>

            <div class="cost-value">
              ${formatMoney(item.tug)}

              <span class="won">
                WON
              </span>
            </div>

            <div class="tug-count">
              ${
                tugCount === 2
                  ? "2 TUGS"
                  : "1 TUG"
              }
            </div>

          </div>

        </div>


        ${
          item.remark
            ? `
              <div class="remark">

                <span class="remark-label">
                  REMARK
                </span>

                <div class="remark-text">${escapeHTML(
                  item.remark
                )}</div>

              </div>
            `
            : ""
        }

      </article>
    `;
  }


  /* =========================================
     FILTER EVENTS
     ========================================= */

  searchInput.addEventListener(
    "input",
    renderSamples
  );


  pierFilter.addEventListener(
    "change",
    renderSamples
  );


  /* =========================================
     MODAL
     ========================================= */

  function openSampleModal(item) {

    if (item) {

      editingSampleId =
        Number(item.id);


      modalTitle.textContent =
        "EDIT SAMPLE";


      pierInput.value =
        ["MAIN", "ONSAN", "OTHER"]
          .includes(item.pier)
          ? item.pier
          : "OTHER";


      grtInput.value =
        formatInputValue(
          item.grt
        );


      pilotInput.value =
        formatInputValue(
          item.pilot
        );


      lineInput.value =
        formatInputValue(
          item.line
        );


      tugInput.value =
        formatInputValue(
          item.tug
        );


      tugCountInput.value =
        Number(item.tugCount) === 2
          ? "2"
          : "1";


      remarkInput.value =
        item.remark || "";


    } else {

      editingSampleId = null;


      modalTitle.textContent =
        "ADD SAMPLE";


      pierInput.value =
        "MAIN";


      grtInput.value = "";

      pilotInput.value = "";

      lineInput.value = "";

      tugInput.value = "";

      tugCountInput.value =
        "1";

      remarkInput.value = "";
    }


    sampleModal.classList.add(
      "show"
    );


    setTimeout(
      function() {
        grtInput.focus();
      },
      50
    );
  }


  function closeSampleModal() {
    sampleModal.classList.remove(
      "show"
    );
  }


  /* =========================================
     ADD
     ========================================= */

  document
    .getElementById("addSampleBtn")
    .addEventListener(
      "click",
      function() {
        openSampleModal(null);
      }
    );


  /* =========================================
     EDIT
     ========================================= */

  window.editSample =
    function(id) {

      const item =
        sampleData.find(
          function(sample) {

            return (
              Number(sample.id) ===
              Number(id)
            );
          }
        );


      if (!item) {
        return;
      }


      openSampleModal(item);
    };


  /* =========================================
     DELETE
     ========================================= */

  window.deleteSample =
    async function(id) {

      const item =
        sampleData.find(
          function(sample) {

            return (
              Number(sample.id) ===
              Number(id)
            );
          }
        );


      if (!item) {
        return;
      }


      const confirmed =
        confirm(
          "Delete GRT " +
          formatNumber(item.grt) +
          " / " +
          item.pier +
          "?"
        );


      if (!confirmed) {
        return;
      }


      const backup =
        cloneData(sampleData);


      sampleData =
        sampleData.filter(
          function(sample) {

            return (
              Number(sample.id) !==
              Number(id)
            );
          }
        );


      renderSamples();


      try {

        await saveAllSamples();

      } catch (error) {

        console.error(error);


        sampleData =
          backup;


        renderSamples();


        showStatus(
          "Delete failed. " +
          error.message,
          "error"
        );


        alert(
          "DELETE FAILED\n\n" +
          error.message
        );
      }
    };


  /* =========================================
     SAVE SAMPLE
     ========================================= */

  saveBtn.addEventListener(
    "click",
    async function() {

      const grt =
        numberValue(
          grtInput.value
        );


      if (!grt) {

        alert(
          "Please enter GRT."
        );

        grtInput.focus();

        return;
      }


      const newItem = {

        id:
          editingSampleId !== null
            ? editingSampleId
            : nextId(),

        pier:
          pierInput.value,

        grt:
          grt,

        pilot:
          numberValue(
            pilotInput.value
          ),

        line:
          numberValue(
            lineInput.value
          ),

        tug:
          numberValue(
            tugInput.value
          ),

        tugCount:
          Number(
            tugCountInput.value
          ) === 2
            ? 2
            : 1,

        remark:
          remarkInput.value.trim()
      };


      const backup =
        cloneData(sampleData);


      if (
        editingSampleId !== null
      ) {

        sampleData =
          sampleData.map(
            function(item) {

              if (
                Number(item.id) ===
                Number(editingSampleId)
              ) {
                return newItem;
              }

              return item;
            }
          );

      } else {

        sampleData.push(
          newItem
        );
      }


      sortSampleData();

      renderSamples();


      saveBtn.disabled = true;

      saveBtn.textContent =
        "SAVING...";


      try {

        await saveAllSamples();

        closeSampleModal();


      } catch (error) {

        console.error(error);


        sampleData =
          backup;


        renderSamples();


        showStatus(
          "Save failed. " +
          error.message,
          "error"
        );


        alert(
          "SAVE FAILED\n\n" +
          error.message
        );


      } finally {

        saveBtn.disabled = false;

        saveBtn.textContent =
          "SAVE";
      }
    }
  );


  /* =========================================
     CANCEL
     ========================================= */

  document
    .getElementById("cancelBtn")
    .addEventListener(
      "click",
      closeSampleModal
    );


  sampleModal.addEventListener(
    "click",
    function(event) {

      if (
        event.target === sampleModal
      ) {
        closeSampleModal();
      }
    }
  );


  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Escape" &&
        sampleModal.classList
          .contains("show")
      ) {
        closeSampleModal();
      }
    }
  );


  /* =========================================
     INITIAL LOAD
     ========================================= */

  loadSamples();
</script>

</body>
</html>
