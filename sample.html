<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Ulsan Port Cost Sample</title>

  <style>
    :root {
      --bg: #f4f5f6;
      --card: #ffffff;
      --text: #17202a;
      --muted: #87919c;
      --line: #dce1e5;
      --dark: #202730;

      --blue: #2865dc;
      --blue-bg: #eef6ff;

      --green: #368154;
      --green-bg: #eef9f2;

      --orange: #b56b13;
      --orange-bg: #fff6e8;

      --red: #e23636;
      --red-bg: #fff0f0;

      --radius: 15px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 900px;

      margin: 0 auto;
      padding: 20px 13px 50px;
    }

    /* =========================
       HEADER
       ========================= */

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 14px;

      margin-bottom: 17px;
    }

    .page-title {
      margin: 0;

      font-size: 30px;
      font-weight: 950;
      letter-spacing: -0.8px;
    }

    .page-subtitle {
      margin: 5px 0 0;

      color: var(--muted);

      font-size: 12px;
      font-weight: 650;
    }

    .add-btn {
      flex: 0 0 auto;

      padding: 12px 15px;

      border: 0;
      border-radius: 11px;

      background: var(--dark);
      color: #fff;

      font-size: 10px;
      font-weight: 950;
    }

    /* =========================
       STATUS
       ========================= */

    .status {
      display: none;

      margin-bottom: 12px;
      padding: 11px 13px;

      border-radius: 9px;

      font-size: 12px;
      font-weight: 800;
      line-height: 1.4;
    }

    .status.show {
      display: block;
    }

    .status.loading {
      background: #edf3f7;
      color: #52606c;
    }

    .status.success {
      background: #eaf7ed;
      color: #28713b;
    }

    .status.error {
      background: #fff0f0;
      color: #a13e3e;
    }

    /* =========================
       FILTER
       ========================= */

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 100px;

      gap: 10px;

      margin-bottom: 19px;
    }

    .search,
    .pier-filter {
      width: 100%;

      padding: 14px 15px;

      border: 1px solid #cdd3d8;
      border-radius: 11px;

      outline: none;

      background: #fff;
      color: var(--text);

      font-size: 13px;
    }

    .pier-filter {
      padding-left: 10px;
      padding-right: 8px;

      font-size: 11px;
      font-weight: 900;
    }

    .search:focus,
    .pier-filter:focus {
      border-color: #7e8993;
    }

    /* =========================
       GROUP
       ========================= */

    .pier-group {
      margin-bottom: 24px;
    }

    .group-title {
      display: flex;
      align-items: center;

      gap: 7px;

      margin: 0 2px 9px;

      color: var(--blue);

      font-size: 15px;
      font-weight: 950;
      letter-spacing: 0.2px;
    }

    .group-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 21px;
      height: 18px;

      padding: 0 6px;

      border-radius: 999px;

      background: #e4e7ea;
      color: #6e7780;

      font-size: 9px;
      font-weight: 950;
    }

    .card-list {
      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    /* =========================
       SAMPLE CARD
       ========================= */

    .sample-card {
      overflow: hidden;

      background: #fff;

      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .sample-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      padding: 16px;
    }

    .grt-label {
      margin-bottom: 4px;

      color: #83909c;

      font-size: 9px;
      font-weight: 950;
      letter-spacing: 0.6px;
    }

    .grt-value {
      color: #101923;

      font-size: 22px;
      font-weight: 950;
      line-height: 1.1;
    }

    .grt-unit {
      margin-left: 5px;

      color: #8c96a0;

      font-size: 9px;
      font-weight: 900;
    }

    .card-actions {
      display: flex;

      gap: 5px;
    }

    .small-btn {
      padding: 7px 9px;

      border: 0;
      border-radius: 7px;

      background: #edf0f2;
      color: #52606b;

      font-size: 8px;
      font-weight: 950;
    }

    .small-btn.delete {
      background: var(--red-bg);
      color: var(--red);
    }

    /* =========================
       COST GRID
       ========================= */

    .cost-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      border-top: 1px solid var(--line);
    }

    .cost-box {
      min-width: 0;
      min-height: 96px;

      padding: 14px 13px 15px;
    }

    .cost-box + .cost-box {
      border-left: 1px solid var(--line);
    }

    /* PILOT */

    .cost-box.pilot {
      background: var(--blue-bg);
    }

    .cost-box.pilot .cost-label {
      color: #4b78aa;
    }

    .cost-box.pilot .cost-value {
      color: #173e6a;
    }

    /* LINE */

    .cost-box.line {
      background: var(--green-bg);
    }

    .cost-box.line .cost-label {
      color: var(--green);
    }

    .cost-box.line .cost-value {
      color: #215d38;
    }

    /* TUG */

    .cost-box.tug {
      background: var(--orange-bg);
    }

    .cost-box.tug .cost-label {
      color: var(--orange);
    }

    .cost-box.tug .cost-value {
      color: #75460d;
    }

    .cost-label {
      margin-bottom: 7px;

      font-size: 9px;
      font-weight: 950;
      letter-spacing: 0.6px;
    }

    .cost-value {
      font-size: 15px;
      font-weight: 950;

      overflow-wrap: anywhere;
    }

    .cost-unit {
      margin-left: 3px;

      color: #87939f;

      font-size: 8px;
      font-weight: 900;
    }

    /* =========================
       TUG COUNT
       ========================= */

    .tug-count {
      display: inline-block;

      margin-top: 7px;
      padding: 4px 7px;

      border-radius: 6px;

      background: #ffe5e5;
      color: #e12e2e;

      font-size: 8px;
      font-weight: 950;
    }

    .tug-count.two {
      background: #ffd7d7;
      color: #cf1717;
    }

    /* =========================
       REMARK
       ========================= */

    .remark {
      padding: 11px 14px;

      border-top: 1px solid #ead7a0;

      background: #fff8e7;
      color: #6d520d;

      font-size: 11px;
      font-weight: 700;
      line-height: 1.5;

      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .remark-label {
      display: block;

      margin-bottom: 4px;

      color: #aa7612;

      font-size: 8px;
      font-weight: 950;
      letter-spacing: 0.6px;
    }

    /* =========================
       EMPTY
       ========================= */

    .empty {
      padding: 38px 15px;

      border: 1px solid var(--line);
      border-radius: var(--radius);

      background: #fff;
      color: var(--muted);

      text-align: center;

      font-size: 12px;
    }

    /* =========================
       MODAL
       ========================= */

    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 16px;

      background: rgba(20, 25, 30, 0.6);
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 560px;
      max-height: 92vh;

      overflow-y: auto;

      padding: 20px;

      border-radius: 17px;

      background: #fff;
    }

    .modal-title {
      margin: 0 0 19px;

      color: #17202a;

      font-size: 22px;
      font-weight: 950;
    }

    .field {
      display: block;

      margin-bottom: 14px;
    }

    .field-label {
      display: block;

      margin-bottom: 6px;

      color: #69747e;

      font-size: 9px;
      font-weight: 950;
      letter-spacing: 0.4px;
    }

    .field input,
    .field select,
    .field textarea {
      display: block;

      width: 100%;

      padding: 12px;

      border: 1px solid #d5dbe0;
      border-radius: 9px;

      outline: none;

      background: #fff;
      color: var(--text);

      font-size: 14px;
    }

    .field textarea {
      min-height: 90px;

      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #7c8791;
    }

    /* =========================
       MODAL COST INPUTS
       ========================= */

    .cost-input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    .cost-input {
      padding: 12px;

      border-radius: 11px;
    }

    .cost-input.pilot-input {
      background: var(--blue-bg);
    }

    .cost-input.line-input {
      background: var(--green-bg);
    }

    .cost-input.tug-input {
      background: var(--orange-bg);
    }

    .cost-input .field {
      margin: 0;
    }

    .cost-input input,
    .cost-input select {
      background: rgba(255, 255, 255, 0.88);
    }

    .pilot-input .field-label {
      color: #4b78aa;
    }

    .line-input .field-label {
      color: var(--green);
    }

    .tug-input .field-label {
      color: var(--orange);
    }

    /* =========================
       BUTTONS
       ========================= */

    .modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-top: 20px;
    }

    .modal-buttons button {
      padding: 13px;

      border: 0;
      border-radius: 10px;

      font-size: 10px;
      font-weight: 950;
    }

    .cancel-btn {
      background: #eceff1;
      color: #59636c;
    }

    .save-btn {
      background: var(--dark);
      color: #fff;
    }

    .save-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .app {
        padding: 16px 12px 40px;
      }

      .page-title {
        font-size: 28px;
      }

      .add-btn {
        padding: 11px 12px;

        font-size: 9px;
      }

      .filter-row {
        grid-template-columns: 1fr 100px;
      }

      .sample-head {
        padding: 15px;
      }

      .grt-value {
        font-size: 21px;
      }

      .cost-box {
        min-height: 92px;

        padding: 13px 12px;
      }

      .cost-value {
        font-size: 14px;
      }

      .modal {
        padding: 18px 14px;
      }
    }

    @media (max-width: 390px) {

      .cost-box {
        padding: 12px 8px;
      }

      .cost-value {
        font-size: 12px;
      }

      .cost-unit {
        display: block;

        margin: 3px 0 0;
      }

      .cost-input-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="page-head">

    <div>

      <h1 class="page-title">
        Sample
      </h1>

      <p class="page-subtitle">
        Ulsan port cost reference
      </p>

    </div>


    <button
      id="addSampleBtn"
      class="add-btn"
      type="button"
    >
      + ADD SAMPLE
    </button>

  </header>


  <div
    id="status"
    class="status"
  ></div>


  <div class="filter-row">

    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="Search GRT..."
      autocomplete="off"
    >


    <select
      id="pierFilter"
      class="pier-filter"
    >

      <option value="ALL">
        ALL PIER
      </option>

      <option value="MAIN">
        MAIN
      </option>

      <option value="ONSAN">
        ONSAN
      </option>

      <option value="OTHER">
        OTHER
      </option>

    </select>

  </div>


  <main id="sampleList">

    <div class="empty">
      Loading sample data...
    </div>

  </main>

</div>


<!-- ==========================================
     SAMPLE EDITOR
     ========================================== -->

<div
  id="sampleModal"
  class="modal-bg"
>

  <div class="modal">

    <h2
      id="modalTitle"
      class="modal-title"
    >
      ADD SAMPLE
    </h2>


    <label class="field">

      <span class="field-label">
        GRT
      </span>

      <input
        id="grtInput"
        type="text"
        inputmode="numeric"
        placeholder="e.g. 20,000"
        autocomplete="off"
      >

    </label>


    <label class="field">

      <span class="field-label">
        PIER
      </span>

      <select id="pierInput">

        <option value="MAIN">
          MAIN
        </option>

        <option value="ONSAN">
          ONSAN
        </option>

        <option value="OTHER">
          OTHER
        </option>

      </select>

    </label>


    <div class="cost-input-grid">

      <div class="cost-input pilot-input">

        <label class="field">

          <span class="field-label">
            PILOT
          </span>

          <input
            id="pilotInput"
            type="text"
            inputmode="numeric"
            placeholder="0"
            autocomplete="off"
          >

        </label>

      </div>


      <div class="cost-input line-input">

        <label class="field">

          <span class="field-label">
            LINE
          </span>

          <input
            id="lineInput"
            type="text"
            inputmode="numeric"
            placeholder="0"
            autocomplete="off"
          >

        </label>

      </div>


      <div class="cost-input tug-input">

        <label class="field">

          <span class="field-label">
            TUG
          </span>

          <input
            id="tugInput"
            type="text"
            inputmode="numeric"
            placeholder="0"
            autocomplete="off"
          >

        </label>

      </div>


      <div class="cost-input tug-input">

        <label class="field">

          <span class="field-label">
            TUG COUNT
          </span>

          <select id="tugCountInput">

            <option value="1">
              1 TUG
            </option>

            <option value="2">
              2 TUGS
            </option>

          </select>

        </label>

      </div>

    </div>


    <label
      class="field"
      style="margin-top:14px;"
    >

      <span class="field-label">
        REMARK
      </span>

      <textarea
        id="remarkInput"
        placeholder="Remark / additional information..."
      ></textarea>

    </label>


    <div class="modal-buttons">

      <button
        id="cancelBtn"
        class="cancel-btn"
        type="button"
      >
        CANCEL
      </button>

      <button
        id="saveBtn"
        class="save-btn"
        type="button"
      >
        SAVE
      </button>

    </div>

  </div>

</div>


<script>
  /* ==========================================
     API

     IMPORTANT:
     sample API Worker 주소가 cargo-api와 같고
     /api/sample 경로를 사용한다고 가정.
     ========================================== */

  const API_URL =
    "https://sample-api.makepdaquickly.workers.dev/api/sample";


  /* ==========================================
     STATE
     ========================================== */

  let sampleData = [];

  let editingId = null;


  /* ==========================================
     ELEMENTS
     ========================================== */

  const sampleList =
    document.getElementById("sampleList");

  const searchInput =
    document.getElementById("searchInput");

  const pierFilter =
    document.getElementById("pierFilter");

  const statusElement =
    document.getElementById("status");

  const sampleModal =
    document.getElementById("sampleModal");

  const modalTitle =
    document.getElementById("modalTitle");

  const grtInput =
    document.getElementById("grtInput");

  const pierInput =
    document.getElementById("pierInput");

  const pilotInput =
    document.getElementById("pilotInput");

  const lineInput =
    document.getElementById("lineInput");

  const tugInput =
    document.getElementById("tugInput");

  const tugCountInput =
    document.getElementById("tugCountInput");

  const remarkInput =
    document.getElementById("remarkInput");

  const saveBtn =
    document.getElementById("saveBtn");


  /* ==========================================
     HELPERS
     ========================================== */

  function escapeHTML(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function cloneData(value) {

    return JSON.parse(
      JSON.stringify(value)
    );
  }


  function onlyNumber(value) {

    return String(value ?? "")
      .replace(/[^\d]/g, "");
  }


  function toNumber(value) {

    const clean =
      onlyNumber(value);

    return clean
      ? Number(clean)
      : 0;
  }


  function formatNumber(value) {

    const number =
      toNumber(value);

    return number.toLocaleString("en-US");
  }


  function formatInputValue(value) {

    const clean =
      onlyNumber(value);

    if (!clean) {
      return "";
    }

    return Number(clean)
      .toLocaleString("en-US");
  }


  function showStatus(
    message,
    type = "loading"
  ) {

    statusElement.textContent =
      message;

    statusElement.className =
      "status show " + type;
  }


  function hideStatus() {

    statusElement.className =
      "status";

    statusElement.textContent =
      "";
  }


  function normalizePier(value) {

    const pier =
      String(value || "")
        .trim()
        .toUpperCase();


    if (pier === "MAIN") {
      return "MAIN";
    }


    if (pier === "ONSAN") {
      return "ONSAN";
    }


    return "OTHER";
  }


  function nextId() {

    if (!sampleData.length) {
      return 1;
    }


    return (
      Math.max(
        ...sampleData.map(
          function(item) {

            return Number(item.id) || 0;
          }
        )
      ) + 1
    );
  }


  /* ==========================================
     MONEY INPUT FORMAT
     ========================================== */

  function attachMoneyFormatter(input) {

    input.addEventListener(
      "input",
      function() {

        const cursorAtEnd =
          input.selectionStart ===
          input.value.length;


        input.value =
          formatInputValue(
            input.value
          );


        if (cursorAtEnd) {

          const length =
            input.value.length;

          input.setSelectionRange(
            length,
            length
          );
        }
      }
    );
  }


  attachMoneyFormatter(grtInput);

  attachMoneyFormatter(pilotInput);

  attachMoneyFormatter(lineInput);

  attachMoneyFormatter(tugInput);


  /* ==========================================
     LOAD
     ========================================== */

  async function loadSamples() {

    showStatus(
      "Loading sample data...",
      "loading"
    );


    try {

      const response =
        await fetch(
          API_URL +
          "?t=" +
          Date.now(),
          {
            method: "GET",
            cache: "no-store"
          }
        );


      let result;


      try {

        result =
          await response.json();

      } catch {

        throw new Error(
          "Invalid response from server."
        );
      }


      if (
        !response.ok ||
        !result.ok ||
        !Array.isArray(result.data)
      ) {

        throw new Error(
          result.error ||
          "Sample data could not be loaded."
        );
      }


      sampleData =
        result.data;


      renderSamples();

      hideStatus();


    } catch (error) {

      console.error(error);


      showStatus(
        "Failed to load sample data. " +
        error.message,
        "error"
      );


      sampleList.innerHTML = `
        <div class="empty">
          Sample data could not be loaded.
        </div>
      `;
    }
  }


  /* ==========================================
     SAVE ALL
     ========================================== */

  async function saveAllSamples() {

    showStatus(
      "Saving...",
      "loading"
    );


    const response =
      await fetch(
        API_URL,
        {
          method: "PUT",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              data: sampleData
            })
        }
      );


    let result;


    try {

      result =
        await response.json();

    } catch {

      throw new Error(
        "Invalid response from server."
      );
    }


    if (
      !response.ok ||
      !result.ok
    ) {

      throw new Error(
        result.error ||
        "Sample save failed."
      );
    }


    showStatus(
      "Saved.",
      "success"
    );


    setTimeout(
      function() {

        if (
          statusElement.classList
            .contains("success")
        ) {

          hideStatus();
        }

      },
      1800
    );


    return result;
  }


  /* ==========================================
     SORT
     ========================================== */

  function getSortedData() {

    return [...sampleData]
      .sort(
        function(a, b) {

          return (
            toNumber(a.grt) -
            toNumber(b.grt)
          );
        }
      );
  }


  /* ==========================================
     RENDER
     ========================================== */

  function renderSamples() {

    const keyword =
      onlyNumber(
        searchInput.value
      );


    const selectedPier =
      pierFilter.value;


    let filtered =
      getSortedData()
        .filter(
          function(item) {

            const itemPier =
              normalizePier(
                item.pier
              );


            if (
              selectedPier !== "ALL" &&
              itemPier !== selectedPier
            ) {

              return false;
            }


            if (keyword) {

              const grtText =
                onlyNumber(
                  item.grt
                );


              if (
                !grtText.includes(
                  keyword
                )
              ) {

                return false;
              }
            }


            return true;
          }
        );


    if (!filtered.length) {

      sampleList.innerHTML = `
        <div class="empty">
          No sample found.
        </div>
      `;

      return;
    }


    const groups = [
      "MAIN",
      "ONSAN",
      "OTHER"
    ];


    let html = "";


    groups.forEach(
      function(groupName) {

        const items =
          filtered.filter(
            function(item) {

              return (
                normalizePier(
                  item.pier
                ) ===
                groupName
              );
            }
          );


        if (!items.length) {
          return;
        }


        html += `
          <section class="pier-group">

            <div class="group-title">

              ${groupName}

              <span class="group-count">
                ${items.length}
              </span>

            </div>


            <div class="card-list">

              ${
                items.map(
                  function(item) {

                    return renderCard(
                      item
                    );
                  }
                ).join("")
              }

            </div>

          </section>
        `;
      }
    );


    sampleList.innerHTML =
      html;
  }


  function renderCard(item) {

    const tugCount =
      Number(item.tugCount) === 2
        ? 2
        : 1;


    const tugClass =
      tugCount === 2
        ? "tug-count two"
        : "tug-count";


    const tugText =
      tugCount === 2
        ? "2 TUGS"
        : "1 TUG";


    const remarkHTML =
      item.remark
        ? `
          <div class="remark">

            <span class="remark-label">
              REMARK
            </span>

            ${escapeHTML(
              item.remark
            )}

          </div>
        `
        : "";


    return `
      <article class="sample-card">

        <div class="sample-head">

          <div>

            <div class="grt-label">
              GRT
            </div>

            <div class="grt-value">

              ${formatNumber(
                item.grt
              )}

              <span class="grt-unit">
                GRT
              </span>

            </div>

          </div>


          <div class="card-actions">

            <button
              class="small-btn"
              type="button"
              onclick="editSample(
                ${Number(item.id)}
              )"
            >
              EDIT
            </button>


            <button
              class="small-btn delete"
              type="button"
              onclick="deleteSample(
                ${Number(item.id)}
              )"
            >
              DELETE
            </button>

          </div>

        </div>


        <div class="cost-grid">

          <div class="cost-box pilot">

            <div class="cost-label">
              PILOT
            </div>

            <div class="cost-value">

              ${formatNumber(
                item.pilot
              )}

              <span class="cost-unit">
                WON
              </span>

            </div>

          </div>


          <div class="cost-box line">

            <div class="cost-label">
              LINE
            </div>

            <div class="cost-value">

              ${formatNumber(
                item.line
              )}

              <span class="cost-unit">
                WON
              </span>

            </div>

          </div>


          <div class="cost-box tug">

            <div class="cost-label">
              TUG
            </div>

            <div class="cost-value">

              ${formatNumber(
                item.tug
              )}

              <span class="cost-unit">
                WON
              </span>

            </div>


            <div class="${tugClass}">
              ${tugText}
            </div>

          </div>

        </div>


        ${remarkHTML}

      </article>
    `;
  }


  /* ==========================================
     SEARCH / FILTER
     ========================================== */

  searchInput.addEventListener(
    "input",
    renderSamples
  );


  pierFilter.addEventListener(
    "change",
    renderSamples
  );


  /* ==========================================
     OPEN MODAL
     ========================================== */

  function openModal(item) {

    if (item) {

      editingId =
        Number(item.id);


      modalTitle.textContent =
        "EDIT SAMPLE";


      grtInput.value =
        formatInputValue(
          item.grt
        );


      pierInput.value =
        normalizePier(
          item.pier
        );


      pilotInput.value =
        formatInputValue(
          item.pilot
        );


      lineInput.value =
        formatInputValue(
          item.line
        );


      tugInput.value =
        formatInputValue(
          item.tug
        );


      tugCountInput.value =
        Number(item.tugCount) === 2
          ? "2"
          : "1";


      remarkInput.value =
        item.remark || "";


    } else {

      editingId = null;


      modalTitle.textContent =
        "ADD SAMPLE";


      grtInput.value = "";

      pierInput.value =
        "MAIN";

      pilotInput.value = "";

      lineInput.value = "";

      tugInput.value = "";

      tugCountInput.value =
        "1";

      remarkInput.value = "";
    }


    sampleModal.classList.add(
      "show"
    );


    setTimeout(
      function() {

        grtInput.focus();

      },
      50
    );
  }


  function closeModal() {

    sampleModal.classList.remove(
      "show"
    );
  }


  /* ==========================================
     ADD
     ========================================== */

  document
    .getElementById("addSampleBtn")
    .addEventListener(
      "click",
      function() {

        openModal(null);
      }
    );


  /* ==========================================
     EDIT
     ========================================== */

  window.editSample =
    function(id) {

      const item =
        sampleData.find(
          function(sample) {

            return (
              Number(sample.id) ===
              Number(id)
            );
          }
        );


      if (!item) {
        return;
      }


      openModal(item);
    };


  /* ==========================================
     DELETE
     ========================================== */

  window.deleteSample =
    async function(id) {

      const item =
        sampleData.find(
          function(sample) {

            return (
              Number(sample.id) ===
              Number(id)
            );
          }
        );


      if (!item) {
        return;
      }


      const confirmed =
        confirm(
          "Delete GRT " +
          formatNumber(item.grt) +
          "?"
        );


      if (!confirmed) {
        return;
      }


      const backup =
        cloneData(sampleData);


      sampleData =
        sampleData.filter(
          function(sample) {

            return (
              Number(sample.id) !==
              Number(id)
            );
          }
        );


      renderSamples();


      try {

        await saveAllSamples();


      } catch (error) {

        console.error(error);


        sampleData =
          backup;


        renderSamples();


        showStatus(
          "Delete failed. " +
          error.message,
          "error"
        );


        alert(
          "DELETE FAILED\n\n" +
          error.message
        );
      }
    };


  /* ==========================================
     SAVE SAMPLE
     ========================================== */

  saveBtn.addEventListener(
    "click",
    async function() {

      const grt =
        toNumber(
          grtInput.value
        );


      if (!grt) {

        alert(
          "Please enter GRT."
        );

        grtInput.focus();

        return;
      }


      const newItem = {

        id:
          editingId !== null
            ? editingId
            : nextId(),

        grt: grt,

        pier:
          normalizePier(
            pierInput.value
          ),

        pilot:
          toNumber(
            pilotInput.value
          ),

        line:
          toNumber(
            lineInput.value
          ),

        tug:
          toNumber(
            tugInput.value
          ),

        tugCount:
          Number(
            tugCountInput.value
          ) === 2
            ? 2
            : 1,

        remark:
          remarkInput.value.trim()
      };


      const backup =
        cloneData(sampleData);


      if (
        editingId !== null
      ) {

        sampleData =
          sampleData.map(
            function(item) {

              if (
                Number(item.id) ===
                Number(editingId)
              ) {

                return newItem;
              }


              return item;
            }
          );


      } else {

        sampleData.push(
          newItem
        );
      }


      renderSamples();


      saveBtn.disabled =
        true;

      saveBtn.textContent =
        "SAVING...";


      try {

        await saveAllSamples();

        closeModal();


      } catch (error) {

        console.error(error);


        sampleData =
          backup;


        renderSamples();


        showStatus(
          "Save failed. " +
          error.message,
          "error"
        );


        alert(
          "SAVE FAILED\n\n" +
          error.message
        );


      } finally {

        saveBtn.disabled =
          false;

        saveBtn.textContent =
          "SAVE";
      }
    }
  );


  /* ==========================================
     CANCEL
     ========================================== */

  document
    .getElementById("cancelBtn")
    .addEventListener(
      "click",
      closeModal
    );


  sampleModal.addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        sampleModal
      ) {

        closeModal();
      }
    }
  );


  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Escape" &&
        sampleModal.classList
          .contains("show")
      ) {

        closeModal();
      }
    }
  );


  /* ==========================================
     INITIAL LOAD
     ========================================== */

  loadSamples();
</script>

</body>
</html>
