<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Port Cost Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f7fb;
    font-family: Arial, Helvetica, sans-serif;
    color: #102033;
}

.container {
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    padding: 30px 18px 60px;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    background: #e8f0ff;
    color: #1769ff;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 14px;
}

.title {
    font-size: 27px;
    font-weight: 700;
    margin-bottom: 5px;
}

.subtitle {
    color: #718096;
    font-size: 14px;
    margin-bottom: 25px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.06);
}

.card h2 {
    margin: 0 0 20px;
    font-size: 18px;
}

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #5b6b80;
    margin-bottom: 7px;
}

input {
    width: 100%;
    height: 50px;
    padding: 0 14px;
    border: 1px solid #d5dde7;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

input:focus {
    outline: none;
    border-color: #1769ff;
    box-shadow: 0 0 0 3px rgba(23,105,255,0.08);
}

button {
    font-family: inherit;
}

.calculate-btn {
    width: 100%;
    height: 55px;
    border: none;
    border-radius: 11px;
    background: #0d1d2e;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 18px;
}

.calculate-btn:hover {
    background: #162b40;
}

.add-btn {
    border: none;
    background: #eef3f8;
    color: #22354a;
    padding: 11px 16px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.remove-btn {
    height: 46px;
    border: none;
    background: #fff0f0;
    color: #d93636;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
}

.additional-row {
    display: grid;
    grid-template-columns: 1.5fr 1fr 45px;
    gap: 10px;
    margin-bottom: 10px;
}

.additional-row input {
    height: 46px;
}

.note {
    color: #778699;
    font-size: 12px;
    margin-top: 10px;
}

#results {
    display: none;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    padding: 13px 12px;
    background: #f0f3f6;
    color: #46576b;
    font-size: 12px;
    text-align: left;
}

td {
    padding: 14px 12px;
    border-bottom: 1px solid #e1e6eb;
    font-size: 14px;
}

.amount {
    text-align: right;
}

.total-row td {
    background: #0d1d2e;
    color: white;
    font-weight: bold;
    font-size: 17px;
    border: none;
}

.convert-btn {
    margin-top: 20px;
    padding: 12px 18px;
    background: #1769df;
    color: white;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

.usd-box {
    display: none;
    margin-top: 18px;
    padding: 20px;
    background: #f5f8fc;
    border-radius: 10px;
}

.usd-controls {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: end;
}

.usd-controls button {
    height: 50px;
    padding: 0 22px;
    background: #0d1d2e;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

#usdResult {
    display: none;
    margin-top: 20px;
}

.usd-total {
    display: flex;
    justify-content: space-between;
    padding: 16px;
    background: #1769df;
    color: white;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
}

@media(max-width: 700px) {

    .grid-2,
    .grid-3,
    .additional-row,
    .usd-controls {
        grid-template-columns: 1fr;
    }

    .remove-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="badge">
        PORT DA ESTIMATOR
    </div>

    <div class="title">
        ⚓ Port Cost Calculator
    </div>

    <div class="subtitle">
        Estimated Port Disbursement
    </div>


    <!-- VESSEL INFORMATION -->

    <div class="card">

        <h2>Vessel Information</h2>

        <div class="grid-2">

            <div>
                <label>GRT</label>

                <input
                    type="text"
                    inputmode="numeric"
                    id="grt"
                    class="comma-input"
                    autocomplete="off"
                >
            </div>

            <div>
                <label>BERTH DAYS</label>

                <input
                    type="number"
                    id="days"
                    min="0"
                    step="0.1"
                >
            </div>

        </div>

    </div>


    <!-- MANUAL EXPENSES -->

    <div class="card">

        <h2>Manual Port Expenses</h2>

        <div class="grid-3">

            <div>
                <label>PILOTAGE / BOAT (KRW)</label>

                <input
                    type="text"
                    inputmode="numeric"
                    id="pilotage"
                    class="comma-input"
                    autocomplete="off"
                >
            </div>

            <div>
                <label>LINE HANDLING (KRW)</label>

                <input
                    type="text"
                    inputmode="numeric"
                    id="line"
                    class="comma-input"
                    autocomplete="off"
                >
            </div>

            <div>
                <label>TUGGAGE (KRW)</label>

                <input
                    type="text"
                    inputmode="numeric"
                    id="tug"
                    class="comma-input"
                    autocomplete="off"
                >
            </div>

        </div>

    </div>


    <!-- ADDITIONAL EXPENSES -->

    <div class="card">

        <h2>Additional Expenses</h2>

        <div id="additionalItems"></div>

        <button
            type="button"
            class="add-btn"
            onclick="addItem()"
        >
            + ADD ITEM
        </button>

        <div class="note">
            Add any additional item and amount to include it in the total.
        </div>

    </div>


    <!-- CALCULATE -->

    <button
        type="button"
        class="calculate-btn"
        onclick="calculateCost()"
    >
        CALCULATE
    </button>


    <!-- RESULTS -->

    <div class="card" id="results">

        <h2>Estimated Port Disbursement</h2>

        <table>

            <thead>
                <tr>
                    <th>ITEM</th>
                    <th class="amount">AMOUNT (KRW)</th>
                </tr>
            </thead>

            <tbody id="resultBody"></tbody>

            <tfoot>
                <tr class="total-row">

                    <td>TOTAL</td>

                    <td
                        class="amount"
                        id="totalKRW"
                    >
                        ₩0
                    </td>

                </tr>
            </tfoot>

        </table>


        <button
            type="button"
            class="convert-btn"
            onclick="showUSD()"
        >
            CONVERT TO USD
        </button>


        <!-- USD CONVERSION -->

        <div
            class="usd-box"
            id="usdBox"
        >

            <label>
                EXCHANGE RATE (KRW / USD)
            </label>

            <div class="usd-controls">

                <input
                    type="text"
                    inputmode="numeric"
                    id="exchangeRate"
                    class="comma-input"
                    autocomplete="off"
                >

                <button
                    type="button"
                    onclick="convertUSD()"
                >
                    CONVERT
                </button>

            </div>


            <div id="usdResult">

                <table>

                    <thead>
                        <tr>
                            <th>ITEM</th>
                            <th class="amount">
                                AMOUNT (USD)
                            </th>
                        </tr>
                    </thead>

                    <tbody id="usdBody"></tbody>

                </table>


                <div class="usd-total">

                    <span>TOTAL USD</span>

                    <span id="totalUSD">
                        $0
                    </span>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

let currentResults = [];
let currentTotal = 0;


/* ========================================
   COMMA FORMAT
======================================== */

function formatCommaInput(input) {

    let value =
        input.value.replace(/[^\d]/g, "");


    if (value === "") {

        input.value = "";

        return;
    }


    value =
        value.replace(/^0+(?=\d)/, "");


    input.value =
        Number(value).toLocaleString("en-US");
}


/* Existing comma inputs */

document.querySelectorAll(
    ".comma-input"
).forEach(input => {

    input.addEventListener(
        "input",
        function() {

            formatCommaInput(this);

        }
    );

});


/* ========================================
   GET NUMBER

   쉼표를 제거한 뒤 숫자로 변환
======================================== */

function getNumber(id) {

    const element =
        document.getElementById(id);


    if (!element) {
        return 0;
    }


    const cleanValue =
        String(element.value)
        .replace(/,/g, "")
        .trim();


    const value =
        parseFloat(cleanValue);


    return isNaN(value)
        ? 0
        : value;
}


/* ========================================
   ROUNDDOWN TO 10 KRW
======================================== */

function roundDown10(value) {

    return Math.floor(
        value / 10
    ) * 10;
}


/* ========================================
   PORT DUES

   =ROUNDDOWN(GRT*135,-1)
======================================== */

function calculatePortDues(grt) {

    return roundDown10(
        grt * 135
    );
}


/* ========================================
   SECURITY

   =ROUNDDOWN(GRT*5,-1)
======================================== */

function calculateSecurity(grt) {

    return roundDown10(
        grt * 5
    );
}


/* ========================================
   DOCKAGE

   =ROUNDDOWN(
       ROUNDDOWN(GRT/10,0)
       *358
       *(BERTH DAYS*2),
       -1
   )
======================================== */

function calculateDockage(
    grt,
    days
) {

    const grtUnit =
        Math.floor(
            grt / 10
        );


    const amount =
        grtUnit *
        358 *
        (days * 2);


    return roundDown10(
        amount
    );
}


/* ========================================
   OIL PREVENTIONS

   GRT >= 10,000

   =ROUNDDOWN(7.6*GRT,-1)
======================================== */

function calculateOilPrevention(grt) {

    return roundDown10(
        7.6 * grt
    );
}


/* ========================================
   ADD ITEM
======================================== */

function addItem() {

    const container =
        document.getElementById(
            "additionalItems"
        );


    const row =
        document.createElement("div");


    row.className =
        "additional-row";


    row.innerHTML = `

        <input
            type="text"
            class="custom-name"
            placeholder="Item name"
            autocomplete="off"
        >

        <input
            type="text"
            inputmode="numeric"
            class="custom-amount"
            placeholder="Amount (KRW)"
            autocomplete="off"
        >

        <button
            type="button"
            class="remove-btn"
            onclick="this.parentElement.remove()"
        >
            ×
        </button>

    `;


    container.appendChild(row);


    /* Newly added amount field */

    const amountInput =
        row.querySelector(
            ".custom-amount"
        );


    amountInput.addEventListener(
        "input",
        function() {

            formatCommaInput(this);

        }
    );
}


/* ========================================
   MAIN CALCULATION
======================================== */

function calculateCost() {

    const grt =
        getNumber("grt");


    const days =
        getNumber("days");


    if (grt <= 0) {

        alert(
            "Please enter GRT."
        );

        return;
    }


    if (days <= 0) {

        alert(
            "Please enter Berth Days."
        );

        return;
    }


    currentResults = [];


    /* =====================================
       AUTOMATIC EXPENSES
    ===================================== */


    currentResults.push({

        name: "Port Dues",

        amount:
            calculatePortDues(
                grt
            )

    });


    currentResults.push({

        name: "Security",

        amount:
            calculateSecurity(
                grt
            )

    });


    currentResults.push({

        name: "Dockage",

        amount:
            calculateDockage(
                grt,
                days
            )

    });


    /* =====================================
       OIL PREVENTIONS

       GRT 10,000 이상만 표시
    ===================================== */


    if (grt >= 10000) {

        currentResults.push({

            name:
                "Oil Preventions",

            amount:
                calculateOilPrevention(
                    grt
                )

        });

    }


    /* =====================================
       MANUAL EXPENSES
    ===================================== */


    currentResults.push({

        name:
            "Pilotage / Boat",

        amount:
            getNumber(
                "pilotage"
            )

    });


    currentResults.push({

        name:
            "Line Handling",

        amount:
            getNumber(
                "line"
            )

    });


    currentResults.push({

        name:
            "Tuggage",

        amount:
            getNumber(
                "tug"
            )

    });


    /* =====================================
       ADDITIONAL ITEMS
    ===================================== */


    const rows =
        document.querySelectorAll(
            ".additional-row"
        );


    rows.forEach(row => {

        const name =
            row
            .querySelector(
                ".custom-name"
            )
            .value
            .trim();


        const amountText =
            row
            .querySelector(
                ".custom-amount"
            )
            .value
            .replace(/,/g, "");


        const amount =
            parseFloat(
                amountText
            ) || 0;


        if (name !== "") {

            currentResults.push({

                name: name,
                amount: amount

            });

        }

    });


    /* =====================================
       TOTAL KRW
    ===================================== */


    currentTotal =
        currentResults.reduce(

            (sum, item) =>
                sum + item.amount,

            0

        );


    renderKRW();


    document.getElementById(
        "results"
    ).style.display =
        "block";


    /* RESET USD */

    document.getElementById(
        "usdBox"
    ).style.display =
        "none";


    document.getElementById(
        "usdResult"
    ).style.display =
        "none";


    document.getElementById(
        "results"
    ).scrollIntoView({

        behavior: "smooth",

        block: "start"

    });

}


/* ========================================
   KRW RESULT
======================================== */

function renderKRW() {

    const body =
        document.getElementById(
            "resultBody"
        );


    body.innerHTML = "";


    currentResults.forEach(item => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${escapeHTML(
                    item.name
                )}
            </td>

            <td class="amount">

                ₩${Math.round(
                    item.amount
                ).toLocaleString(
                    "ko-KR"
                )}

            </td>

        `;


        body.appendChild(
            row
        );

    });


    document.getElementById(
        "totalKRW"
    ).textContent =

        "₩" +

        Math.round(
            currentTotal
        ).toLocaleString(
            "ko-KR"
        );

}


/* ========================================
   SHOW USD OPTION
======================================== */

function showUSD() {

    document.getElementById(
        "usdBox"
    ).style.display =
        "block";


    document.getElementById(
        "exchangeRate"
    ).focus();

}


/* ========================================
   KRW → USD

   각 항목별 환산 후
   10 USD 단위 올림

   194.21 → 200
   857.14 → 860
   1,943.01 → 1,950

   이후 각 항목을 합산
======================================== */

function convertUSD() {

    const rate =
        getNumber(
            "exchangeRate"
        );


    if (rate <= 0) {

        alert(
            "Please enter exchange rate."
        );

        return;
    }


    const body =
        document.getElementById(
            "usdBody"
        );


    body.innerHTML = "";


    let totalUSD = 0;


    currentResults.forEach(item => {

        const rawUSD =
            item.amount /
            rate;


        const roundedUSD =
            Math.ceil(
                rawUSD / 10
            ) * 10;


        totalUSD +=
            roundedUSD;


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${escapeHTML(
                    item.name
                )}
            </td>

            <td class="amount">

                $${roundedUSD
                    .toLocaleString(
                        "en-US"
                    )}

            </td>

        `;


        body.appendChild(
            row
        );

    });


    document.getElementById(
        "totalUSD"
    ).textContent =

        "$" +

        totalUSD.toLocaleString(
            "en-US"
        );


    document.getElementById(
        "usdResult"
    ).style.display =
        "block";

}


/* ========================================
   SAFE TEXT
======================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;
}

</script>

</body>
</html>
