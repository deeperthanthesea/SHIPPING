<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Port Cost Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f7fb;
    font-family: Arial, Helvetica, sans-serif;
    color: #102033;
}

.container {
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    padding: 30px 18px 60px;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    background: #e8f0ff;
    color: #1769ff;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 14px;
}

.title {
    font-size: 27px;
    font-weight: 700;
    margin-bottom: 5px;
}

.subtitle {
    color: #718096;
    font-size: 14px;
    margin-bottom: 25px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.06);
}

.card h2 {
    margin: 0 0 20px;
    font-size: 18px;
}

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #5b6b80;
    margin-bottom: 7px;
}

input {
    width: 100%;
    height: 50px;
    padding: 0 14px;
    border: 1px solid #d5dde7;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

input:focus {
    outline: none;
    border-color: #1769ff;
    box-shadow: 0 0 0 3px rgba(23,105,255,0.08);
}

button {
    font-family: inherit;
}

.calculate-btn {
    width: 100%;
    height: 55px;
    border: none;
    border-radius: 11px;
    background: #0d1d2e;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 18px;
}

.calculate-btn:hover {
    background: #162b40;
}

.add-btn {
    border: none;
    background: #eef3f8;
    color: #22354a;
    padding: 11px 16px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.remove-btn {
    height: 46px;
    border: none;
    background: #fff0f0;
    color: #d93636;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
}

.additional-row {
    display: grid;
    grid-template-columns: 1.5fr 1fr 45px;
    gap: 10px;
    margin-bottom: 10px;
}

.additional-row input {
    height: 46px;
}

.note {
    color: #778699;
    font-size: 12px;
    margin-top: 10px;
}

#results {
    display: none;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    padding: 13px 12px;
    background: #f0f3f6;
    color: #46576b;
    font-size: 12px;
    text-align: left;
}

td {
    padding: 14px 12px;
    border-bottom: 1px solid #e1e6eb;
    font-size: 14px;
}

.amount {
    text-align: right;
}

.total-row td {
    background: #0d1d2e;
    color: white;
    font-weight: bold;
    font-size: 17px;
    border: none;
}

.convert-btn {
    margin-top: 20px;
    padding: 12px 18px;
    background: #1769df;
    color: white;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

.usd-box {
    display: none;
    margin-top: 18px;
    padding: 20px;
    background: #f5f8fc;
    border-radius: 10px;
}

.usd-controls {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: end;
}

.usd-controls button {
    height: 50px;
    padding: 0 22px;
    background: #0d1d2e;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

#usdResult {
    display: none;
    margin-top: 20px;
}

.usd-total {
    display: flex;
    justify-content: space-between;
    padding: 16px;
    background: #1769df;
    color: white;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
}

@media(max-width: 700px) {

    .grid-2,
    .grid-3,
    .additional-row,
    .usd-controls {
        grid-template-columns: 1fr;
    }

    .remove-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="badge">
        PORT DA ESTIMATOR
    </div>

    <div class="title">
        ⚓ Port Cost Calculator
    </div>

    <div class="subtitle">
        Estimated Port Disbursement
    </div>


    <!-- ==============================
         VESSEL INFORMATION
    =============================== -->

    <div class="card">

        <h2>Vessel Information</h2>

        <div class="grid-2">

            <div>
                <label>GRT</label>

                <input
                    type="number"
                    id="grt"
                    min="0"
                >
            </div>

            <div>
                <label>BERTH DAYS</label>

                <input
                    type="number"
                    id="days"
                    min="0"
                    step="0.1"
                >
            </div>

        </div>

    </div>


    <!-- ==============================
         MANUAL EXPENSES
    =============================== -->

    <div class="card">

        <h2>Manual Port Expenses</h2>

        <div class="grid-3">

            <div>
                <label>PILOTAGE / BOAT (KRW)</label>

                <input
                    type="number"
                    id="pilotage"
                    min="0"
                >
            </div>

            <div>
                <label>LINE HANDLING (KRW)</label>

                <input
                    type="number"
                    id="line"
                    min="0"
                >
            </div>

            <div>
                <label>TUGGAGE (KRW)</label>

                <input
                    type="number"
                    id="tug"
                    min="0"
                >
            </div>

        </div>

    </div>


    <!-- ==============================
         ADDITIONAL EXPENSES
    =============================== -->

    <div class="card">

        <h2>Additional Expenses</h2>

        <div id="additionalItems"></div>

        <button
            type="button"
            class="add-btn"
            onclick="addItem()"
        >
            + ADD ITEM
        </button>

        <div class="note">
            Add any additional item and amount to include it in the total.
        </div>

    </div>


    <!-- CALCULATE -->

    <button
        type="button"
        class="calculate-btn"
        onclick="calculateCost()"
    >
        CALCULATE
    </button>


    <!-- ==============================
         KRW RESULT
    =============================== -->

    <div class="card" id="results">

        <h2>Estimated Port Disbursement</h2>

        <table>

            <thead>
                <tr>
                    <th>ITEM</th>
                    <th class="amount">AMOUNT (KRW)</th>
                </tr>
            </thead>

            <tbody id="resultBody"></tbody>

            <tfoot>
                <tr class="total-row">

                    <td>TOTAL</td>

                    <td
                        class="amount"
                        id="totalKRW"
                    >
                        ₩0
                    </td>

                </tr>
            </tfoot>

        </table>


        <!-- USD OPTION -->

        <button
            type="button"
            class="convert-btn"
            onclick="showUSD()"
        >
            CONVERT TO USD
        </button>


        <div
            class="usd-box"
            id="usdBox"
        >

            <label>
                EXCHANGE RATE (KRW / USD)
            </label>

            <div class="usd-controls">

                <input
                    type="number"
                    id="exchangeRate"
                    min="1"
                >

                <button
                    type="button"
                    onclick="convertUSD()"
                >
                    CONVERT
                </button>

            </div>


            <!-- USD RESULT -->

            <div id="usdResult">

                <table>

                    <thead>
                        <tr>
                            <th>ITEM</th>
                            <th class="amount">
                                AMOUNT (USD)
                            </th>
                        </tr>
                    </thead>

                    <tbody id="usdBody"></tbody>

                </table>


                <div class="usd-total">

                    <span>
                        TOTAL USD
                    </span>

                    <span id="totalUSD">
                        $0
                    </span>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* ========================================
   GLOBAL DATA
======================================== */

let currentResults = [];
let currentTotal = 0;


/* ========================================
   GET NUMBER
======================================== */

function getNumber(id) {

    const value =
        parseFloat(
            document.getElementById(id).value
        );

    return isNaN(value)
        ? 0
        : value;
}


/* ========================================
   EXCEL ROUNDDOWN(value, -1)

   1원 단위 절사
   → 10원 단위로 만듦
======================================== */

function roundDown10(value) {

    return Math.floor(value / 10) * 10;
}


/* ========================================
   PORT DUES

   Excel:
   =ROUNDDOWN(GRT*135,-1)
======================================== */

function calculatePortDues(grt) {

    return roundDown10(
        grt * 135
    );
}


/* ========================================
   SECURITY

   Excel:
   =ROUNDDOWN(GRT*5,-1)
======================================== */

function calculateSecurity(grt) {

    return roundDown10(
        grt * 5
    );
}


/* ========================================
   DOCKAGE

   Excel:

   =ROUNDDOWN(
       ROUNDDOWN(GRT/10,0)
       *358
       *(BERTH DAYS*2),
       -1
   )
======================================== */

function calculateDockage(grt, days) {

    const grtUnit =
        Math.floor(grt / 10);

    const amount =
        grtUnit *
        358 *
        (days * 2);

    return roundDown10(amount);
}


/* ========================================
   OIL PREVENTIONS

   GRT 10,000 이상만 적용

   Excel:
   =ROUNDDOWN(7.6*GRT,-1)
======================================== */

function calculateOilPrevention(grt) {

    return roundDown10(
        7.6 * grt
    );
}


/* ========================================
   ADD ITEM
======================================== */

function addItem() {

    const container =
        document.getElementById(
            "additionalItems"
        );

    const row =
        document.createElement("div");

    row.className =
        "additional-row";


    row.innerHTML = `

        <input
            type="text"
            class="custom-name"
            placeholder="Item name"
        >

        <input
            type="number"
            class="custom-amount"
            placeholder="Amount (KRW)"
            min="0"
        >

        <button
            type="button"
            class="remove-btn"
            onclick="this.parentElement.remove()"
        >
            ×
        </button>

    `;


    container.appendChild(row);
}


/* ========================================
   MAIN CALCULATION
======================================== */

function calculateCost() {

    const grt =
        getNumber("grt");

    const days =
        getNumber("days");


    /* VALIDATION */

    if (grt <= 0) {

        alert("Please enter GRT.");

        return;
    }


    if (days <= 0) {

        alert("Please enter Berth Days.");

        return;
    }


    currentResults = [];


    /* =====================================
       AUTOMATIC CALCULATION
    ===================================== */


    const portDues =
        calculatePortDues(grt);


    const security =
        calculateSecurity(grt);


    const dockage =
        calculateDockage(
            grt,
            days
        );


    currentResults.push({

        name: "Port Dues",
        amount: portDues

    });


    currentResults.push({

        name: "Security",
        amount: security

    });


    currentResults.push({

        name: "Dockage",
        amount: dockage

    });


    /* =====================================
       OIL PREVENTIONS

       GRT 9,999 이하
       → 표시하지 않음

       GRT 10,000 이상
       → 자동 계산
    ===================================== */


    if (grt >= 10000) {

        const oil =
            calculateOilPrevention(grt);


        currentResults.push({

            name: "Oil Preventions",
            amount: oil

        });

    }


    /* =====================================
       MANUAL EXPENSES
    ===================================== */


    const pilotage =
        getNumber("pilotage");


    const line =
        getNumber("line");


    const tug =
        getNumber("tug");


    currentResults.push({

        name: "Pilotage / Boat",
        amount: pilotage

    });


    currentResults.push({

        name: "Line Handling",
        amount: line

    });


    currentResults.push({

        name: "Tuggage",
        amount: tug

    });


    /* =====================================
       ADDITIONAL EXPENSES
    ===================================== */


    const rows =
        document.querySelectorAll(
            ".additional-row"
        );


    rows.forEach(row => {

        const name =
            row
            .querySelector(
                ".custom-name"
            )
            .value
            .trim();


        const amount =
            parseFloat(
                row
                .querySelector(
                    ".custom-amount"
                )
                .value
            ) || 0;


        if (name !== "") {

            currentResults.push({

                name: name,
                amount: amount

            });

        }

    });


    /* =====================================
       TOTAL KRW
    ===================================== */


    currentTotal =
        currentResults.reduce(

            (sum, item) =>
                sum + item.amount,

            0

        );


    renderKRW();


    /* SHOW RESULTS */

    document.getElementById(
        "results"
    ).style.display =
        "block";


    /* RESET USD */

    document.getElementById(
        "usdBox"
    ).style.display =
        "none";


    document.getElementById(
        "usdResult"
    ).style.display =
        "none";


    /* SCROLL TO RESULT */

    document.getElementById(
        "results"
    ).scrollIntoView({

        behavior: "smooth",
        block: "start"

    });

}


/* ========================================
   DISPLAY KRW RESULT
======================================== */

function renderKRW() {

    const body =
        document.getElementById(
            "resultBody"
        );


    body.innerHTML = "";


    currentResults.forEach(item => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${escapeHTML(item.name)}
            </td>

            <td class="amount">

                ₩${Math.round(
                    item.amount
                ).toLocaleString(
                    "ko-KR"
                )}

            </td>

        `;


        body.appendChild(row);

    });


    document.getElementById(
        "totalKRW"
    ).textContent =

        "₩" +

        Math.round(
            currentTotal
        ).toLocaleString(
            "ko-KR"
        );

}


/* ========================================
   SHOW USD OPTION
======================================== */

function showUSD() {

    document.getElementById(
        "usdBox"
    ).style.display =
        "block";


    document.getElementById(
        "exchangeRate"
    ).focus();

}


/* ========================================
   KRW → USD

   IMPORTANT:

   각 항목을 개별 환산한 후
   10 USD 단위로 올림

   예:

   $194.21 → $200
   $857.14 → $860
   $1,943.01 → $1,950

   그 후 각 항목을 합산하여
   TOTAL USD 계산
======================================== */

function convertUSD() {

    const rate =
        getNumber(
            "exchangeRate"
        );


    if (rate <= 0) {

        alert(
            "Please enter exchange rate."
        );

        return;
    }


    const body =
        document.getElementById(
            "usdBody"
        );


    body.innerHTML = "";


    let totalUSD = 0;


    currentResults.forEach(item => {

        /* KRW → USD */

        const rawUSD =
            item.amount / rate;


        /*
            각 항목을
            10 USD 단위로 올림
        */

        const roundedUSD =
            Math.ceil(
                rawUSD / 10
            ) * 10;


        /*
            올림된 금액을
            TOTAL에 합산
        */

        totalUSD +=
            roundedUSD;


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${escapeHTML(item.name)}
            </td>

            <td class="amount">

                $${roundedUSD.toLocaleString(
                    "en-US"
                )}

            </td>

        `;


        body.appendChild(row);

    });


    /* TOTAL USD */

    document.getElementById(
        "totalUSD"
    ).textContent =

        "$" +

        totalUSD.toLocaleString(
            "en-US"
        );


    document.getElementById(
        "usdResult"
    ).style.display =
        "block";

}


/* ========================================
   SAFE CUSTOM ITEM NAME
======================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>
</html>
