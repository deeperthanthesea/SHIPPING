<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Port Cost Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f7fb;
    font-family: Arial, sans-serif;
    color: #172033;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 24px 16px 50px;
}

h1 {
    margin: 0;
    font-size: 26px;
}

.subtitle {
    color: #7a8496;
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 22px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #69758a;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    height: 52px;
    border: 1px solid #dce2ea;
    border-radius: 11px;
    padding: 0 14px;
    font-size: 17px;
    background: white;
    margin-bottom: 18px;
}

input:focus,
select:focus {
    outline: none;
    border-color: #1769ff;
}

.two-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

button {
    width: 100%;
    height: 55px;
    border: none;
    border-radius: 12px;
    background: #1769ff;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.99);
}

.result-title {
    font-size: 12px;
    font-weight: bold;
    color: #6d788c;
    margin-bottom: 8px;
}

.cost-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 14px 0;
    border-bottom: 1px solid #edf0f4;
}

.cost-row:last-child {
    border-bottom: none;
}

.cost-name {
    color: #4d586a;
}

.cost-value {
    font-weight: bold;
    text-align: right;
}

.total-box {
    background: #101d35;
    color: white;
    border-radius: 18px;
    padding: 22px;
}

.total-label {
    font-size: 12px;
    font-weight: bold;
    color: #aebbd1;
}

.total-krw {
    margin-top: 7px;
    font-size: 29px;
    font-weight: bold;
}

.total-usd {
    margin-top: 7px;
    color: #65e0a1;
    font-size: 21px;
    font-weight: bold;
}

.note {
    text-align: center;
    font-size: 11px;
    color: #98a1b1;
    margin-top: 18px;
}

.hidden {
    display: none;
}

.badge {
    display: inline-block;
    background: #e9f1ff;
    color: #1769ff;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 12px;
}
</style>
</head>


<body>

<div class="container">

    <div class="badge">
        PORT DA ESTIMATOR
    </div>

    <h1>⚓ Port Cost Calculator</h1>

    <div class="subtitle">
        Estimated Port Disbursement
    </div>


    <div class="card">

        <label>PORT</label>

        <select id="port">
            <option value="ulsan">Ulsan</option>
        </select>


        <label>GRT</label>

        <input
            id="grt"
            type="number"
            inputmode="numeric"
            placeholder="Enter vessel GRT"
        >


        <div class="two-columns">

            <div>

                <label>BERTH DAYS</label>

                <input
                    id="days"
                    type="number"
                    inputmode="decimal"
                    value="1"
                    min="1"
                >

            </div>


            <div>

                <label>USD / KRW</label>

                <input
                    id="exchange"
                    type="number"
                    inputmode="decimal"
                    value="1400"
                >

            </div>

        </div>


        <button onclick="calculateCost()">
            CALCULATE
        </button>

    </div>



    <div id="resultArea" class="hidden">

        <div class="card">

            <div class="result-title">
                ESTIMATED CHARGES
            </div>


            <div class="cost-row">
                <div class="cost-name">Port Dues</div>
                <div class="cost-value" id="portDues">₩0</div>
            </div>


            <div class="cost-row">
                <div class="cost-name">Security</div>
                <div class="cost-value" id="security">₩0</div>
            </div>


            <div class="cost-row">
                <div class="cost-name">Dockage</div>
                <div class="cost-value" id="dockage">₩0</div>
            </div>
