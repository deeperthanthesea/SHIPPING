<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Vessel Condition</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #edf3f9;
  color: #102b50;
  font-family: Arial, sans-serif;
}

.app {
  max-width: 600px;
  margin: auto;
  min-height: 100vh;
  background: white;
}

header {
  background: #15385e;
  color: white;
  text-align: center;
  padding: 19px 10px;
  font-size: 22px;
  font-weight: bold;
}

main {
  padding: 12px;
}

button, input, select, textarea {
  font-family: inherit;
}

button {
  cursor: pointer;
}

.toolbar {
  display: flex;
  gap: 7px;
  margin-bottom: 12px;
}

.toolbar select {
  flex: 1;
  min-width: 0;
  padding: 10px;
  border: 1px solid #c6d7e8;
  border-radius: 6px;
  background: white;
  color: #102b50;
}

.toolbar button {
  padding: 10px;
  background: #e1ebf6;
  border: 0;
  border-radius: 6px;
  color: #15385e;
  font-weight: bold;
}

.vessel {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 13px;
}

.vessel span {
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
}

.vessel input {
  flex: 1;
  min-width: 0;
  border: 1px solid #c6d7e8;
  border-radius: 6px;
  padding: 11px;
  font-size: 17px;
  font-weight: bold;
  color: #102b50;
}

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  margin-bottom: 12px;
}

.tabs button {
  padding: 13px;
  border: 1px solid #d2e0ed;
  border-radius: 6px;
  background: #e9f1f8;
  color: #526a83;
  font-weight: bold;
  font-size: 15px;
}

.tabs button.active {
  background: #15385e;
  color: white;
}

.event {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 52%);
  gap: 6px;
  align-items: center;
  min-height: 58px;
  padding: 8px 2px;
  border-bottom: 1px solid #dce6ef;
}

.event-label {
  min-width: 0;
  font-size: 13px;
  line-height: 1.35;
  font-weight: bold;
  overflow-wrap: break-word;
}

.first-label {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}

.port-input {
  width: 58px;
  min-width: 0;
  padding: 7px 3px;
  border: 1px solid #c6d7e8;
  border-radius: 5px;
  color: #102b50;
  font-size: 11px;
  font-weight: bold;
  text-align: center;
}

.date-fields {
  display: grid;
  grid-template-columns: 1.05fr .52fr .9fr;
  gap: 3px;
  width: 100%;
  min-width: 0;
}

.date-fields input,
.date-fields select {
  width: 100%;
  min-width: 0;
  height: 38px;
  padding: 2px;
  border: 1px solid #c6d7e8;
  border-radius: 5px;
  background: white;
  color: #102b50;
  text-align: center;
  font-size: 12px;
  font-weight: bold;
}

.date-fields select {
  font-size: 11px;
}

.section-title {
  margin-top: 14px;
  padding: 9px;
  background: #15385e;
  color: white;
  text-align: center;
  font-weight: bold;
  border-radius: 5px 5px 0 0;
}

.data-grid {
  display: grid;
  gap: 5px;
  padding: 8px;
  background: #eaf2f9;
  border-radius: 0 0 5px 5px;
}

.rob {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.draft {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.data-item {
  text-align: center;
  min-width: 0;
}

.data-item label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: bold;
}

.data-item input {
  width: 100%;
  min-width: 0;
  padding: 10px 3px;
  border: 1px solid #c6d7e8;
  border-radius: 5px;
  text-align: center;
  font-size: 16px;
  color: #102b50;
}

.remark {
  margin-top: 14px;
}

.remark textarea {
  width: 100%;
  min-height: 90px;
  padding: 12px;
  border: 1px solid #c6d7e8;
  border-radius: 5px;
  resize: vertical;
  font-size: 14px;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 7px;
  margin-top: 18px;
}

.actions button {
  padding: 13px 3px;
  border: 0;
  border-radius: 6px;
  font-size: 13px;
  font-weight: bold;
}

.save {
  background: #1763b4;
  color: white;
}

.export {
  background: #15385e;
  color: white;
}

.delete {
  background: #e7edf3;
  color: #a42b2b;
}

#status {
  margin: 12px 0;
  font-size: 12px;
  color: #62768b;
  text-align: center;
}

dialog {
  border: 1px solid #c6d7e8;
  border-radius: 12px;
  padding: 24px;
  width: min(90vw, 360px);
}

dialog input {
  width: 100%;
  padding: 12px;
  margin: 12px 0;
}

dialog button {
  width: 100%;
  padding: 12px;
  background: #15385e;
  color: white;
  border: 0;
  border-radius: 5px;
}

/* PNG export layout */

#exportSheet {
  position: absolute;
  left: -9999px;
  top: 0;
  width: 760px;
  background: white;
  padding: 22px;
  color: #102b50;
}

.report-header {
  padding: 18px;
  background: #15385e;
  color: white;
  text-align: center;
  font-size: 29px;
  font-weight: bold;
}

.report-vessel {
  padding: 16px;
  background: #eaf2f9;
  font-size: 21px;
  font-weight: bold;
}

.report-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 245px;
  gap: 12px;
  align-items: center;
  min-height: 65px;
  padding: 13px 10px;
  border-bottom: 1px solid #dce6ef;
}

.report-label {
  font-size: 19px;
  font-weight: bold;
  overflow-wrap: break-word;
}

.report-date {
  text-align: right;
  font-size: 20px;
  font-weight: bold;
  white-space: nowrap;
}

.report-section {
  margin-top: 18px;
}

.report-section-title {
  background: #15385e;
  color: white;
  text-align: center;
  padding: 10px;
  font-size: 20px;
  font-weight: bold;
}

.report-values {
  display: grid;
  background: #eaf2f9;
  padding: 12px;
  gap: 10px;
}

.report-value {
  text-align: center;
  font-size: 18px;
}

.report-value strong {
  display: block;
  margin-top: 8px;
  font-size: 22px;
}

.report-remark {
  margin-top: 18px;
  padding: 16px;
  background: #eaf2f9;
  font-size: 18px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

@media(max-width: 360px) {
  main {
    padding: 8px;
  }

  .event-label {
    font-size: 11.5px;
  }

  .port-input {
    width: 48px;
    font-size: 10px;
  }

  .date-fields input,
  .date-fields select {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>VESSEL CONDITION</header>

<main>

<div class="toolbar">
  <select id="recordSelect"></select>
  <button id="newRecord">+ 새 기록</button>
</div>

<div class="vessel">
  <span>VESSEL :</span>
  <input id="vesselName" placeholder="선박명 입력">
</div>

<div class="tabs">
  <button id="arrivalTab" class="active">ARRIVAL</button>
  <button id="sailingTab">SAILING</button>
</div>

<div id="events"></div>

<div class="section-title">R.O.B. (MT)</div>

<div class="data-grid rob">
  <div class="data-item">
    <label>FO</label>
    <input id="fo" inputmode="decimal">
  </div>

  <div class="data-item">
    <label>MGO</label>
    <input id="mgo" inputmode="decimal">
  </div>

  <div class="data-item">
    <label>FW</label>
    <input id="fw" inputmode="decimal">
  </div>
</div>

<div class="section-title">DRAFT (M)</div>

<div class="data-grid draft">
  <div class="data-item">
    <label>FWD</label>
    <input id="fwd" inputmode="decimal">
  </div>

  <div class="data-item">
    <label>AFT</label>
    <input id="aft" inputmode="decimal">
  </div>
</div>

<div class="section-title">REMARK</div>

<div class="remark">
  <textarea id="remark"
    placeholder="메모 입력"></textarea>
</div>

<div class="actions">
  <button class="delete" id="deleteRecord">삭제</button>
  <button class="save" id="saveRecord">저장</button>
  <button class="export" id="exportImage">PNG 내보내기</button>
</div>

<p id="status"></p>

</main>
</div>

<dialog id="authDialog">
  <form id="authForm">
    <strong>온라인 저장 연결</strong>
    <p>Cloudflare에 설정한 접속 암호를 입력하세요.</p>
    <input id="password" type="password" required>
    <button type="submit">연결</button>
  </form>
</dialog>

<div id="exportSheet"></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>

const MONTHS = [
  "JAN","FEB","MAR","APR","MAY","JUN",
  "JUL","AUG","SEP","OCT","NOV","DEC"
];

const LABELS = {
  arrival: [
    "Arrived Ulsan (Drop Anchor)",
    "Arrived Ulsan (Drifting)",
    "N/R Tendered",
    "N/R Accepted",
    "Free Pratique Granted",
    "Hove Anchor (Anchor Aweigh)",
    "Pilot Onboarding",
    "First Line To",
    "All Made Fast",
    "Commenced Loading / Discharging"
  ],

  sailing: [
    "Complete Loading / Discharge",
    "POB",
    "Sailed Ulsan"
  ]
};

const $ = id => document.getElementById(id);

function blankSection(type) {
  return {
    times: LABELS[type].map(() => ({
      time: "",
      day: "",
      month: ""
    })),
    port: "",
    rob: { fo:"", mgo:"", fw:"" },
    draft: { fwd:"", aft:"" },
    remark: ""
  };
}

function blankData() {
  return {
    arrival: blankSection("arrival"),
    sailing: blankSection("sailing")
  };
}

function exampleRecord() {
  const data = blankData();

  const times = [
    "0100","",
    "0100","0130","0200",
    "0530","0600","0645",
    "0700","0800"
  ];

  data.arrival.times.forEach((item, i) => {
    item.time = times[i];
    item.day = times[i] ? "09" : "";
    item.month = times[i] ? "OCT" : "";
  });

  data.arrival.port = "ULSAN";

  data.arrival.rob = {
    fo: "268.58",
    mgo: "24.24",
    fw: "101"
  };

  data.arrival.draft = {
    fwd: "7.2",
    aft: "7.3"
  };

  data.arrival.remark = "-";

  return {
    id: crypto.randomUUID(),
    vessel: "SHUN CHI",
    data,
    updated_at: ""
  };
}

let records = [];
let current = exampleRecord();
let tab = "arrival";
let dirty = false;

function setStatus(message) {
  $("status").textContent = message;
}

function markDirty() {
  dirty = true;
  setStatus("수정 중 · 저장되지 않음");
}

function make(tag, className, value) {
  const el = document.createElement(tag);

  if (className) el.className = className;
  if (value !== undefined) el.textContent = value;

  return el;
}

function renderList() {
  const select = $("recordSelect");
  select.replaceChildren();

  const list = [...records];

  if (!list.some(r => r.id === current.id)) {
    list.unshift(current);
  }

  list.forEach(r => {
    const option = document.createElement("option");

    option.value = r.id;

    const date = r.updated_at
      ? " · " + r.updated_at.slice(0,10)
      : " · 작성 중";

    option.textContent = (r.vessel || "새 선박") + date;

    select.appendChild(option);
  });

  select.value = current.id;
}

function render() {
  $("vesselName").value = current.vessel;

  $("arrivalTab").classList.toggle(
    "active", tab === "arrival"
  );

  $("sailingTab").classList.toggle(
    "active", tab === "sailing"
  );

  const section = current.data[tab];
  const container = $("events");

  container.replaceChildren();

  LABELS[tab].forEach((name, i) => {
    const row = make("div", "event");
    const label = make("div", "event-label", name);

    if (tab === "arrival" && i === 7) {
      label.classList.add("first-label");

      const port = make("input", "port-input");

      port.placeholder = "PORT";
      port.value = section.port || "";
      port.id = "firstLinePort";
      port.maxLength = 30;

      label.appendChild(port);
    }

    const date = make("div", "date-fields");
    date.classList.add("dateSet");
    date.dataset.index = i;

    const time = document.createElement("input");
    time.inputMode = "numeric";
    time.maxLength = 4;
    time.placeholder = "0000";
    time.dataset.part = "time";
    time.value = section.times[i].time || "";

    const day = document.createElement("input");
    day.inputMode = "numeric";
    day.maxLength = 2;
    day.placeholder = "DD";
    day.dataset.part = "day";
    day.value = section.times[i].day || "";

    const month = document.createElement("select");
    month.dataset.part = "month";

    const empty = document.createElement("option");
    empty.value = "";
    empty.textContent = "MON";
    month.appendChild(empty);

    MONTHS.forEach(m => {
      const option = document.createElement("option");
      option.value = m;
      option.textContent = m;
      month.appendChild(option);
    });

    month.value = section.times[i].month || "";

    date.append(time, day, month);
    row.append(label, date);
    container.appendChild(row);
  });

  ["fo","mgo","fw"].forEach(key => {
    $(key).value = section.rob[key] || "";
  });

  ["fwd","aft"].forEach(key => {
    $(key).value = section.draft[key] || "";
  });

  $("remark").value = section.remark || "";

  renderList();
}

function readForm() {
  current.vessel = $("vesselName").value.trim();

  const section = current.data[tab];

  document.querySelectorAll(".dateSet").forEach(el => {
    const i = Number(el.dataset.index);

    const time = el.querySelector('[data-part="time"]')
      .value.replace(/\D/g,"").slice(0,4);

    const day = el.querySelector('[data-part="day"]')
      .value.replace(/\D/g,"").slice(0,2);

    const month = el.querySelector('[data-part="month"]').value;

    section.times[i] = { time, day, month };
  });

  if (tab === "arrival") {
    section.port = $("firstLinePort").value.trim();
  }

  ["fo","mgo","fw"].forEach(key => {
    section.rob[key] = $(key).value.trim();
  });

  ["fwd","aft"].forEach(key => {
    section.draft[key] = $(key).value.trim();
  });

  section.remark = $("remark").value;
}

function switchTab(next) {
  readForm();
  tab = next;
  render();
}

$("arrivalTab").onclick = () => switchTab("arrival");
$("sailingTab").onclick = () => switchTab("sailing");

document.querySelector("main").addEventListener(
  "input", markDirty
);

document.querySelector("main").addEventListener(
  "change", e => {
    if (e.target.id !== "recordSelect") markDirty();
  }
);

$("newRecord").onclick = () => {
  if (dirty && !confirm("저장하지 않은 수정 내용이 있습니다. 새 기록을 만들까요?")) {
    return;
  }

  const vessel = current.vessel;

  current = {
    id: crypto.randomUUID(),
    vessel,
    data: blankData(),
    updated_at: ""
  };

  tab = "arrival";
  dirty = false;

  render();
  setStatus("새 기록 작성 중");
};

$("recordSelect").onchange = e => {
  const id = e.target.value;

  if (dirty && !confirm("저장하지 않은 수정 내용이 사라집니다. 계속할까요?")) {
    e.target.value = current.id;
    return;
  }

  const found = records.find(r => r.id === id);

  if (found) {
    current = structuredClone(found);
  }

  tab = "arrival";
  dirty = false;
  render();

  setStatus("기록을 불러왔습니다.");
};

function getPassword() {
  return sessionStorage.getItem("condition_password");
}

async function api(method, body) {
  const password = getPassword();

  if (!password) {
    $("authDialog").showModal();
    throw new Error("먼저 접속 암호를 입력하세요.");
  }

  const response = await fetch(
  "https://condition-api.makepdaquickly.workers.dev/api/records",
  {
    method,
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + password
    },
    body: body ? JSON.stringify(body) : undefined
  });

  const result = await response.json();

  if (response.status === 401) {
    sessionStorage.removeItem("condition_password");
    $("authDialog").showModal();
  }

  if (!response.ok) {
    throw new Error(result.error || "서버 오류");
  }

  return result;
}

async function loadRecords() {
  try {
    const result = await api("GET");

    records = result.records.map(r => ({
      ...r,
      data: JSON.parse(r.data)
    }));

    if (records.length) {
      current = structuredClone(records[0]);
    }

    dirty = false;
    render();

    setStatus("온라인 데이터베이스 연결 완료");
  } catch (error) {
    setStatus(error.message);
  }
}

$("authForm").onsubmit = async e => {
  e.preventDefault();

  sessionStorage.setItem(
    "condition_password",
    $("password").value
  );

  $("authDialog").close();
  $("password").value = "";

  await loadRecords();
};

$("saveRecord").onclick = async () => {
  readForm();

  if (!current.vessel) {
    alert("선박명을 입력하세요.");
    return;
  }

  try {
    const result = await api("POST", current);

    current.updated_at = result.updated_at;

    records = records.filter(r => r.id !== current.id);
    records.unshift(structuredClone(current));

    dirty = false;
    renderList();

    setStatus("온라인 저장 완료");
    alert("저장되었습니다.");
  } catch (error) {
    setStatus(error.message);
    alert("저장 실패: " + error.message);
  }
};

$("deleteRecord").onclick = async () => {
  if (!confirm("이 기록을 삭제할까요?")) return;

  const saved = records.some(r => r.id === current.id);

  try {
    if (saved) {
      await api("DELETE", { id: current.id });
    }

    records = records.filter(r => r.id !== current.id);

    current = records.length
      ? structuredClone(records[0])
      : {
          id: crypto.randomUUID(),
          vessel: "",
          data: blankData(),
          updated_at: ""
        };

    tab = "arrival";
    dirty = false;
    render();

    setStatus("기록이 삭제되었습니다.");
  } catch (error) {
    alert("삭제 실패: " + error.message);
  }
};

function ordinal(day) {
  const n = Number(day);

  if (!n) return "";

  const suffix =
    n % 100 >= 11 && n % 100 <= 13
      ? "TH"
      : n % 10 === 1
      ? "ST"
      : n % 10 === 2
      ? "ND"
      : n % 10 === 3
      ? "RD"
      : "TH";

  return String(n).padStart(2,"0") + suffix;
}

function formatDate(item) {
  if (!item.time || !item.day || !item.month) {
    return "-";
  }

  return item.time.padStart(4,"0")
    + "/"
    + ordinal(item.day)
    + " "
    + item.month;
}

function buildExport() {
  const sheet = $("exportSheet");
  sheet.replaceChildren();

  const section = current.data[tab];

  const title = tab === "arrival"
    ? "ARRIVAL CONDITION"
    : "SAILING CONDITION";

  sheet.appendChild(
    make("div","report-header",title)
  );

  sheet.appendChild(
    make("div","report-vessel",
      "VESSEL : " + current.vessel)
  );

  LABELS[tab].forEach((name,i) => {
    const row = make("div","report-row");

    let labelText = name;

    if (tab === "arrival" && i === 7 && section.port) {
      labelText += " (" + section.port + ")";
    }

    row.appendChild(
      make("div","report-label",labelText)
    );

    row.appendChild(
      make("div","report-date",
        formatDate(section.times[i]))
    );

    sheet.appendChild(row);
  });

  function addSection(title, values, columns) {
    const wrap = make("div","report-section");

    wrap.appendChild(
      make("div","report-section-title",title)
    );

    const grid = make("div","report-values");

    grid.style.gridTemplateColumns =
      `repeat(${columns}, minmax(0, 1fr))`;

    values.forEach(([label,value]) => {
      const item = make("div","report-value");

      item.appendChild(make("div","",label));
      item.appendChild(make("strong","",value || "-"));

      grid.appendChild(item);
    });

    wrap.appendChild(grid);
    sheet.appendChild(wrap);
  }

  addSection("R.O.B. (MT)", [
    ["FO",section.rob.fo],
    ["MGO",section.rob.mgo],
    ["FW",section.rob.fw]
  ],3);

  addSection("DRAFT (M)", [
    ["FWD",section.draft.fwd],
    ["AFT",section.draft.aft]
  ],2);

  sheet.appendChild(
    make("div","report-remark",
      "REMARK\n" + (section.remark || "-"))
  );

  return sheet;
}

$("exportImage").onclick = async () => {
  readForm();

  if (typeof html2canvas === "undefined") {
    alert("이미지 변환 기능을 불러오지 못했습니다.");
    return;
  }

  const button = $("exportImage");
  button.disabled = true;
  button.textContent = "변환 중...";

  try {
    const sheet = buildExport();

    const canvas = await html2canvas(sheet, {
      backgroundColor: "#ffffff",
      scale: 2,
      windowWidth: 800,
      logging: false
    });

    const blob = await new Promise(resolve => {
      canvas.toBlob(resolve,"image/png");
    });

    if (!blob) throw new Error("이미지 생성 실패");

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download =
      (current.vessel || "VESSEL").replace(/[^\w-]/g,"_")
      + "_"
      + tab.toUpperCase()
      + ".png";

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url),60000);

    setStatus("PNG 이미지 생성 완료");

  } catch (error) {
    alert("이미지 생성 실패: " + error.message);
  } finally {
    button.disabled = false;
    button.textContent = "PNG 내보내기";
  }
};

render();

if (getPassword()) {
  loadRecords();
} else {
  $("authDialog").showModal();
}

</script>

</body>
</html>
