<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Ulsan Cargo Reference</title>

<style>
:root{
  --bg:#f4f5f6;
  --card:#ffffff;
  --text:#20262e;
  --muted:#858d96;
  --line:#dfe3e6;
  --dark:#202730;

  --remark-bg:#fff8e6;
  --remark-text:#67500d;

  --radius:15px;
}

*{
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:18px;
}

/* =========================================
   HEADER
========================================= */

.page-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;

  margin-bottom:18px;
}

.page-title{
  margin:0;

  font-size:28px;
  font-weight:950;
  letter-spacing:-0.6px;
}

.page-subtitle{
  margin:4px 0 0;

  color:var(--muted);
  font-size:12px;
}

.primary-btn{
  flex:0 0 auto;

  padding:11px 14px;

  border:0;
  border-radius:10px;

  background:var(--dark);
  color:#fff;

  font-size:11px;
  font-weight:900;
}

/* =========================================
   SEARCH
========================================= */

.search-wrap{
  margin-bottom:15px;
}

.search-input{
  width:100%;
  padding:13px 14px;

  border:1px solid var(--line);
  border-radius:11px;

  background:#fff;
  color:var(--text);

  outline:none;

  font-size:13px;
}

.search-input:focus{
  border-color:#939ba3;
}

/* =========================================
   CARGO LIST
========================================= */

#cargoList{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.cargo-card{
  overflow:hidden;

  background:var(--card);

  border:1px solid var(--line);
  border-radius:var(--radius);
}

.cargo-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:15px;

  padding:16px 17px 14px;
}

.cargo-pier-label{
  margin-bottom:4px;

  color:#9299a1;

  font-size:9px;
  font-weight:950;
  letter-spacing:.7px;
}

.cargo-pier{
  margin-bottom:5px;

  color:#68717a;

  font-size:12px;
  font-weight:850;
}

.cargo-name{
  margin:0;

  color:#20262e;

  font-size:20px;
  font-weight:950;
  line-height:1.2;
}

.cargo-actions{
  display:flex;
  gap:5px;

  flex:0 0 auto;
}

.small-btn{
  padding:7px 9px;

  border:0;
  border-radius:7px;

  background:#edf0f2;
  color:#59616a;

  font-size:9px;
  font-weight:950;
}

.small-btn.delete{
  background:#fff0f0;
  color:#ad4a4a;
}

/* =========================================
   CARGO TABLE
========================================= */

.table-scroll{
  overflow-x:auto;

  border-top:1px solid var(--line);

  -webkit-overflow-scrolling:touch;
}

.cargo-table{
  width:100%;
  min-width:720px;

  border-collapse:collapse;
  table-layout:fixed;
}

.cargo-table th{
  padding:8px 8px;

  background:#f2f4f5;

  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);

  color:#818991;

  font-size:9px;
  font-weight:950;
  letter-spacing:.3px;

  text-align:left;
}

.cargo-table td{
  padding:10px 8px;

  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);

  color:#30373e;

  font-size:12px;
  font-weight:750;
  line-height:1.4;

  vertical-align:top;

  overflow-wrap:anywhere;
}

.cargo-table th:last-child,
.cargo-table td:last-child{
  border-right:0;
}

.cargo-table tbody tr:last-child td{
  border-bottom:0;
}

.col-time{width:100px;}
.col-gang{width:80px;}
.col-rate{width:75px;}
.col-qty{width:75px;}
.col-day{width:72px;}
.col-remark{width:auto;}

.rate-cell{
  font-weight:950 !important;
}

.remark-cell.has-remark{
  background:var(--remark-bg);
  color:var(--remark-text);
}

.empty-text{
  color:#b0b6bb;
}

/* =========================================
   EMPTY
========================================= */

.empty{
  padding:35px 15px;

  background:#fff;

  border:1px solid var(--line);
  border-radius:15px;

  color:#90979e;
  text-align:center;

  font-size:13px;
}

/* =========================================
   MODAL
========================================= */

.modal-bg{
  position:fixed;
  inset:0;
  z-index:100;

  display:none;
  align-items:center;
  justify-content:center;

  padding:15px;

  background:rgba(20,25,30,.58);
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:760px;
  max-height:92vh;

  overflow-y:auto;

  padding:20px;

  background:#fff;

  border-radius:17px;
}

.modal-title{
  margin:0 0 18px;

  font-size:21px;
  font-weight:950;
}

.top-fields{
  display:grid;
  grid-template-columns:160px 1fr;

  gap:9px;
}

.field{
  display:block;
  margin-bottom:12px;
}

.field span{
  display:block;

  margin-bottom:5px;

  color:#737b83;

  font-size:9px;
  font-weight:950;
  letter-spacing:.4px;
}

.field input{
  width:100%;

  padding:11px;

  border:1px solid #d8dde1;
  border-radius:9px;

  outline:none;

  color:var(--text);
  background:#fff;
}

.field input:focus{
  border-color:#77818b;
}

/* =========================================
   EDIT ROWS
========================================= */

.condition-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin:12px 0 8px;
}

.condition-title{
  font-size:12px;
  font-weight:950;
}

.add-row-btn{
  padding:8px 10px;

  border:0;
  border-radius:8px;

  background:#e9edef;
  color:#414950;

  font-size:9px;
  font-weight:950;
}

.condition-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.condition-row{
  position:relative;

  display:grid;
  grid-template-columns:
    1fr
    .8fr
    .8fr
    .8fr
    .75fr
    2fr;

  gap:6px;

  padding:10px;

  background:#f6f7f8;

  border:1px solid #e1e5e7;
  border-radius:10px;
}

.condition-field{
  min-width:0;
}

.condition-field label{
  display:block;

  margin-bottom:4px;

  color:#8b939a;

  font-size:8px;
  font-weight:950;
}

.condition-field input{
  width:100%;
  min-width:0;

  padding:9px 7px;

  border:1px solid #d7dce0;
  border-radius:7px;

  background:#fff;

  font-size:11px;
}

.remove-row-btn{
  position:absolute;

  top:-7px;
  right:-7px;

  width:24px;
  height:24px;

  padding:0;

  border:0;
  border-radius:50%;

  background:#d96161;
  color:#fff;

  font-size:14px;
  font-weight:900;
}

/* =========================================
   MODAL BUTTONS
========================================= */

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-top:18px;
}

.modal-buttons button{
  padding:13px;

  border:0;
  border-radius:10px;

  font-size:11px;
  font-weight:950;
}

.cancel-btn{
  background:#eceff1;
  color:#596169;
}

.save-btn{
  background:var(--dark);
  color:#fff;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

  .app{
    padding:12px;
  }

  .page-title{
    font-size:25px;
  }

  .primary-btn{
    padding:10px 11px;
    font-size:9px;
  }

  .cargo-name{
    font-size:18px;
  }

  /*
    On mobile, table can be horizontally
    scrolled without destroying layout.
  */

  .cargo-table{
    min-width:670px;
  }

  .cargo-table th{
    font-size:8px;
  }

  .cargo-table td{
    font-size:11px;
  }

  .modal{
    padding:15px;
  }

  .top-fields{
    grid-template-columns:1fr;
    gap:0;
  }

  .condition-row{
    grid-template-columns:1fr 1fr;
    gap:7px;
  }

  .condition-field.remark-editor{
    grid-column:1 / -1;
  }
}

</style>
</head>

<div class="app">

    <div>

      </p>
    </div>

    <button
      id="addCargoBtn"

    </button>

  </div>


  <div class="search-wrap">

    >

  </div>


  <div id="cargoList"></div>

</div>


<!-- ======================================
     EDIT MODAL
====================================== -->

<div

  class="modal-bg"
>

  <div class="modal">

    <h2
      id="modalTitle"

    </h2>


    <div class="top-fields">

      <label class="field">

        <span>PIER</span>

        <input
          id="pierInput"
          type="text"
          placeholder="e.g. 12-22"
        >

      </label>


      <label class="field">

        <span>CARGO</span>

        <input
          id="cargoInput"
          type="text"
          placeholder="e.g. BENTONITE"
        >

      </label>

    </div>


    <div class="condition-header">

      <div class="condition-title">
        WORKING CONDITIONS
      </div>

      <button
        id="addRowBtn"
        class="add-row-btn"
        type="button"
      >
        + ADD ROW
      </button>

    </div>


    <div id="conditionList"></div>


    <div class="modal-buttons">

      <button
        id="cancelBtn"
        class="cancel-btn"
        type="button"
      >
        CANCEL
      </button>

      <button
        id="saveBtn"
        class="save-btn"
        type="button"
      >
        SAVE
      </button>

    </div>

  </div>

</div>

/* =========================================
   STORAGE
========================================= */

const STORAGE_KEY =
  "ulsan-cargo-reference-v1";


function cloneDefaultData(){

  return JSON.parse(
    JSON.stringify(DEFAULT_CARGO)
  );

}


function loadCargo(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(!saved){
      return cloneDefaultData();
    }

    return JSON.parse(saved);

  }catch(error){

    return cloneDefaultData();

  }

}


function saveCargo(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(cargoData)
  );

}


/* =========================================
   HELPERS
========================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function displayValue(value){

  if(
    value === undefined ||
    value === null ||
    String(value).trim() === ""
  ){

    return `
      <span class="empty-text">
        —
      </span>
    `;

  }

  return escapeHTML(value);

}


/* =========================================
   STATE
========================================= */

let cargoData = loadCargo();

let editingId = null;


/* =========================================
   ELEMENTS
========================================= */

const cargoList =
  document.getElementById("cargoList");

const searchInput =
  document.getElementById("searchInput");

const modal =
  document.getElementById("cargoModal");

const modalTitle =
  document.getElementById("modalTitle");

const pierInput =
  document.getElementById("pierInput");

const cargoInput =
  document.getElementById("cargoInput");

const conditionList =
  document.getElementById("conditionList");


/* =========================================
   RENDER CARGO
========================================= */

function renderCargo(){

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    cargoData.filter(function(item){

      if(!keyword){
        return true;
      }

      return (
        String(item.name)
          .toLowerCase()
          .includes(keyword)

        ||

        String(item.pier)
          .toLowerCase()
          .includes(keyword)
      );

    });


  if(!filtered.length){

    cargoList.innerHTML = `
      <div class="empty">
        No cargo found.
      </div>
    `;

    return;
  }


  cargoList.innerHTML =
    filtered.map(function(item){

      const rows =
        item.rows && item.rows.length
          ? item.rows
          : [{}];


      const rowHTML =
        rows.map(function(row){

          const remark =
            String(row.remark || "").trim();


          return `
            <tr>

              <td>
                ${displayValue(row.time)}
              </td>

              <td>
                ${displayValue(row.gang)}
              </td>

              <td class="rate-cell">
                ${displayValue(row.rate)}
              </td>

              <td>
                ${displayValue(row.qty)}
              </td>

              <td>
                ${displayValue(row.day)}
              </td>

              <td
                class="
                  remark-cell
                  ${remark ? "has-remark" : ""}
                "
              >
                ${displayValue(remark)}
              </td>

            </tr>
          `;

        }).join("");


      return `
        <article class="cargo-card">

          <div class="cargo-head">

            <div>

              <div class="cargo-pier-label">
                PIER
              </div>

              <div class="cargo-pier">
                ${displayValue(item.pier)}
              </div>

              <h2 class="cargo-name">
                ${escapeHTML(item.name)}
              </h2>

            </div>


            <div class="cargo-actions">

              <button
                class="small-btn"
                type="button"
                onclick="editCargo(${item.id})"
              >
                EDIT
              </button>

              <button
                class="small-btn delete"
                type="button"
                onclick="deleteCargo(${item.id})"
              >
                DELETE
              </button>

            </div>

          </div>


          <div class="table-scroll">

            <table class="cargo-table">

              <thead>

                <tr>

                  <th class="col-time">
                    TIME
                  </th>

                  <th class="col-gang">
                    GANG
                  </th>

                  <th class="col-rate">
                    RATE
                  </th>

                  <th class="col-qty">
                    QTY
                  </th>

                  <th class="col-day">
                    DAY
                  </th>

                  <th class="col-remark">
                    REMARK
                  </th>

                </tr>

              </thead>


              <tbody>
                ${rowHTML}
              </tbody>

            </table>

          </div>

        </article>
      `;

    }).join("");

}


/* =========================================
   EDITOR ROW
========================================= */

function createConditionRow(data = {}){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "condition-row";


  wrapper.innerHTML = `

    <div class="condition-field">

      <label>TIME</label>

      <input
        class="edit-time"
        type="text"
        placeholder="0800-1700"
        value="${escapeHTML(data.time || "")}"
      >

    </div>


    <div class="condition-field">

      <label>GANG</label>

      <input
        class="edit-gang"
        type="text"
        placeholder="2 gang"
        value="${escapeHTML(data.gang || "")}"
      >

    </div>


    <div class="condition-field">

      <label>RATE</label>

      <input
        class="edit-rate"
        type="text"
        placeholder="1,800"
        value="${escapeHTML(data.rate || "")}"
      >

    </div>


    <div class="condition-field">

      <label>QTY</label>

      <input
        class="edit-qty"
        type="text"
        placeholder="3,000"
        value="${escapeHTML(data.qty || "")}"
      >

    </div>


    <div class="condition-field">

      <label>DAY</label>

      <input
        class="edit-day"
        type="text"
        placeholder="2 day"
        value="${escapeHTML(data.day || "")}"
      >

    </div>


    <div
      class="
        condition-field
        remark-editor
      "
    >

      <label>REMARK</label>

      <input
        class="edit-remark"
        type="text"
        placeholder="Remark..."
        value="${escapeHTML(data.remark || "")}"
      >

    </div>


    <button
      class="remove-row-btn"
      type="button"
      title="Delete row"
    >
      ×
    </button>

  `;


  wrapper
    .querySelector(".remove-row-btn")
    .addEventListener(
      "click",
      function(){

        wrapper.remove();

        if(
          !conditionList.children.length
        ){

          conditionList.appendChild(
            createConditionRow()
          );

        }

      }
    );


  return wrapper;

}


/* =========================================
   OPEN / CLOSE MODAL
========================================= */

function openModal(item){

  conditionList.innerHTML = "";


  if(item){

    editingId = item.id;

    modalTitle.textContent =
      "EDIT CARGO";

    pierInput.value =
      item.pier || "";

    cargoInput.value =
      item.name || "";


    const rows =
      item.rows && item.rows.length
        ? item.rows
        : [{}];


    rows.forEach(function(row){

      conditionList.appendChild(
        createConditionRow(row)
      );

    });

  }else{

    editingId = null;

    modalTitle.textContent =
      "ADD CARGO";

    pierInput.value = "";
    cargoInput.value = "";

    conditionList.appendChild(
      createConditionRow()
    );

  }


  modal.classList.add("show");

}


function closeModal(){

  modal.classList.remove("show");

}


/* =========================================
   EDIT
========================================= */

window.editCargo =
  function(id){

    const item =
      cargoData.find(function(cargo){
        return cargo.id === id;
      });

    if(item){
      openModal(item);
    }

  };


/* =========================================
   DELETE
========================================= */

window.deleteCargo =
  function(id){

    const item =
      cargoData.find(function(cargo){
        return cargo.id === id;
      });


    if(!item){
      return;
    }


    const confirmed =
      confirm(
        "Delete " +
        item.name +
        "?"
      );


    if(!confirmed){
      return;
    }


    cargoData =
      cargoData.filter(function(cargo){
        return cargo.id !== id;
      });


    saveCargo();

    renderCargo();

  };


/* =========================================
   SAVE
========================================= */

function collectRows(){

  return Array.from(
    conditionList
      .querySelectorAll(".condition-row")
  ).map(function(row){

    return {

      time:
        row
          .querySelector(".edit-time")
          .value
          .trim(),

      gang:
        row
          .querySelector(".edit-gang")
          .value
          .trim(),

      rate:
        row
          .querySelector(".edit-rate")
          .value
          .trim(),

      qty:
        row
          .querySelector(".edit-qty")
          .value
          .trim(),

      day:
        row
          .querySelector(".edit-day")
          .value
          .trim(),

      remark:
        row
          .querySelector(".edit-remark")
          .value
          .trim()

    };

  });

}


document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    function(){

      const name =
        cargoInput.value.trim();


      if(!name){

        alert(
          "Please enter cargo name."
        );

        cargoInput.focus();

        return;

      }


      const newItem = {

        id:
          editingId !== null
            ? editingId
            : Date.now(),

        pier:
          pierInput.value.trim(),

        name:name,

        rows:collectRows()

      };


      if(editingId !== null){

        cargoData =
          cargoData.map(function(item){

            if(item.id === editingId){
              return newItem;
            }

            return item;

          });

      }else{

        cargoData.push(newItem);

      }


      saveCargo();

      closeModal();

      renderCargo();

    }
  );


/* =========================================
   BUTTON EVENTS
========================================= */

document
  .getElementById("addCargoBtn")
  .addEventListener(
    "click",
    function(){

      openModal(null);

    }
  );


document
  .getElementById("addRowBtn")
  .addEventListener(
    "click",
    function(){

      conditionList.appendChild(
        createConditionRow()
      );

    }
  );


document
  .getElementById("cancelBtn")
  .addEventListener(
    "click",
    closeModal
  );


modal.addEventListener(
  "click",
  function(event){

    if(event.target === modal){
      closeModal();
    }

  }
);


searchInput.addEventListener(
  "input",
  renderCargo
);


/* =========================================
   INITIAL RENDER
========================================= */

renderCargo();

</script>
