<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Ulsan Cargo Reference</title>

<style>
:root{
  --bg:#f4f5f6;
  --card:#fff;
  --text:#20262e;
  --muted:#858d96;
  --line:#dfe3e6;
  --soft:#f4f5f6;
  --dark:#202730;

  --remark-bg:#fff6dc;
  --remark-border:#e5ad35;
  --remark-text:#5d480f;

  --radius:15px;
}

*{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,input,textarea{font:inherit}
button{cursor:pointer}

.app{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:18px;
}

/* =========================
   HEADER
========================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:16px;
}

h1{
  margin:0;
  font-size:28px;
  font-weight:950;
  letter-spacing:-.5px;
}

.subtitle{
  margin:4px 0 0;
  color:var(--muted);
  font-size:12px;
}

.add-cargo{
  flex:none;
  padding:11px 14px;
  border:0;
  border-radius:10px;
  background:var(--dark);
  color:#fff;
  font-size:10px;
  font-weight:950;
}

/* =========================
   SEARCH
========================= */

.search{
  width:100%;
  margin-bottom:15px;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
  background:#fff;
  color:var(--text);
  font-size:13px;
}

.search:focus{
  border-color:#8b949d;
}

/* =========================
   CARDS
========================= */

#cargoList{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.cargo-card{
  overflow:hidden;
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
}

.cargo-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  padding:16px 17px 14px;
}

.pier-label{
  margin-bottom:3px;
  color:#9299a1;
  font-size:9px;
  font-weight:950;
  letter-spacing:.7px;
}

.pier{
  margin-bottom:5px;
  color:#69727a;
  font-size:12px;
  font-weight:850;
}

.cargo-name{
  margin:0;
  font-size:20px;
  font-weight:950;
  line-height:1.2;
}

.actions{
  display:flex;
  gap:5px;
  flex:none;
}

.small-btn{
  border:0;
  border-radius:7px;
  padding:7px 9px;
  background:#edf0f2;
  color:#59616a;
  font-size:9px;
  font-weight:950;
}

.delete-btn{
  background:#fff0f0;
  color:#ad4a4a;
}

/* =========================
   SECTION
========================= */

.data-section{
  border-top:1px solid var(--line);
}

.section-label{
  padding:8px 14px;
  background:#f1f3f4;
  border-bottom:1px solid var(--line);
  color:#7e868e;
  font-size:9px;
  font-weight:950;
  letter-spacing:.6px;
}

/* =========================
   WORKING TABLE
========================= */

.work-header,
.work-row{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr;
}

.work-header{
  background:#fafafa;
  border-bottom:1px solid var(--line);
}

.work-header div{
  padding:7px 14px;
  color:#969da4;
  font-size:9px;
  font-weight:950;
}

.work-row{
  border-bottom:1px solid #edf0f2;
}

.work-row:last-child{
  border-bottom:0;
}

.work-row div{
  min-width:0;
  padding:10px 14px;
  font-size:13px;
  font-weight:800;
  line-height:1.3;
}

.work-row div + div{
  border-left:1px solid #edf0f2;
}

.rate{
  font-weight:950 !important;
}

/* =========================
   QTY / DAY
========================= */

.qty-header,
.qty-row{
  display:grid;
  grid-template-columns:1fr 1fr;
}

.qty-header{
  background:#fafafa;
  border-bottom:1px solid var(--line);
}

.qty-header div{
  padding:7px 14px;
  color:#969da4;
  font-size:9px;
  font-weight:950;
}

.qty-row{
  border-bottom:1px solid #edf0f2;
}

.qty-row:last-child{
  border-bottom:0;
}

.qty-row div{
  padding:9px 14px;
  font-size:13px;
  font-weight:800;
}

.qty-row div + div{
  border-left:1px solid #edf0f2;
}

/* =========================
   REMARK
========================= */

.remark{
  margin:13px;
  padding:12px 13px;
  background:var(--remark-bg);
  border:1px solid #efd693;
  border-left:5px solid var(--remark-border);
  border-radius:10px;
  color:var(--remark-text);
}

.remark-label{
  margin-bottom:5px;
  color:#9e6d00;
  font-size:9px;
  font-weight:950;
  letter-spacing:.5px;
}

.remark-text{
  font-size:12px;
  font-weight:750;
  line-height:1.5;
  white-space:pre-wrap;
}

.empty-value{
  color:#b2b7bc;
}

/* =========================
   EMPTY
========================= */

.empty{
  padding:35px 15px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  color:#9299a0;
  text-align:center;
  font-size:13px;
}

/* =========================
   MODAL
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
  background:rgba(18,23,28,.6);
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:700px;
  max-height:93vh;
  overflow-y:auto;
  padding:20px;
  background:#fff;
  border-radius:17px;
}

.modal h2{
  margin:0 0 18px;
  font-size:21px;
  font-weight:950;
}

.top-fields{
  display:grid;
  grid-template-columns:160px 1fr;
  gap:8px;
}

.field{
  display:block;
  margin-bottom:12px;
}

.field span{
  display:block;
  margin-bottom:5px;
  color:#747c84;
  font-size:9px;
  font-weight:950;
}

.field textarea{

  </script>

</body>
</html>
