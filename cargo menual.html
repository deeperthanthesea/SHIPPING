<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ulsan Cargo Reference</title>

<style>
:root {
  --bg: #f4f5f6;
  --card: #ffffff;
  --text: #20262e;
  --muted: #858d96;
  --line: #dfe3e6;
  --soft: #f2f4f5;
  --dark: #202730;

  --remark-bg: #fff6dc;
  --remark-border: #e5ad35;
  --remark-text: #5d480f;

  --radius: 15px;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  padding: 18px;
}

/* =====================================================
   HEADER
===================================================== */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 16px;
}

.title {
  margin: 0;
  font-size: 28px;
  font-weight: 950;
  letter-spacing: -0.6px;
}

.subtitle {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.add-cargo-btn {
  flex: 0 0 auto;
  padding: 11px 14px;
  border: 0;
  border-radius: 10px;
  background: var(--dark);
  color: #fff;
  font-size: 10px;
  font-weight: 950;
}

/* =====================================================
   SEARCH
===================================================== */

.search {
  width: 100%;
  margin-bottom: 15px;
  padding: 13px 14px;
  border: 1px solid var(--line);
  border-radius: 11px;
  outline: none;
  background: #fff;
  color: var(--text);
  font-size: 13px;
}

.search:focus {
  border-color: #8a949d;
}

/* =====================================================
   CARGO CARD
===================================================== */

#cargoList {
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.cargo-card {
  overflow: hidden;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.cargo-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 17px 14px;
}

.pier-label {
  margin-bottom: 3px;
  color: #9299a1;
  font-size: 9px;
  font-weight: 950;
  letter-spacing: 0.7px;
}

.pier {
  margin-bottom: 5px;
  color: #68717a;
  font-size: 12px;
  font-weight: 850;
}

.cargo-name {
  margin: 0;
  font-size: 20px;
  font-weight: 950;
  line-height: 1.2;
}

.actions {
  display: flex;
  gap: 5px;
  flex: 0 0 auto;
}

.small-btn {
  border: 0;
  border-radius: 7px;
  padding: 7px 9px;
  background: #edf0f2;
  color: #59616a;
  font-size: 9px;
  font-weight: 950;
}

.delete-btn {
  background: #fff0f0;
  color: #ad4a4a;
}

/* =====================================================
   DATA SECTIONS
===================================================== */

.data-section {
  border-top: 1px solid var(--line);
}

.section-label {
  padding: 8px 14px;
  background: #f1f3f4;
  border-bottom: 1px solid var(--line);
  color: #7e868e;
  font-size: 9px;
  font-weight: 950;
  letter-spacing: 0.6px;
}

/* WORKING */

.work-header,
.work-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr;
}

.work-header {
  background: #fafafa;
  border-bottom: 1px solid var(--line);
}

.work-header div {
  padding: 7px 14px;
  color: #969da4;
  font-size: 9px;
  font-weight: 950;
}

.work-row {
  border-bottom: 1px solid #edf0f2;
}

.work-row:last-child {
  border-bottom: 0;
}

.work-row div {
  min-width: 0;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 800;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.work-row div + div {
  border-left: 1px solid #edf0f2;
}

.rate-value {
  font-weight: 950 !important;
}

/* QTY / DAY */

.qty-header,
.qty-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.qty-header {
  background: #fafafa;
  border-bottom: 1px solid var(--line);
}

.qty-header div {
  padding: 7px 14px;
  color: #969da4;
  font-size: 9px;
  font-weight: 950;
}

.qty-row {
  border-bottom: 1px solid #edf0f2;
}

.qty-row:last-child {
  border-bottom: 0;
}

.qty-row div {
  padding: 9px 14px;
  font-size: 13px;
  font-weight: 800;
}

.qty-row div + div {
  border-left: 1px solid #edf0f2;
}

/* REMARK */

.remark {
  margin: 13px;
  padding: 12px 13px;
  background: var(--remark-bg);
  border: 1px solid #efd693;
  border-left: 5px solid var(--remark-border);
  border-radius: 10px;
  color: var(--remark-text);
}

.remark-label {
  margin-bottom: 5px;
  color: #9e6d00;
  font-size: 9px;
  font-weight: 950;
  letter-spacing: 0.5px;
}

.remark-text {
  font-size: 12px;
  font-weight: 750;
  line-height: 1.5;
  white-space: pre-wrap;
}

.empty-value {
  color: #b2b7bc;
}

.empty {
  padding: 35px 15px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 15px;
  color: #9299a0;
  text-align: center;
  font-size: 13px;
}

/* =====================================================
   MODAL
===================================================== */

.modal-bg {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: rgba(18, 23, 28, 0.6);
}

.modal-bg.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 700px;
  max-height: 93vh;
  overflow-y: auto;
  padding: 20px;
  background: #fff;
  border-radius: 17px;
}

.modal-title {
  margin: 0 0 18px;
  font-size: 21px;
  font-weight: 950;
}

.top-fields {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 8px;
}

.field {
  display: block;
  margin-bottom: 12px;
}

.field span {
  display: block;
  margin-bottom: 5px;
  color: #747c84;
  font-size: 9px;
  font-weight: 950;
  letter-spacing: 0.4px;
}

.field input,
.field textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #d8dde1;
  border-radius: 9px;
  outline: none;
  background: #fff;
  color: var(--text);
}

.field textarea {
  min-height: 100px;
  resize: vertical;
  line-height: 1.45;
}

.field input:focus,
.field textarea:focus {
  border-color: #75808a;
}

/* EDIT SECTIONS */

.editor-section {
  margin-top: 15px;
}

.editor-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 7px;
}

.editor-title {
  font-size: 11px;
  font-weight: 950;
}

.add-row-btn {
  border: 0;
  border-radius: 8px;
  padding: 8px 10px;
  background: #e9edef;
  color: #414950;
  font-size: 9px;
  font-weight: 950;
}

.editor-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

/* WORK EDIT ROW */

.work-edit-row {
  position: relative;
  display: grid;
  grid-template-columns: 1.3fr 1fr 1fr;
  gap: 6px;
  padding: 10px 36px 10px 10px;
  background: #f6f7f8;
  border: 1px solid #e1e5e7;
  border-radius: 10px;
}

/* QTY EDIT ROW */

.qty-edit-row {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 10px 36px 10px 10px;
  background: #f6f7f8;
  border: 1px solid #e1e5e7;
  border-radius: 10px;
}

.edit-field {
  min-width: 0;
}

.edit-field label {
  display: block;
  margin-bottom: 4px;
  color: #8b939a;
  font-size: 8px;
  font-weight: 950;
}

.edit-field input {
  width: 100%;
  min-width: 0;
  padding: 9px 7px;
  border: 1px solid #d7dce0;
  border-radius: 7px;
  background: #fff;
  font-size: 11px;
}

.remove-row {
  position: absolute;
  top: 50%;
  right: 8px;
  width: 22px;
  height: 22px;
  padding: 0;
  transform: translateY(-50%);
  border: 0;
  border-radius: 50%;
  background: #e2e5e7;
  color: #747c84;
  font-size: 13px;
  font-weight: 950;
}

/* MODAL BUTTONS */

.modal-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 19px;
}

.modal-buttons button {
  border: 0;
  border-radius: 10px;
  padding: 13px;
  font-size: 11px;
  font-weight: 950;
}

.cancel-btn {
  background: #eceff1;
  color: #596169;
}

.save-btn {
  background: var(--dark);
  color: #fff;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {
  .app {
    padding: 12px;
  }

  .title {
    font-size: 25px;
  }

  .subtitle {
    font-size: 11px;
  }

  .add-cargo-btn {
    padding: 10px 11px;
    font-size: 9px;
  }

  .cargo-head {
    padding: 14px 14px 12px;
  }

  .cargo-name {
    font-size: 18px;
  }

  .work-header div,
  .work-row div {
    padding-left: 11px;
    padding-right: 11px;
  }

  .qty-header div,
  .qty-row div {
    padding-left: 11px;
    padding-right: 11px;
  }

  .work-row div,
  .qty-row div {
    font-size: 12px;
  }

  .top-fields {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .modal {
    padding: 15px;
  }
}

@media (max-width: 370px) {
  .work-header div {
    font-size: 8px;
  }

  .work-row div {
    padding-left: 8px;
    padding-right: 8px;
    font-size: 11px;
  }

  .qty-row div {
    font-size: 11px;
  }
}
</style>
</head>

</div>

<div id="cargoModal" class="modal-bg">

        >
      </label>

    </div>


    <!-- TIME / GANG / RATE -->

    <div class="editor-section">

      <div class="editor-head">
        <div class="editor-title">
          TIME / GANG / RATE
        </div>

        <button
          id="addWorkRowBtn"
          class="add-row-btn"
          type="button"
        >
          + ADD ROW
        </button>
      </div>

      <div
        id="workEditor"
        class="editor-list"
      ></div>

    </div>


    <!-- QTY / DAY -->

    <div class="editor-section">

      <div class="editor-head">
        <div class="editor-title">
          QTY / DAY
        </div>

        <button
          id="addQtyRowBtn"
          class="add-row-btn"
          type="button"
        >
          + ADD ROW
        </button>
      </div>

      <div
        id="qtyEditor"
        class="editor-list"
      ></div>

    </div>


    <!-- REMARK -->

    <div class="editor-section">

      <label class="field">

        <span>CHECK REMARK</span>

        <textarea
          id="remarkInput"
          placeholder="Enter all remarks for this cargo..."
        ></textarea>

      </label>

    </div>


    <div class="modal-buttons">

      <button
        id="cancelBtn"
        class="cancel-btn"
        type="button"
      >
        CANCEL
      </button>

      <button
        id="saveBtn"
        class="save-btn"
        type="button"
      >
        SAVE
      </button>

    </div>

  </div>

</div>

/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
  "ulsan-cargo-page1-v3";


function cloneDefaultData() {
  return JSON.parse(
    JSON.stringify(DEFAULT_CARGO)
  );
}


function loadCargo() {
  try {
    const saved =
      localStorage.getItem(STORAGE_KEY);

    if (!saved) {
      return cloneDefaultData();
    }

    return JSON.parse(saved);

  } catch (error) {
    return cloneDefaultData();
  }
}


function saveCargo() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(cargoData)
  );
}


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function displayValue(value) {
  const text =
    String(value ?? "").trim();

  if (!text) {
    return `
      <span class="empty-value">—</span>
    `;
  }

  return escapeHTML(text);
}

const workEditor =

/* =====================================================
   RENDER
===================================================== */

function renderCargo() {

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    cargoData.filter(function(item) {

      if (!keyword) {
        return true;
      }

      const cargoText =
        String(item.name || "")
          .toLowerCase();

      const pierText =
        String(item.pier || "")
          .toLowerCase();

      const remarkText =
        String(item.remark || "")
          .toLowerCase();

      return (
        cargoText.includes(keyword) ||
        pierText.includes(keyword) ||
        remarkText.includes(keyword)
      );

    });


  if (!filtered.length) {
    cargoList.innerHTML = `
      <div class="empty">
        No cargo found.
      </div>
    `;
    return;
  }


  cargoList.innerHTML =
    filtered.map(function(item) {

      const working =
        Array.isArray(item.working)
          ? item.working
          : [];

      const quantities =
        Array.isArray(item.quantities)
          ? item.quantities
          : [];


      let workingHTML = "";

      if (working.length) {

        workingHTML =
          working.map(function(row) {

            return `
              <div class="work-row">

                <div>
                  ${displayValue(row.time)}
                </div>

                <div>
                  ${displayValue(row.gang)}
                </div>

                <div class="rate-value">
                  ${displayValue(row.rate)}
                </div>

              </div>
            `;

          }).join("");

      } else {

        workingHTML = `
          <div class="work-row">
            <div>—</div>
            <div>—</div>
            <div>—</div>
          </div>
        `;

      }


      let qtyHTML = "";

      if (quantities.length) {

        qtyHTML =
          quantities.map(function(row) {

            return `
              <div class="qty-row">

                <div>
                  ${displayValue(row.qty)}
                </div>

                <div>
                  ${displayValue(row.day)}
                </div>

              </div>
            `;

          }).join("");

      } else {

        qtyHTML = `
          <div class="qty-row">
            <div>—</div>
            <div>—</div>
          </div>
        `;

      }


      const remarkHTML =
        String(item.remark || "").trim()
          ? `
            <div class="remark">

              <div class="remark-label">
                CHECK REMARK
              </div>

              <div class="remark-text">${escapeHTML(item.remark)}</div>

            </div>
          `
          : "";


      return `
        <article class="cargo-card">

          <div class="cargo-head">

            <div>

              <div class="pier-label">
                PIER
              </div>

              <div class="pier">
                ${displayValue(item.pier)}
              </div>

              <h2 class="cargo-name">
                ${escapeHTML(item.name)}
              </h2>

            </div>


            <div class="actions">

              <button
                class="small-btn"
                type="button"
                onclick="editCargo(${item.id})"
              >
                EDIT
              </button>

              <button
                class="small-btn delete-btn"
                type="button"
                onclick="deleteCargo(${item.id})"
              >
                DELETE
              </button>

            </div>

          </div>


          <div class="data-section">

            <div class="section-label">
              WORKING RATE
            </div>

            <div class="work-header">
              <div>TIME</div>
              <div>GANG</div>
              <div>RATE</div>
            </div>

            ${workingHTML}

          </div>


          <div class="data-section">

            <div class="section-label">
              QUANTITY / WORKING DAYS
            </div>

            <div class="qty-header">
              <div>QTY</div>
              <div>DAY</div>
            </div>

            ${qtyHTML}

          </div>


          ${remarkHTML}

        </article>
      `;

    }).join("");
}


/* =====================================================
   WORK EDIT ROW
===================================================== */

function createWorkRow(data = {}) {

  const row =
    document.createElement("div");

  row.className =
    "work-edit-row";


  row.innerHTML = `

    <div class="edit-field">

      <label>TIME</label>

      <input
        class="edit-time"
        type="text"
        placeholder="0800-1700"
        value="${escapeHTML(data.time || "")}"
      >

    </div>


    <div class="edit-field">

      <label>GANG</label>

      <input
        class="edit-gang"
        type="text"
        placeholder="2 gang"
        value="${escapeHTML(data.gang || "")}"
      >

    </div>


    <div class="edit-field">

      <label>RATE</label>

      <input
        class="edit-rate"
        type="text"
        placeholder="1,800"
        value="${escapeHTML(data.rate || "")}"
      >

    </div>


    <button
      class="remove-row"
      type="button"
      title="Delete row"
    >
      ×
    </button>

  `;


  row
    .querySelector(".remove-row")
    .addEventListener(
      "click",
      function() {
        row.remove();
      }
    );


  return row;
}

/* =====================================================
   OPEN EDITOR
===================================================== */

function openModal(item) {

  workEditor.innerHTML = "";
  qtyEditor.innerHTML = "";


  if (item) {

    editingId = item.id;

    modalTitle.textContent =
      "EDIT CARGO";

    pierInput.value =
      item.pier || "";

    cargoInput.value =
      item.name || "";

    remarkInput.value =
      item.remark || "";


    const working =
      Array.isArray(item.working)
        ? item.working
        : [];

    const quantities =
      Array.isArray(item.quantities)
        ? item.quantities
        : [];


    if (working.length) {

      working.forEach(function(row) {
        workEditor.appendChild(
          createWorkRow(row)
        );
      });

    } else {

      workEditor.appendChild(
        createWorkRow()
      );

    }


    if (quantities.length) {

      quantities.forEach(function(row) {
        qtyEditor.appendChild(
          createQtyRow(row)
        );
      });

    } else {

      qtyEditor.appendChild(
        createQtyRow()
      );

    }

  } else {

    editingId = null;

    modalTitle.textContent =
      "ADD CARGO";

    pierInput.value = "";
    cargoInput.value = "";
    remarkInput.value = "";

    workEditor.appendChild(
      createWorkRow()
    );

    qtyEditor.appendChild(
      createQtyRow()
    );

  }


  modal.classList.add("show");
}


function closeModal() {
  modal.classList.remove("show");
}


/* =====================================================
   EDIT / DELETE
===================================================== */

window.editCargo =
  function(id) {

    const item =
      cargoData.find(function(cargo) {
        return cargo.id === id;
      });

    if (item) {
      openModal(item);
    }

  };


window.deleteCargo =
  function(id) {

    const item =
      cargoData.find(function(cargo) {
        return cargo.id === id;
      });


    if (!item) {
      return;
    }


    const confirmed =
      confirm(
        "Delete " +
        item.name +
        "?"
      );


    if (!confirmed) {
      return;
    }


    cargoData =
      cargoData.filter(function(cargo) {
        return cargo.id !== id;
      });


    saveCargo();
    renderCargo();

  };


/* =====================================================
   COLLECT EDITOR DATA
===================================================== */

function collectWorking() {

  return Array.from(
    workEditor
      .querySelectorAll(".work-edit-row")
  )
  .map(function(row) {

    return {
      time:
        row
          .querySelector(".edit-time")
          .value
          .trim(),

      gang:
        row
          .querySelector(".edit-gang")
          .value
          .trim(),

      rate:
        row
          .querySelector(".edit-rate")
          .value
          .trim()
    };

  })
  .filter(function(row) {

    return (
      row.time ||
      row.gang ||
      row.rate
    );

  });
}


function collectQuantities() {

  return Array.from(
    qtyEditor
      .querySelectorAll(".qty-edit-row")
  )
  .map(function(row) {

    return {
      qty:
        row
          .querySelector(".edit-qty")
          .value
          .trim(),

      day:
        row
          .querySelector(".edit-day")
          .value
          .trim()
    };

  })
  .filter(function(row) {

    return (
      row.qty ||
      row.day
    );

  });
}


/* =====================================================
   SAVE
===================================================== */

document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    function() {

      const cargoName =
        cargoInput.value.trim();


      if (!cargoName) {

        alert(
          "Please enter cargo name."
        );

        cargoInput.focus();

        return;
      }


      const newItem = {

        id:
          editingId !== null
            ? editingId
            : Date.now(),

        pier:
          pierInput.value.trim(),

        name:
          cargoName,

        working:
          collectWorking(),

        quantities:
          collectQuantities(),

        remark:
          remarkInput.value.trim()

      };


      if (editingId !== null) {

        cargoData =
          cargoData.map(function(item) {

            if (item.id === editingId) {
              return newItem;
            }

            return item;

          });

      } else {

        cargoData.push(newItem);

      }


      saveCargo();

      closeModal();

      renderCargo();

    }
  );
