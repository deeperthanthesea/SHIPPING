<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Ulsan Cargo Reference</title>

<style>
:root{
  --bg:#f4f5f6;
  --card:#ffffff;
  --text:#20262e;
  --muted:#858d96;
  --line:#dfe3e6;
  --soft:#f1f3f4;
  --dark:#202730;

  --remark-bg:#fff5d8;
  --remark-border:#e7ac2e;
  --remark-text:#644900;

  --radius:15px;
}

*{
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:850px;
  margin:0 auto;
  padding:18px;
}


/* =====================================================
   HEADER
===================================================== */

.page-title-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:15px;
  margin-bottom:17px;
}

.page-title{
  margin:0;

  font-size:28px;
  font-weight:900;
  letter-spacing:-0.5px;
}

.page-subtitle{
  margin:4px 0 0;

  color:var(--muted);

  font-size:12px;
}

.primary-btn{
  flex:0 0 auto;

  border:0;
  border-radius:10px;

  padding:11px 14px;

  background:var(--dark);
  color:#fff;

  font-size:10px;
  font-weight:900;
}


/* =====================================================
   SEARCH
===================================================== */

.search-input{
  display:block;

  width:100%;

  margin-bottom:15px;
  padding:13px 14px;

  border:1px solid #d4d9dd;
  border-radius:11px;

  outline:none;

  background:#fff;
  color:var(--text);

  font-size:13px;
}

.search-input:focus{
  border-color:#7d8791;
}


/* =====================================================
   CARGO LIST
===================================================== */

#cargoList{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.cargo-card{
  overflow:hidden;

  background:var(--card);

  border:1px solid var(--line);
  border-radius:var(--radius);
}


/* =====================================================
   CARGO HEADER
===================================================== */

.cargo-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:12px;

  padding:16px 17px 14px;
}

.pier-label{
  margin-bottom:3px;

  color:#9299a1;

  font-size:9px;
  font-weight:900;
  letter-spacing:0.7px;
}

.pier-value{
  margin-bottom:5px;

  color:#69727b;

  font-size:12px;
  font-weight:800;
}

.cargo-name{
  margin:0;

  color:var(--text);

  font-size:20px;
  font-weight:900;
  line-height:1.2;
}

.cargo-actions{
  display:flex;
  gap:5px;

  flex:0 0 auto;
}

.small-btn{
  border:0;
  border-radius:7px;

  padding:7px 9px;

  background:#edf0f2;
  color:#59616a;

  font-size:9px;
  font-weight:900;
}

.small-btn.delete{
  background:#fff0f0;
  color:#ad4a4a;
}


/* =====================================================
   SECTION
===================================================== */

.data-section{
  border-top:1px solid var(--line);
}

.section-title{
  padding:8px 14px;

  background:#f0f2f3;

  border-bottom:1px solid var(--line);

  color:#7d858d;

  font-size:9px;
  font-weight:900;
  letter-spacing:0.6px;
}


/* =====================================================
   TIME / GANG / RATE
===================================================== */

.work-head,
.work-row{
  display:grid;

  grid-template-columns:
    minmax(0,1.45fr)
    minmax(0,0.9fr)
    minmax(0,0.9fr);
}

.work-head{
  background:#fafafa;

  border-bottom:1px solid var(--line);
}

.work-head > div{
  padding:7px 14px;

  color:#969da4;

  font-size:9px;
  font-weight:900;
}

.work-row{
  border-bottom:1px solid #edf0f2;
}

.work-row:last-child{
  border-bottom:0;
}

.work-row > div{
  min-width:0;

  padding:10px 14px;

  color:#252c34;

  font-size:13px;
  font-weight:800;
  line-height:1.3;

  overflow-wrap:anywhere;
}

.work-row > div + div{
  border-left:1px solid #edf0f2;
}

.rate{
  font-weight:900 !important;
}


/* =====================================================
   QTY / DAY
===================================================== */

.qty-wrap{
  padding:11px 13px 13px;
}

.qty-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.qty-item{
  display:flex;
  align-items:center;

  min-width:0;

  overflow:hidden;

  background:#f7f8f9;

  border:1px solid #e2e5e8;
  border-radius:9px;
}

.qty-value,
.day-value{
  padding:8px 11px;

  white-space:nowrap;

  font-size:12px;
  font-weight:850;
}

.qty-value{
  color:#20262e;
}

.day-value{
  border-left:1px solid #dfe3e6;

  color:#6d757d;
}

.qty-mini-label{
  margin-right:4px;

  color:#a0a6ac;

  font-size:8px;
  font-weight:900;
}


/* =====================================================
   REMARK
===================================================== */

.remark{
  margin:0 13px 13px;
  padding:12px 13px;

  background:var(--remark-bg);

  border:1px solid #efd693;
  border-left:5px solid var(--remark-border);
  border-radius:10px;

  color:var(--remark-text);
}

.remark-label{
  display:block;

  margin-bottom:5px;

  color:#a66f00;

  font-size:9px;
  font-weight:950;
  letter-spacing:0.5px;
}

.remark-text{
  white-space:pre-wrap;

  font-size:12px;
  font-weight:750;
  line-height:1.5;
}

.empty-value{
  color:#b0b6bc;
}

.empty{
  padding:35px 15px;

  background:#fff;

  border:1px solid var(--line);
  border-radius:15px;

  color:#9299a0;

  text-align:center;
  font-size:13px;
}


/* =====================================================
   MODAL
===================================================== */

.modal-bg{
  position:fixed;
  inset:0;
  z-index:100;

  display:none;
  align-items:center;
  justify-content:center;

  padding:14px;

  background:rgba(18,23,28,0.6);
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:700px;
  max-height:93vh;

  overflow-y:auto;

  padding:20px;

  background:#fff;

  border-radius:17px;
}

.modal-title{
  margin:0 0 18px;

  font-size:21px;
  font-weight:900;
}

.top-fields{
  display:grid;
  grid-template-columns:160px 1fr;

  gap:8px;
}

.field{
  display:block;

  margin-bottom:12px;
}

.field > span{
  display:block;

  margin-bottom:5px;

  color:#747c84;

  font-size:9px;
  font-weight:900;
}

.field input,
.field textarea{
  display:block;

  width:100%;

  padding:11px;

  border:1px solid #d8dde1;
  border-radius:9px;

  outline:none;

  background:#fff;
  color:var(--text);
}

.field textarea{
  min-height:105px;

  resize:vertical;

  line-height:1.45;
}

.field input:focus,
.field textarea:focus{
  border-color:#75808a;
}


/* =====================================================
   EDITOR
===================================================== */

.editor-section{
  margin-top:15px;
}

.editor-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:7px;
}

.editor-title{
  font-size:11px;
  font-weight:900;
}

.add-row-btn{
  border:0;
  border-radius:8px;

  padding:8px 10px;

  background:#e9edef;
  color:#414950;

  font-size:9px;
  font-weight:900;
}

.editor-list{
  display:flex;
  flex-direction:column;

  gap:7px;
}

.work-edit-row{
  position:relative;

  display:grid;

  grid-template-columns:
    minmax(0,1.3fr)
    minmax(0,1fr)
    minmax(0,1fr);

  gap:6px;

  padding:10px 38px 10px 10px;

  background:#f6f7f8;

  border:1px solid #e1e5e7;
  border-radius:10px;
}

.qty-edit-row{
  position:relative;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:6px;

  padding:10px 38px 10px 10px;

  background:#f6f7f8;

  border:1px solid #e1e5e7;
  border-radius:10px;
}

.edit-field{
  min-width:0;
}

.edit-field label{
  display:block;

  margin-bottom:4px;

  color:#8b939a;

  font-size:8px;
  font-weight:900;
}

.edit-field input{
  display:block;

  width:100%;
  min-width:0;

  padding:9px 7px;

  border:1px solid #d7dce0;
  border-radius:7px;

  outline:none;

  background:#fff;

  font-size:11px;
}

.remove-row{
  position:absolute;

  top:50%;
  right:8px;

  width:22px;
  height:22px;

  padding:0;

  transform:translateY(-50%);

  border:0;
  border-radius:50%;

  background:#e2e5e7;
  color:#747c84;

  font-size:13px;
  font-weight:900;
}


/* =====================================================
   MODAL BUTTONS
===================================================== */

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-top:19px;
}

.modal-buttons button{
  border:0;
  border-radius:10px;

  padding:13px;

  font-size:11px;
  font-weight:900;
}

.cancel-btn{
  background:#eceff1;
  color:#596169;
}

.save-btn{
  background:var(--dark);
  color:#fff;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .app{
    padding:12px;
  }

  .page-title{
    font-size:25px;
  }

  .page-subtitle{
    font-size:11px;
  }

  .primary-btn{
    padding:10px 11px;

    font-size:9px;
  }

  .cargo-head{
    padding:14px 14px 12px;
  }

  .cargo-name{
    font-size:18px;
  }

  .work-head > div{
    padding:7px 10px;
  }

  .work-row > div{
    padding:10px 10px;

    font-size:12px;
  }

  .qty-wrap{
    padding:10px 11px 12px;
  }

  .qty-value,
  .day-value{
    padding:7px 9px;

    font-size:11px;
  }

  .remark{
    margin:0 11px 11px;
  }

  .top-fields{
    grid-template-columns:1fr;

    gap:0;
  }

  .modal{
    padding:15px;
  }

  .work-edit-row{
    grid-template-columns:1fr 1fr;
  }

  .work-edit-row .edit-field:last-of-type{
    grid-column:1/-1;
  }

}

@media(max-width:370px){

  .work-head > div{
    padding-left:7px;
    padding-right:7px;

    font-size:8px;
  }

  .work-row > div{
    padding-left:7px;
    padding-right:7px;

    font-size:11px;
  }

}
</style>
</head>

      </div>

    </div>

    <div class="editor-section">

        <textarea
          id="remarkInput"
          placeholder="Additional + Remark 내용을 여기에 입력"
        ></textarea>

      </label>

    </div>


    <div class="modal-buttons">

      <button
        id="cancelBtn"

        type="button"
      >
        CANCEL
      </button>

      <button
        id="saveBtn"
        class="save-btn"
        type="button"
      >
        SAVE
      </button>

    </div>

  </div>

</div>

/* =====================================================
   STORAGE
===================================================== */

/*
  기존 잘못된 버전의 localStorage와 충돌하지 않도록
  완전히 새로운 KEY를 사용한다.
*/

const STORAGE_KEY =
  "ulsan-cargo-manual-final-20260928-v3";


function cloneDefaultCargo(){

  return JSON.parse(
    JSON.stringify(DEFAULT_CARGO)
  );

}


function loadCargo(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(!saved){

      return cloneDefaultCargo();

    }


    const parsed =
      JSON.parse(saved);


    if(
      !Array.isArray(parsed) ||
      parsed.length === 0
    ){

      return cloneDefaultCargo();

    }


    return parsed;

  }
  catch(error){

    console.error(
      "Cargo storage load error:",
      error
    );

    return cloneDefaultCargo();

  }

}


function saveCargo(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(cargoData)
    );

  }
  catch(error){

    console.error(
      "Cargo storage save error:",
      error
    );

  }

}


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function showValue(value){

  const text =
    String(value ?? "").trim();


  if(!text){

    return `
      <span class="empty-value">
        —
      </span>
    `;

  }


  return escapeHTML(text);

}

/* =====================================================
   RENDER CARGO
===================================================== */

function renderCargo(){

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    cargoData.filter(
      function(item){

        if(!keyword){
          return true;
        }


        const workingText =
          Array.isArray(item.working)
            ?
            item.working
              .map(function(row){

                return [
                  row.time,
                  row.gang,
                  row.rate
                ].join(" ");

              })
              .join(" ")
            :
            "";


        const quantityText =
          Array.isArray(item.quantities)
            ?
            item.quantities
              .map(function(row){

                return [
                  row.qty,
                  row.day
                ].join(" ");

              })
              .join(" ")
            :
            "";


        const searchable =
          [
            item.name,
            item.pier,
            item.remark,
            workingText,
            quantityText
          ]
          .join(" ")
          .toLowerCase();


        return searchable.includes(
          keyword
        );

      }
    );


  if(!filtered.length){

    cargoList.innerHTML = `
      <div class="empty">
        No cargo found.
      </div>
    `;

    return;

  }


  cargoList.innerHTML =
    filtered
      .map(
        function(item){

          const working =
            Array.isArray(item.working)
              ? item.working
              : [];


          const quantities =
            Array.isArray(item.quantities)
              ? item.quantities
              : [];


          let workHTML = "";


          if(working.length){

            workHTML =
              working
                .map(
                  function(row){

                    return `
                      <div class="work-row">

                        <div>
                          ${showValue(row.time)}
                        </div>

                        <div>
                          ${showValue(row.gang)}
                        </div>

                        <div class="rate">
                          ${showValue(row.rate)}
                        </div>

                      </div>
                    `;

                  }
                )
                .join("");

          }
          else{

            workHTML = `
              <div class="work-row">

                <div>
                  <span class="empty-value">
                    —
                  </span>
                </div>

                <div>
                  <span class="empty-value">
                    —
                  </span>
                </div>

                <div>
                  <span class="empty-value">
                    —
                  </span>
                </div>

              </div>
            `;

          }


          let qtyHTML = "";


          if(quantities.length){

            qtyHTML =
              quantities
                .map(
                  function(row){

                    return `
                      <div class="qty-item">

                        <div class="qty-value">

                          <span class="qty-mini-label">
                            QTY
                          </span>

                          ${showValue(row.qty)}

                        </div>


                        <div class="day-value">

                          <span class="qty-mini-label">
                            DAY
                          </span>

                          ${showValue(row.day)}

                        </div>

                      </div>
                    `;

                  }
                )
                .join("");

          }
          else{

            qtyHTML = `
              <div class="qty-item">

                <div class="qty-value">

                  <span class="qty-mini-label">
                    QTY
                  </span>

                  <span class="empty-value">
                    —
                  </span>

                </div>


                <div class="day-value">

                  <span class="qty-mini-label">
                    DAY
                  </span>

                  <span class="empty-value">
                    —
                  </span>

                </div>

              </div>
            `;

          }


          const remark =
            String(
              item.remark ?? ""
            ).trim();


          const remarkHTML =
            remark
              ?
              `
                <div class="remark">

                  <span class="remark-label">
                    CHECK REMARK
                  </span>

                  <div class="remark-text">${escapeHTML(remark)}</div>

                </div>
              `
              :
              "";


          return `
            <article class="cargo-card">

              <div class="cargo-head">

                <div>

                  <div class="pier-label">
                    PIER
                  </div>

                  <div class="pier-value">
                    ${showValue(item.pier)}
                  </div>

                  <h2 class="cargo-name">
                    ${escapeHTML(item.name)}
                  </h2>

                </div>


                <div class="cargo-actions">

                  <button
                    class="small-btn"
                    type="button"
                    onclick="editCargo(${item.id})"
                  >
                    EDIT
                  </button>


                  <button
                    class="small-btn delete"
                    type="button"
                    onclick="deleteCargo(${item.id})"
                  >
                    DELETE
                  </button>

                </div>

              </div>


              <div class="data-section">

                <div class="section-title">
                  WORKING RATE
                </div>


                <div class="work-head">

                  <div>
                    TIME
                  </div>

                  <div>
                    GANG
                  </div>

                  <div>
                    RATE
                  </div>

                </div>


                ${workHTML}

              </div>


              <div class="data-section">

                <div class="section-title">
                  QUANTITY / WORKING DAYS
                </div>


                <div class="qty-wrap">

                  <div class="qty-list">
                    ${qtyHTML}
                  </div>

                </div>

              </div>


              ${remarkHTML}

            </article>
          `;

        }
      )
      .join("");

}


/* =====================================================
   CREATE WORK EDITOR ROW
===================================================== */

function createWorkRow(data = {}){

  const row =
    document.createElement(
      "div"
    );


  row.className =
    "work-edit-row";


  row.innerHTML = `

    <div class="edit-field">

      <label>
        TIME
      </label>

      <input
        class="edit-time"
        type="text"
        placeholder="0800-1700"
        value="${escapeHTML(data.time || "")}"
      >

    </div>


    <div class="edit-field">

      <label>
        GANG
      </label>

      <input
        class="edit-gang"
        type="text"
        placeholder="2 gang"
        value="${escapeHTML(data.gang || "")}"
      >

    </div>


    <div class="edit-field">

      <label>
        RATE
      </label>

      <input
        class="edit-rate"
        type="text"
        placeholder="1,800"
        value="${escapeHTML(data.rate || "")}"
      >

    </div>


    <button
      class="remove-row"
      type="button"
      title="Delete row"
    >
      ×
    </button>

  `;


  row
    .querySelector(
      ".remove-row"
    )
    .addEventListener(
      "click",
      function(){

        row.remove();

      }
    );


  return row;

}

/* =====================================================
   OPEN MODAL
===================================================== */

function openCargoModal(item){

  workEditor.innerHTML = "";
  qtyEditor.innerHTML = "";


  if(item){

    editingCargoId =
      item.id;


    modalTitle.textContent =
      "EDIT CARGO";


    pierInput.value =
      item.pier || "";


    cargoInput.value =
      item.name || "";


    remarkInput.value =
      item.remark || "";


    const working =
      Array.isArray(item.working)
        ? item.working
        : [];


    const quantities =
      Array.isArray(item.quantities)
        ? item.quantities
        : [];


    if(working.length){

      working.forEach(
        function(row){

          workEditor.appendChild(
            createWorkRow(row)
          );

        }
      );

    }
    else{

      workEditor.appendChild(
        createWorkRow()
      );

    }


    if(quantities.length){

      quantities.forEach(
        function(row){

          qtyEditor.appendChild(
            createQtyRow(row)
          );

        }
      );

    }
    else{

      qtyEditor.appendChild(
        createQtyRow()
      );

    }

  }
  else{

    editingCargoId =
      null;


    modalTitle.textContent =
      "ADD CARGO";


    pierInput.value = "";
    cargoInput.value = "";
    remarkInput.value = "";


    workEditor.appendChild(
      createWorkRow()
    );


    qtyEditor.appendChild(
      createQtyRow()
    );

  }


  cargoModal.classList.add(
    "show"
  );


  setTimeout(
    function(){

      cargoInput.focus();

    },
    50
  );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeCargoModal(){

  cargoModal.classList.remove(
    "show"
  );

}


/* =====================================================
   EDIT CARGO
===================================================== */

window.editCargo =
  function(id){

    const item =
      cargoData.find(
        function(cargo){

          return cargo.id === id;

        }
      );


    if(item){

      openCargoModal(item);

    }

  };


/* =====================================================
   DELETE CARGO
===================================================== */

window.deleteCargo =
  function(id){

    const item =
      cargoData.find(
        function(cargo){

          return cargo.id === id;

        }
      );


    if(!item){

      return;

    }


    const confirmed =
      confirm(
        "Delete " +
        item.name +
        "?"
      );


    if(!confirmed){

      return;

    }


    cargoData =
      cargoData.filter(
        function(cargo){

          return cargo.id !== id;

        }
      );


    saveCargo();

    renderCargo();

  };


/* =====================================================
   COLLECT WORK DATA
===================================================== */

function collectWorking(){

  return Array
    .from(
      workEditor.querySelectorAll(
        ".work-edit-row"
      )
    )
    .map(
      function(row){

        return {

          time:
            row
              .querySelector(
                ".edit-time"
              )
              .value
              .trim(),

          gang:
            row
              .querySelector(
                ".edit-gang"
              )
              .value
              .trim(),

          rate:
            row
              .querySelector(
                ".edit-rate"
              )
              .value
              .trim()

        };

      }
    )
    .filter(
      function(row){

        return (
          row.time ||
          row.gang ||
          row.rate
        );

      }
    );

}


/* =====================================================
   COLLECT QTY DATA
===================================================== */

function collectQuantities(){

  return Array
    .from(
      qtyEditor.querySelectorAll(
        ".qty-edit-row"
      )
    )
    .map(
      function(row){

        return {

          qty:
            row
              .querySelector(
                ".edit-qty"
              )
              .value
              .trim(),

          day:
            row
              .querySelector(
                ".edit-day"
              )
              .value
              .trim()

        };

      }
    )
    .filter(
      function(row){

        return (
          row.qty ||
          row.day
        );

      }
    );

}


/* =====================================================
   SAVE CARGO
===================================================== */

document
  .getElementById(
    "saveBtn"
  )
  .addEventListener(
    "click",
    function(){

      const cargoName =
        cargoInput.value.trim();


      if(!cargoName){

        alert(
          "Please enter cargo name."
        );

        cargoInput.focus();

        return;

      }


      const newItem = {

        id:
          editingCargoId !== null
            ? editingCargoId
            : Date.now(),

        pier:
          pierInput.value.trim(),

        name:
          cargoName,

        working:
          collectWorking(),

        quantities:
          collectQuantities(),

        remark:
          remarkInput.value.trim()

      };


      if(
        editingCargoId !== null
      ){

        cargoData =
          cargoData.map(
            function(item){

              if(
                item.id ===
                editingCargoId
              ){

                return newItem;

              }


              return item;

            }
          );

      }
      else{

        cargoData.push(
          newItem
        );

      }


      saveCargo();

      closeCargoModal();

      renderCargo();

    }
  );


/* =====================================================
   ADD CARGO
===================================================== */

document
  .getElementById(
    "addCargoBtn"
  )
  .addEventListener(
    "click",
    function(){

      openCargoModal(null);

    }
  );


/* =====================================================
   ADD WORK ROW
===================================================== */

document
  .getElementById(
    "addWorkRowBtn"
  )
  .addEventListener(
    "click",
    function(){

      workEditor.appendChild(
        createWorkRow()
      );

    }
  );


/* =====================================================
   ADD QTY ROW
===================================================== */

document
  .getElementById(
    "addQtyRowBtn"
  )
  .addEventListener(
    "click",
    function(){

      qtyEditor.appendChild(
        createQtyRow()
      );

    }
  );


/* =====================================================
   CANCEL
===================================================== */

document
  .getElementById(
    "cancelBtn"
  )
  .addEventListener(
    "click",
    closeCargoModal
  );


/* =====================================================
   CLICK OUTSIDE MODAL
===================================================== */

cargoModal.addEventListener(
  "click",
  function(event){

    if(
      event.target ===
      cargoModal
    ){

      closeCargoModal();

    }

  }
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
  "input",
  renderCargo
);


/* =====================================================
   INITIAL RENDER
===================================================== */

renderCargo();

</script>

</body>
</html>
