<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Ulsan Cargo Manual</title>

  <style>
    :root {
      --bg: #f4f5f6;
      --card: #ffffff;
      --text: #20262e;
      --muted: #858d96;
      --line: #dfe3e6;
      --soft: #eef0f2;
      --dark: #202730;

      --remark-bg: #fff5d8;
      --remark-border: #e7ac2e;
      --remark-text: #644900;

      --green: #218739;
      --red: #b54747;

      --radius: 15px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 900px;

      margin: 0 auto;
      padding: 22px 18px 50px;
    }

    /* =========================
       HEADER
       ========================= */

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 18px;
    }

    .page-title {
      margin: 0;

      font-size: 30px;
      font-weight: 950;
      letter-spacing: -0.7px;
    }

    .page-subtitle {
      margin: 5px 0 0;

      color: var(--muted);

      font-size: 12px;
      font-weight: 600;
    }

    .add-btn {
      flex: 0 0 auto;

      border: 0;
      border-radius: 11px;

      padding: 12px 15px;

      background: var(--dark);
      color: #fff;

      font-size: 11px;
      font-weight: 950;
    }

    /* =========================
       STATUS
       ========================= */

    .status {
      display: none;

      margin-bottom: 12px;
      padding: 11px 13px;

      border-radius: 9px;

      font-size: 12px;
      font-weight: 800;
      line-height: 1.4;
    }

    .status.show {
      display: block;
    }

    .status.loading {
      background: #eef3f7;
      color: #53606b;
    }

    .status.success {
      background: #e9f6ec;
      color: #28723a;
    }

    .status.error {
      background: #fff0f0;
      color: #a13f3f;
    }

    /* =========================
       SEARCH
       ========================= */

    .search-wrap {
      margin-bottom: 18px;
    }

    .search {
      width: 100%;

      padding: 14px 15px;

      border: 1px solid #ccd2d7;
      border-radius: 11px;

      outline: none;

      background: #fff;
      color: var(--text);

      font-size: 14px;
    }

    .search:focus {
      border-color: #7f8993;
    }

    /* =========================
       CARGO LIST
       ========================= */

    #cargoList {
      display: flex;
      flex-direction: column;

      gap: 14px;
    }

    .cargo-card {
      overflow: hidden;

      background: var(--card);

      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .cargo-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 15px;

      padding: 17px 18px 14px;
    }

    .cargo-main {
      min-width: 0;
    }

    .pier-label {
      margin-bottom: 5px;

      color: #90979f;

      font-size: 10px;
      font-weight: 950;
      letter-spacing: 0.7px;
    }

    .cargo-name {
      margin: 0;

      color: var(--text);

      font-size: 20px;
      font-weight: 950;
      line-height: 1.25;

      overflow-wrap: anywhere;
    }

    .cargo-actions {
      display: flex;
      flex: 0 0 auto;

      gap: 5px;
    }

    .small-btn {
      border: 0;
      border-radius: 7px;

      padding: 7px 9px;

      background: #edf0f2;
      color: #59616a;

      font-size: 9px;
      font-weight: 950;
    }

    .small-btn.delete {
      background: #fff0f0;
      color: var(--red);
    }

    /* =========================
       WORKING TABLE
       ========================= */

    .work-section {
      border-top: 1px solid var(--line);
    }

    .section-label {
      padding: 11px 16px 8px;

      color: #8a929a;

      font-size: 10px;
      font-weight: 950;
      letter-spacing: 0.7px;
    }

    .work-table {
      width: 100%;

      border-collapse: collapse;
      table-layout: fixed;
    }

    .work-table th {
      padding: 8px 10px;

      background: #f5f6f7;
      color: #8c949c;

      border-top: 1px solid #e6e9eb;
      border-bottom: 1px solid #e6e9eb;

      font-size: 9px;
      font-weight: 950;

      text-align: center;
    }

    .work-table td {
      padding: 11px 10px;

      color: #252c34;

      border-bottom: 1px solid #edf0f2;

      font-size: 13px;
      font-weight: 800;

      text-align: center;

      overflow-wrap: anywhere;
    }

    .work-table tr:last-child td {
      border-bottom: 0;
    }

    .empty-work {
      padding: 13px 16px 15px;

      color: #9aa1a8;

      font-size: 12px;
    }

    /* =========================
       QTY / DAY
       ========================= */

    .quantity-section {
      padding: 13px 16px 15px;

      border-top: 1px solid var(--line);

      background: #fafafa;
    }

    .quantity-title {
      margin-bottom: 9px;

      color: #8a929a;

      font-size: 10px;
      font-weight: 950;
      letter-spacing: 0.7px;
    }

    .quantity-list {
      display: flex;
      flex-wrap: wrap;

      gap: 7px;
    }

    .quantity-item {
      display: inline-flex;
      align-items: center;

      gap: 6px;

      padding: 8px 10px;

      background: #fff;

      border: 1px solid #dfe3e6;
      border-radius: 8px;

      color: #30373f;

      font-size: 12px;
      font-weight: 850;
    }

    .quantity-item strong {
      color: #111820;

      font-size: 13px;
      font-weight: 950;
    }

    .qty-divider {
      color: #b0b5ba;
    }

    .empty-quantity {
      color: #a0a6ac;

      font-size: 12px;
    }

    /* =========================
       REMARK
       ========================= */

    .remark {
      margin: 0 14px 14px;
      padding: 13px 14px;

      background: var(--remark-bg);

      border: 1px solid #efd58c;
      border-left: 5px solid var(--remark-border);
      border-radius: 10px;

      color: var(--remark-text);
    }

    .remark-label {
      display: block;

      margin-bottom: 6px;

      color: #a66f00;

      font-size: 9px;
      font-weight: 950;
      letter-spacing: 0.7px;
    }

    .remark-text {
      font-size: 12px;
      font-weight: 750;
      line-height: 1.55;

      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    /* =========================
       EMPTY
       ========================= */

    .empty {
      padding: 40px 15px;

      background: #fff;

      border: 1px solid var(--line);
      border-radius: var(--radius);

      color: var(--muted);

      text-align: center;

      font-size: 13px;
    }

    /* =========================
       MODAL
       ========================= */

    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 18px;

      background: rgba(19, 24, 29, 0.58);
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 600px;
      max-height: 92vh;

      overflow-y: auto;

      padding: 20px;

      background: #fff;

      border-radius: 17px;
    }

    .modal-title {
      margin: 0 0 18px;

      font-size: 21px;
      font-weight: 950;
    }

    .field {
      display: block;

      margin-bottom: 13px;
    }

    .field-label {
      display: block;

      margin-bottom: 6px;

      color: #747c84;

      font-size: 10px;
      font-weight: 950;
    }

    .field input,
    .field textarea {
      display: block;

      width: 100%;

      padding: 12px;

      border: 1px solid #d8dde1;
      border-radius: 9px;

      outline: none;

      background: #fff;
      color: var(--text);
    }

    .field textarea {
      min-height: 105px;

      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #77818b;
    }

    /* =========================
       EDITOR GROUPS
       ========================= */

    .editor-section {
      margin-top: 18px;
      margin-bottom: 17px;

      padding-top: 16px;

      border-top: 1px solid #e4e7e9;
    }

    .editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 10px;
    }

    .editor-title {
      color: #4e565e;

      font-size: 11px;
      font-weight: 950;
      letter-spacing: 0.5px;
    }

    .add-row-btn {
      border: 0;
      border-radius: 7px;

      padding: 7px 9px;

      background: #edf0f2;
      color: #4e5861;

      font-size: 9px;
      font-weight: 950;
    }

    .editor-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr auto;

      gap: 6px;

      margin-bottom: 7px;
    }

    .editor-row.qty-row {
      grid-template-columns: 1fr 1fr auto;
    }

    .editor-row input {
      min-width: 0;

      width: 100%;

      padding: 10px 8px;

      border: 1px solid #d8dde1;
      border-radius: 8px;

      outline: none;

      font-size: 12px;
    }

    .editor-row input:focus {
      border-color: #77818b;
    }

    .remove-row {
      width: 34px;

      border: 0;
      border-radius: 7px;

      background: #fff0f0;
      color: #ad4a4a;

      font-size: 15px;
      font-weight: 950;
    }

    /* =========================
       MODAL BUTTONS
       ========================= */

    .modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-top: 20px;
    }

    .modal-buttons button {
      border: 0;
      border-radius: 10px;

      padding: 13px;

      font-size: 11px;
      font-weight: 950;
    }

    .cancel-btn {
      background: #eceff1;
      color: #596169;
    }

    .save-btn {
      background: var(--dark);
      color: #fff;
    }

    .save-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .app {
        padding: 17px 11px 40px;
      }

      .page-head {
        align-items: center;
      }

      .page-title {
        font-size: 25px;
      }

      .page-subtitle {
        font-size: 11px;
      }

      .add-btn {
        padding: 11px 12px;

        font-size: 9px;
      }

      .cargo-head {
        padding: 15px 14px 12px;
      }

      .cargo-name {
        font-size: 18px;
      }

      .small-btn {
        padding: 6px 7px;

        font-size: 8px;
      }

      .section-label {
        padding-left: 12px;
      }

      .work-table th {
        padding: 7px 4px;

        font-size: 8px;
      }

      .work-table td {
        padding: 10px 4px;

        font-size: 11px;
      }

      .quantity-section {
        padding: 12px;
      }

      .quantity-item {
        padding: 7px 8px;

        font-size: 10px;
      }

      .quantity-item strong {
        font-size: 11px;
      }

      .remark {
        margin: 0 10px 10px;
        padding: 11px 12px;
      }

      .remark-text {
        font-size: 11px;
      }

      .modal {
        padding: 17px 14px;
      }

      .editor-row {
        grid-template-columns: 1.25fr 0.9fr 0.9fr 32px;

        gap: 4px;
      }

      .editor-row.qty-row {
        grid-template-columns: 1fr 1fr 32px;
      }

      .editor-row input {
        padding: 9px 5px;

        font-size: 10px;
      }

      .remove-row {
        width: 32px;
      }
    }

    @media (max-width: 370px) {

      .cargo-name {
        font-size: 16px;
      }

      .work-table td {
        font-size: 10px;
      }

      .editor-row input {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="page-head">

    <div>
      <h1 class="page-title">
        Cargo
      </h1>

      <p class="page-subtitle">
        Ulsan cargo working reference
      </p>
    </div>

    <button
      id="addCargoBtn"
      class="add-btn"
      type="button"
    >
      + ADD CARGO
    </button>

  </header>


  <div
    id="status"
    class="status"
  ></div>


  <div class="search-wrap">

    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="Search cargo or pier..."
      autocomplete="off"
    >

  </div>


  <main id="cargoList">

    <div class="empty">
      Loading cargo data...
    </div>

  </main>

</div>


<!-- ==========================================
     CARGO EDITOR
     ========================================== -->

<div
  id="cargoModal"
  class="modal-bg"
>

  <div class="modal">

    <h2
      id="modalTitle"
      class="modal-title"
    >
      ADD CARGO
    </h2>


    <label class="field">

      <span class="field-label">
        CARGO NAME
      </span>

      <input
        id="cargoNameInput"
        type="text"
        placeholder="e.g. BENTONITE"
      >

    </label>


    <label class="field">

      <span class="field-label">
        PIER
      </span>

      <input
        id="cargoPierInput"
        type="text"
        placeholder="e.g. 12-22"
      >

    </label>


    <!-- WORKING -->

    <div class="editor-section">

      <div class="editor-head">

        <div class="editor-title">
          TIME / GANG / RATE
        </div>

        <button
          id="addWorkingBtn"
          class="add-row-btn"
          type="button"
        >
          + ADD ROW
        </button>

      </div>

      <div id="workingEditor"></div>

    </div>


    <!-- QTY / DAY -->

    <div class="editor-section">

      <div class="editor-head">

        <div class="editor-title">
          QTY / DAY
        </div>

        <button
          id="addQuantityBtn"
          class="add-row-btn"
          type="button"
        >
          + ADD ROW
        </button>

      </div>

      <div id="quantityEditor"></div>

    </div>


    <!-- REMARK -->

    <label class="field">

      <span class="field-label">
        REMARK
      </span>

      <textarea
        id="cargoRemarkInput"
        placeholder="Additional / remark..."
      ></textarea>

    </label>


    <div class="modal-buttons">

      <button
        id="cancelCargoBtn"
        class="cancel-btn"
        type="button"
      >
        CANCEL
      </button>

      <button
        id="saveCargoBtn"
        class="save-btn"
        type="button"
      >
        SAVE
      </button>

    </div>

  </div>

</div>


<script>
  /* ==========================================
     API
     ========================================== */

  const API_URL =
    "https://cargo-api.makedpdaquickly.workers.dev/api/cargo";


  /* ==========================================
     STATE
     ========================================== */

  let cargoData = [];

  let editingCargoId = null;

  let workingDraft = [];

  let quantityDraft = [];


  /* ==========================================
     ELEMENTS
     ========================================== */

  const cargoList =
    document.getElementById("cargoList");

  const searchInput =
    document.getElementById("searchInput");

  const statusElement =
    document.getElementById("status");

  const cargoModal =
    document.getElementById("cargoModal");

  const modalTitle =
    document.getElementById("modalTitle");

  const nameInput =
    document.getElementById("cargoNameInput");

  const pierInput =
    document.getElementById("cargoPierInput");

  const remarkInput =
    document.getElementById("cargoRemarkInput");

  const workingEditor =
    document.getElementById("workingEditor");

  const quantityEditor =
    document.getElementById("quantityEditor");

  const saveCargoBtn =
    document.getElementById("saveCargoBtn");


  /* ==========================================
     HELPERS
     ========================================== */

  function escapeHTML(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function cloneData(value) {

    return JSON.parse(
      JSON.stringify(value)
    );
  }


  function showStatus(
    message,
    type = "loading"
  ) {

    statusElement.textContent =
      message;

    statusElement.className =
      "status show " + type;
  }


  function hideStatus() {

    statusElement.className =
      "status";

    statusElement.textContent =
      "";
  }


  function nextId() {

    if (!cargoData.length) {
      return 1;
    }

    return (
      Math.max(
        ...cargoData.map(function(item) {
          return Number(item.id) || 0;
        })
      ) + 1
    );
  }


  /* ==========================================
     LOAD FROM GITHUB
     ========================================== */

  async function loadCargo() {

    showStatus(
      "Loading cargo data...",
      "loading"
    );

    try {

      const response =
        await fetch(
          API_URL + "?t=" + Date.now(),
          {
            method: "GET",
            cache: "no-store"
          }
        );


      const result =
        await response.json();


      if (
        !response.ok ||
        !result.ok ||
        !Array.isArray(result.data)
      ) {

        throw new Error(
          result.error ||
          "Cargo data could not be loaded."
        );
      }


      cargoData =
        result.data;


      renderCargo();

      hideStatus();


    } catch (error) {

      console.error(error);

      showStatus(
        "Failed to load cargo data. " +
        error.message,
        "error"
      );


      cargoList.innerHTML = `
        <div class="empty">
          Cargo data could not be loaded.
        </div>
      `;
    }
  }


  /* ==========================================
     SAVE TO GITHUB
     ========================================== */

  async function saveAllCargo() {

    showStatus(
      "Saving to GitHub...",
      "loading"
    );


    const response =
      await fetch(
        API_URL,
        {
          method: "PUT",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              data: cargoData
            })
        }
      );


    let result;


    try {

      result =
        await response.json();

    } catch {

      throw new Error(
        "Invalid response from server."
      );
    }


    if (
      !response.ok ||
      !result.ok
    ) {

      throw new Error(
        result.error ||
        "GitHub save failed."
      );
    }


    showStatus(
      "Saved to GitHub.",
      "success"
    );


    setTimeout(
      function() {

        if (
          statusElement.classList
            .contains("success")
        ) {
          hideStatus();
        }

      },
      2200
    );


    return result;
  }


  /* ==========================================
     RENDER CARGO
     ========================================== */

  function renderCargo() {

    const keyword =
      searchInput.value
        .trim()
        .toLowerCase();


    const filtered =
      cargoData.filter(
        function(item) {

          if (!keyword) {
            return true;
          }


          const text = [
            item.name,
            item.pier,
            item.remark
          ]
            .join(" ")
            .toLowerCase();


          return text.includes(keyword);
        }
      );


    if (!filtered.length) {

      cargoList.innerHTML = `
        <div class="empty">
          No cargo found.
        </div>
      `;

      return;
    }


    cargoList.innerHTML =
      filtered.map(
        function(item) {

          return renderCargoCard(item);

        }
      ).join("");
  }


  function renderCargoCard(item) {

    const working =
      Array.isArray(item.working)
        ? item.working
        : [];


    const quantities =
      Array.isArray(item.quantities)
        ? item.quantities
        : [];


    let workingHTML;


    if (working.length) {

      workingHTML = `
        <table class="work-table">

          <thead>
            <tr>
              <th>TIME</th>
              <th>GANG</th>
              <th>RATE</th>
            </tr>
          </thead>

          <tbody>

            ${
              working.map(
                function(row) {

                  return `
                    <tr>

                      <td>
                        ${escapeHTML(
                          row.time || "—"
                        )}
                      </td>

                      <td>
                        ${escapeHTML(
                          row.gang || "—"
                        )}
                      </td>

                      <td>
                        ${escapeHTML(
                          row.rate || "—"
                        )}
                      </td>

                    </tr>
                  `;

                }
              ).join("")
            }

          </tbody>

        </table>
      `;

    } else {

      workingHTML = `
        <div class="empty-work">
          No working reference
        </div>
      `;
    }


    let quantityHTML;


    if (quantities.length) {

      quantityHTML = `
        <div class="quantity-list">

          ${
            quantities.map(
              function(row) {

                return `
                  <div class="quantity-item">

                    <strong>
                      ${escapeHTML(
                        row.qty || "—"
                      )}
                    </strong>

                    <span class="qty-divider">
                      /
                    </span>

                    <span>
                      ${escapeHTML(
                        row.day || "—"
                      )}
                    </span>

                  </div>
                `;

              }
            ).join("")
          }

        </div>
      `;

    } else {

      quantityHTML = `
        <div class="empty-quantity">
          No QTY / DAY reference
        </div>
      `;
    }


    const remarkHTML =
      item.remark
        ? `
          <div class="remark">

            <span class="remark-label">
              REMARK
            </span>

            <div class="remark-text">${escapeHTML(
              item.remark
            )}</div>

          </div>
        `
        : "";


    return `
      <article class="cargo-card">

        <div class="cargo-head">

          <div class="cargo-main">

            <div class="pier-label">
              PIER · ${escapeHTML(
                item.pier || "—"
              )}
            </div>

            <h2 class="cargo-name">
              ${escapeHTML(
                item.name || "UNTITLED"
              )}
            </h2>

          </div>


          <div class="cargo-actions">

            <button
              class="small-btn"
              type="button"
              onclick="editCargo(${Number(item.id)})"
            >
              EDIT
            </button>

            <button
              class="small-btn delete"
              type="button"
              onclick="deleteCargo(${Number(item.id)})"
            >
              DELETE
            </button>

          </div>

        </div>


        <div class="work-section">

          <div class="section-label">
            WORKING
          </div>

          ${workingHTML}

        </div>


        <div class="quantity-section">

          <div class="quantity-title">
            QTY / DAY
          </div>

          ${quantityHTML}

        </div>


        ${remarkHTML}

      </article>
    `;
  }


  /* ==========================================
     SEARCH
     ========================================== */

  searchInput.addEventListener(
    "input",
    renderCargo
  );


  /* ==========================================
     MODAL
     ========================================== */

  function openCargoModal(item) {

    if (item) {

      editingCargoId =
        Number(item.id);

      modalTitle.textContent =
        "EDIT CARGO";

      nameInput.value =
        item.name || "";

      pierInput.value =
        item.pier || "";

      remarkInput.value =
        item.remark || "";

      workingDraft =
        cloneData(
          Array.isArray(item.working)
            ? item.working
            : []
        );

      quantityDraft =
        cloneData(
          Array.isArray(item.quantities)
            ? item.quantities
            : []
        );


    } else {

      editingCargoId = null;

      modalTitle.textContent =
        "ADD CARGO";

      nameInput.value = "";

      pierInput.value = "";

      remarkInput.value = "";

      workingDraft = [
        {
          time: "",
          gang: "",
          rate: ""
        }
      ];

      quantityDraft = [
        {
          qty: "",
          day: ""
        }
      ];
    }


    renderWorkingEditor();

    renderQuantityEditor();

    cargoModal.classList.add("show");


    setTimeout(
      function() {

        nameInput.focus();

      },
      50
    );
  }


  function closeCargoModal() {

    cargoModal.classList.remove("show");
  }


  /* ==========================================
     WORKING EDITOR
     ========================================== */

  function renderWorkingEditor() {

    if (!workingDraft.length) {

      workingEditor.innerHTML = `
        <div class="empty-quantity">
          No rows. Press + ADD ROW.
        </div>
      `;

      return;
    }


    workingEditor.innerHTML =
      workingDraft.map(
        function(row, index) {

          return `
            <div class="editor-row">

              <input
                type="text"
                placeholder="TIME"
                value="${escapeHTML(
                  row.time || ""
                )}"
                oninput="updateWorking(
                  ${index},
                  'time',
                  this.value
                )"
              >

              <input
                type="text"
                placeholder="GANG"
                value="${escapeHTML(
                  row.gang || ""
                )}"
                oninput="updateWorking(
                  ${index},
                  'gang',
                  this.value
                )"
              >

              <input
                type="text"
                placeholder="RATE"
                value="${escapeHTML(
                  row.rate || ""
                )}"
                oninput="updateWorking(
                  ${index},
                  'rate',
                  this.value
                )"
              >

              <button
                class="remove-row"
                type="button"
                onclick="removeWorking(
                  ${index}
                )"
              >
                ×
              </button>

            </div>
          `;

        }
      ).join("");
  }


  window.updateWorking =
    function(
      index,
      field,
      value
    ) {

      if (!workingDraft[index]) {
        return;
      }

      workingDraft[index][field] =
        value;
    };


  window.removeWorking =
    function(index) {

      workingDraft.splice(
        index,
        1
      );

      renderWorkingEditor();
    };


  document
    .getElementById("addWorkingBtn")
    .addEventListener(
      "click",
      function() {

        workingDraft.push({
          time: "",
          gang: "",
          rate: ""
        });

        renderWorkingEditor();
      }
    );


  /* ==========================================
     QUANTITY EDITOR
     ========================================== */

  function renderQuantityEditor() {

    if (!quantityDraft.length) {

      quantityEditor.innerHTML = `
        <div class="empty-quantity">
          No rows. Press + ADD ROW.
        </div>
      `;

      return;
    }


    quantityEditor.innerHTML =
      quantityDraft.map(
        function(row, index) {

          return `
            <div class="editor-row qty-row">

              <input
                type="text"
                placeholder="QTY"
                value="${escapeHTML(
                  row.qty || ""
                )}"
                oninput="updateQuantity(
                  ${index},
                  'qty',
                  this.value
                )"
              >

              <input
                type="text"
                placeholder="DAY"
                value="${escapeHTML(
                  row.day || ""
                )}"
                oninput="updateQuantity(
                  ${index},
                  'day',
                  this.value
                )"
              >

              <button
                class="remove-row"
                type="button"
                onclick="removeQuantity(
                  ${index}
                )"
              >
                ×
              </button>

            </div>
          `;

        }
      ).join("");
  }


  window.updateQuantity =
    function(
      index,
      field,
      value
    ) {

      if (!quantityDraft[index]) {
        return;
      }

      quantityDraft[index][field] =
        value;
    };


  window.removeQuantity =
    function(index) {

      quantityDraft.splice(
        index,
        1
      );

      renderQuantityEditor();
    };


  document
    .getElementById("addQuantityBtn")
    .addEventListener(
      "click",
      function() {

        quantityDraft.push({
          qty: "",
          day: ""
        });

        renderQuantityEditor();
      }
    );


  /* ==========================================
     ADD
     ========================================== */

  document
    .getElementById("addCargoBtn")
    .addEventListener(
      "click",
      function() {

        openCargoModal(null);
      }
    );


  /* ==========================================
     EDIT
     ========================================== */

  window.editCargo =
    function(id) {

      const item =
        cargoData.find(
          function(cargo) {

            return (
              Number(cargo.id) ===
              Number(id)
            );
          }
        );


      if (!item) {
        return;
      }


      openCargoModal(item);
    };


  /* ==========================================
     DELETE
     ========================================== */

  window.deleteCargo =
    async function(id) {

      const item =
        cargoData.find(
          function(cargo) {

            return (
              Number(cargo.id) ===
              Number(id)
            );
          }
        );


      if (!item) {
        return;
      }


      const confirmed =
        confirm(
          "Delete " +
          item.name +
          "?"
        );


      if (!confirmed) {
        return;
      }


      const backup =
        cloneData(cargoData);


      cargoData =
        cargoData.filter(
          function(cargo) {

            return (
              Number(cargo.id) !==
              Number(id)
            );
          }
        );


      renderCargo();


      try {

        await saveAllCargo();

      } catch (error) {

        console.error(error);

        cargoData = backup;

        renderCargo();


        showStatus(
          "Delete failed. " +
          error.message,
          "error"
        );


        alert(
          "DELETE FAILED\n\n" +
          error.message
        );
      }
    };


  /* ==========================================
     SAVE CARGO
     ========================================== */

  saveCargoBtn.addEventListener(
    "click",
    async function() {

      const name =
        nameInput.value.trim();


      if (!name) {

        alert(
          "Please enter cargo name."
        );

        nameInput.focus();

        return;
      }


      const cleanedWorking =
        workingDraft
          .map(
            function(row) {

              return {
                time:
                  String(
                    row.time || ""
                  ).trim(),

                gang:
                  String(
                    row.gang || ""
                  ).trim(),

                rate:
                  String(
                    row.rate || ""
                  ).trim()
              };

            }
          )
          .filter(
            function(row) {

              return (
                row.time ||
                row.gang ||
                row.rate
              );
            }
          );


      const cleanedQuantities =
        quantityDraft
          .map(
            function(row) {

              return {
                qty:
                  String(
                    row.qty || ""
                  ).trim(),

                day:
                  String(
                    row.day || ""
                  ).trim()
              };

            }
          )
          .filter(
            function(row) {

              return (
                row.qty ||
                row.day
              );
            }
          );


      const newItem = {

        id:
          editingCargoId !== null
            ? editingCargoId
            : nextId(),

        pier:
          pierInput.value.trim(),

        name: name,

        working:
          cleanedWorking,

        quantities:
          cleanedQuantities,

        remark:
          remarkInput.value.trim()
      };


      const backup =
        cloneData(cargoData);


      if (
        editingCargoId !== null
      ) {

        cargoData =
          cargoData.map(
            function(item) {

              if (
                Number(item.id) ===
                Number(editingCargoId)
              ) {

                return newItem;
              }

              return item;
            }
          );

      } else {

        cargoData.push(newItem);
      }


      renderCargo();


      saveCargoBtn.disabled = true;

      saveCargoBtn.textContent =
        "SAVING...";


      try {

        await saveAllCargo();

        closeCargoModal();


      } catch (error) {

        console.error(error);

        cargoData = backup;

        renderCargo();


        showStatus(
          "Save failed. " +
          error.message,
          "error"
        );


        alert(
          "SAVE FAILED\n\n" +
          error.message
        );

      } finally {

        saveCargoBtn.disabled = false;

        saveCargoBtn.textContent =
          "SAVE";
      }
    }
  );


  /* ==========================================
     CANCEL
     ========================================== */

  document
    .getElementById("cancelCargoBtn")
    .addEventListener(
      "click",
      closeCargoModal
    );


  cargoModal.addEventListener(
    "click",
    function(event) {

      if (
        event.target === cargoModal
      ) {

        closeCargoModal();
      }
    }
  );


  document.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Escape" &&
        cargoModal.classList
          .contains("show")
      ) {

        closeCargoModal();
      }
    }
  );


  /* ==========================================
     INITIAL LOAD
     ========================================== */

  loadCargo();
</script>

</body>
</html>
